# A project's release: every commit main moves forward to becomes an immutable GitHub Release,
# qualified by its full check on dev and carrying that check's artifacts, without a rebuild.
name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/release.yml@0000000000000000000000000000000000000000 # v0.0.0
    permissions:
      actions: read
      contents: write
