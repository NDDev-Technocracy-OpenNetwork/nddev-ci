name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner provider.
        type: choice
        options: [ours, github]
        default: ours
      runner-profile:
        description: Platform selected for a manual GitHub-hosted run.
        type: string
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@RELEASE_COMMIT # RELEASE_VERSION
    permissions:
      contents: read
