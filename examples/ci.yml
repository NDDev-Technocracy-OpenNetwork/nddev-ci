name: ci
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'github' && inputs.runner-profile != '' && 'Contour hosted fallback' || '' }}
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner provider.
        type: choice
        options: [ours, github]
        default: ours
      runner-profile:
        description: Platform requested for automatic fallback.
        type: string
permissions: {}
jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@RELEASE_COMMIT # RELEASE_VERSION
    permissions:
      contents: read
