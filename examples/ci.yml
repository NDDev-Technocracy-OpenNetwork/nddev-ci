# A project's checks: the short check and merge stops on a pull request, the full check on dev.
# Pin a released commit of the library with its version as the comment, so Dependabot proposes
# each new release.
name: ci

on:
  pull_request:
    # `labeled` lets the labels `runner:blacksmith` and `runner:github` rerun the check there.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      runner:
        description: Where a private repository's check runs.
        type: choice
        options: [ours, blacksmith, github]
        default: ours

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@0000000000000000000000000000000000000000 # v0.0.0
    permissions:
      contents: read
