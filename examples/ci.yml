# A project's whole CI: the library's check, pinned by commit.
name: ci

on:
  pull_request:
    # `labeled` lets the labels `runner:blacksmith` and `runner:github` rerun the check there.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      runner:
        description: Where a private repository's check runs.
        type: choice
        options: [ours, blacksmith, github]
        default: ours

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@0000000000000000000000000000000000000000 # replace with a commit of this repository
    permissions:
      contents: read
    # A check that reads more history, or other private repositories such as a superproject's
    # modules, passes them on:
    # with:
    #   fetch-depth: 0
    #   filter: blob:none
    # secrets:
    #   read-keys: |
    #     owner/repository
    #     ${{ secrets.REPOSITORY_READ_KEY }}
