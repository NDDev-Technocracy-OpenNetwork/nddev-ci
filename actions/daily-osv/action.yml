name: Daily dependency and licence reports
description: Run the prepared native OSV scanner with the daily report policy.
inputs:
  scanner:
    description: Absolute path to the verified OSV scanner prepared by this job.
    required: true
  output:
    description: Private job directory for osv.json and licenses.json.
    required: true
  licenses:
    description: Comma-separated SPDX licence allowlist.
    required: true
runs:
  using: node24
  main: run.mjs
