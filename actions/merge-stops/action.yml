name: Run pull request merge stops
description: >-
  Prepares verified merge-stop tools and runs authorship, secret, dependency, workflow, optional
  code clone, planner-speed and hint checks concurrently on one Linux runner.
inputs:
  base:
    description: Exact pull request base commit (defaults to the pull request base).
    default: ''
  head:
    description: Exact pull request head commit (defaults to the pull request head).
    default: ''
  merge:
    description: Exact checked merge commit (defaults to github.sha).
    default: ''
  head-ref:
    description: Pull request head branch name (defaults to github.head_ref).
    default: ''
  isolated-worktree:
    description: Read the exact merge in a temporary worktree, away from the project workspace.
    default: 'false'
  new-clones:
    description: Reject new code clones using the pull request base's .jscpd.json.
    default: 'false'
  upstream-branch:
    description: Optional branch in this repository that mirrors a fork's upstream.
    default: ''
  tool-pins:
    description: Optional JSON map of explicit version and per-arch sha256 tool pins for GitHub-hosted runners.
    default: ''
  github-token:
    description: Existing job token for GitHub release and object reads.
    default: ${{ github.token }}
outputs:
  failure-layer:
    description: "'project' when a merge stop judged the change; empty otherwise."
    value: ${{ steps.run.outputs.failure-layer }}
  failure-reason:
    description: Short plain reason code for the failing merge stop, if any.
    value: ${{ steps.run.outputs.failure-reason }}
runs:
  using: composite
  steps:
    - name: File contents of the change
      uses: $/actions/change-objects
      with:
        base: ${{ inputs.base || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        head: ${{ inputs.head || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        merge: ${{ inputs.merge || github.sha }}

    - name: Tools
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NEW_CLONES: ${{ inputs.new-clones }}
        TOOL_PINS: ${{ inputs.tool-pins }}
      run: node "$GITHUB_ACTION_PATH/prepare-tools.mjs"

    - name: Run merge stops
      id: run
      shell: bash
      env:
        MERGE_STOPS_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        MERGE_STOPS_HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        MERGE_STOPS_MERGE: ${{ inputs.merge || github.sha }}
        MERGE_STOPS_HEAD_REF: ${{ inputs.head-ref || github.head_ref || github.event.merge_group.head_ref }}
        MERGE_STOPS_ISOLATED_WORKTREE: ${{ inputs.isolated-worktree }}
        MERGE_STOPS_NEW_CLONES: ${{ inputs.new-clones }}
        MERGE_STOPS_UPSTREAM_BRANCH: ${{ inputs.upstream-branch }}
        MERGE_STOPS_GITHUB_TOKEN: ${{ inputs.github-token }}
        MERGE_STOPS_BIN: ${{ runner.temp }}/nddev-ci/bin
      run: node "$GITHUB_ACTION_PATH/run.mjs"
