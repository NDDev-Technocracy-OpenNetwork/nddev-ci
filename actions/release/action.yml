name: Publish an immutable release
description: >-
  Publishes one GitHub Release of the exact commit its full check on the integration branch
  verified, reusing that check's artifacts, with SHA256SUMS. A rerun completes the same release.
inputs:
  required-workflows:
    description: Additional workflow file names that must qualify the same exact source, one per line.
    default: ''
  release-metadata:
    description: Checked JSON metadata file names with schema_version, source_commit and product version, one per line.
    default: ''
  prerelease-file:
    description: Optional repository file naming a pre-release stage (X.Y.Z-alpha, -beta or -rc) at the exact commit.
    default: ''
  check-workflow:
    description: The workflow file whose push check on the integration branch qualifies the commit.
    default: ci.yml
  artifacts:
    description: Artifact names of the qualifying run, one per line; their top-level files are published.
    default: ''
  version:
    description: For a product, matches its checked metadata; otherwise selects an explicit newer tag.
    default: ''
  initial-version:
    description: The version of the first release when none exists.
    default: 0.1.0
  wait-minutes:
    description: How long a still running qualifying check is awaited.
    default: '30'
  github-token:
    description: A token with contents write and actions read.
    default: ${{ github.token }}
  api-url:
    description: Optional explicit metadata API source; empty uses github.api_url.
    default: ''
  artifact-api-url:
    description: Optional artifact transport API serving the same artifact download route.
    default: ''
  artifact-token:
    description: Optional separate read credential for the declared artifact transport.
    default: ''
outputs:
  state:
    description: published.
  version:
    description: The released version.
  tag:
    description: The release tag.
  prerelease:
    description: Whether the published release is a pre-release (true or false).
  url:
    description: The release page.
runs:
  using: node24
  main: run.mjs
