name: Check the project's direct choices
description: Verify and run the registry CLI selected by the protected snapshot.
inputs:
  base:
    description: Exact comparison commit of this change.
    default: ''
  block:
    description: Fail on new direct choices outside the registry.
    default: 'false'
  github-token:
    description: Existing job token for fetching the exact comparison commit.
    default: ${{ github.token }}
runs:
  using: node24
  main: run.mjs
