name: Prepare declared hosted SDKs
description: Prepare exact SDKs on external profiles or verify the managed SDKs selected by the caller.
inputs:
  managed:
    description: Optional explicit SDK ownership; empty follows runner.environment.
    default: ''
  node-version:
    description: Exact Node version, or empty to leave it unchanged.
    default: ''
  python-version:
    description: Exact Python version, or empty to leave it unchanged.
    default: ''
  uv-version:
    description: Exact uv version, or empty to leave it unchanged.
    default: ''
  bun-version:
    description: Exact Bun version, or empty to leave it unchanged.
    default: ''
  rust-version:
    description: Exact Rust version, or empty to leave it unchanged.
    default: ''
  rust-components:
    description: Optional comma-separated Rust components for the selected toolchain.
    default: ''
  java-version:
    description: Optional exact Temurin JDK version, such as 25.0.5.
    default: ''
  go-version:
    description: Optional exact Go version, such as 1.27.3.
    default: ''
  flutter-version:
    description: Optional exact stable Flutter version; its Dart SDK comes with it.
    default: ''
  tools:
    description: >-
      Optional comma-separated name@exact-version command-line tools from their official
      checksummed releases, such as cargo-nextest@0.9.151,cargo-deny@0.20.2.
    default: ''
  rust-targets:
    description: Optional comma-separated Rust targets for the selected toolchain.
    default: ''
outputs:
  receipt:
    description: JSON of measured versions and the native runner target.
    value: ${{ steps.verify.outputs.receipt }}
runs:
  using: composite
  steps:
    - name: Validate exact SDK selections
      id: validate
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SDK_ACTION_PATH: ${{ github.action_path }}
        SDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        SDK_MANAGED: ${{ inputs.managed }}
        SDK_NODE_VERSION: ${{ inputs.node-version }}
        SDK_PYTHON_VERSION: ${{ inputs.python-version }}
        SDK_UV_VERSION: ${{ inputs.uv-version }}
        SDK_BUN_VERSION: ${{ inputs.bun-version }}
        SDK_RUST_VERSION: ${{ inputs.rust-version }}
        SDK_RUST_COMPONENTS: ${{ inputs.rust-components }}
        SDK_RUST_TARGETS: ${{ inputs.rust-targets }}
        SDK_JAVA_VERSION: ${{ inputs.java-version }}
        SDK_GO_VERSION: ${{ inputs.go-version }}
        SDK_FLUTTER_VERSION: ${{ inputs.flutter-version }}
        SDK_TOOLS: ${{ inputs.tools }}
      with:
        script: |
          const action = await import(require("node:url").pathToFileURL(process.env.SDK_ACTION_PATH + "/run.mjs").href);
          action.main("validate");
    # SDKs that setup actions take from GitHub releases come from the job's cache when a previous
    # job of this repository prepared the same exact versions on the same image.
    - name: Restore exact SDKs from the tool cache
      id: tool-cache
      if: steps.validate.outputs.cache-key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.validate.outputs.cache-key }}
        path: ${{ steps.validate.outputs.cache-paths }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.validate.outputs.bootstrap == 'true' && inputs.node-version != ''
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: python
      if: steps.validate.outputs.bootstrap == 'true' && inputs.python-version != ''
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      if: steps.validate.outputs.bootstrap == 'true' && inputs.uv-version != ''
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: false
    - name: Resolve the exact native Bun asset
      id: bun-source
      if: steps.validate.outputs.bootstrap == 'true' && inputs.bun-version != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SDK_ACTION_PATH: ${{ github.action_path }}
        SDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        SDK_MANAGED: ${{ inputs.managed }}
        SDK_BUN_VERSION: ${{ inputs.bun-version }}
        SDK_GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
      with:
        script: |
          const action = await import(require("node:url").pathToFileURL(process.env.SDK_ACTION_PATH + "/bun.mjs").href);
          await action.main();
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      if: steps.validate.outputs.bootstrap == 'true' && inputs.bun-version != ''
      env:
        BUN_DO_NOT_TRACK: '1'
        DO_NOT_TRACK: '1'
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-download-url: ${{ steps.bun-source.outputs.url }}
        no-cache: true
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      if: steps.validate.outputs.bootstrap == 'true' && inputs.rust-version != ''
      with:
        toolchain: ${{ inputs.rust-version }}
        components: ${{ inputs.rust-components }}
        targets: ${{ inputs.rust-targets }}
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      if: steps.validate.outputs.bootstrap == 'true' && inputs.java-version != ''
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache-jdk: true
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: steps.validate.outputs.bootstrap == 'true' && inputs.go-version != ''
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    # flutter-action calls actions/cache by tag, which commit pinning refuses even when its cache is
    # off; the official archive is taken directly and verified by the manifest's SHA-256.
    - name: Prepare the exact Flutter SDK
      if: steps.validate.outputs.bootstrap == 'true' && inputs.flutter-version != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SDK_ACTION_PATH: ${{ github.action_path }}
        SDK_FLUTTER_VERSION: ${{ inputs.flutter-version }}
      with:
        script: |
          const action = await import(require("node:url").pathToFileURL(process.env.SDK_ACTION_PATH + "/flutter.mjs").href);
          await action.install();
    - name: Flutter and Dart analytics off
      if: steps.validate.outputs.bootstrap == 'true' && inputs.flutter-version != ''
      shell: bash
      run: |
        set -euo pipefail
        flutter config --no-analytics --no-cli-animations
        dart --disable-analytics
    # install-action verifies each archive against its checksum manifest; nothing is compiled
    # and no other source is tried.
    - name: Prepare the declared tools
      if: steps.validate.outputs.bootstrap == 'true' && inputs.tools != ''
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: ${{ inputs.tools }}
        checksum: true
        fallback: none
    - name: Verify selected executables and isolate package preparation
      id: verify
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SDK_ACTION_PATH: ${{ github.action_path }}
        SDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        SDK_MANAGED: ${{ inputs.managed }}
        SDK_NODE_VERSION: ${{ inputs.node-version }}
        SDK_PYTHON_VERSION: ${{ inputs.python-version }}
        SDK_UV_VERSION: ${{ inputs.uv-version }}
        SDK_BUN_VERSION: ${{ inputs.bun-version }}
        SDK_RUST_VERSION: ${{ inputs.rust-version }}
        SDK_RUST_COMPONENTS: ${{ inputs.rust-components }}
        SDK_RUST_TARGETS: ${{ inputs.rust-targets }}
        SDK_JAVA_VERSION: ${{ inputs.java-version }}
        SDK_GO_VERSION: ${{ inputs.go-version }}
        SDK_FLUTTER_VERSION: ${{ inputs.flutter-version }}
        SDK_TOOLS: ${{ inputs.tools }}
        SDK_PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        BUN_DO_NOT_TRACK: '1'
        DO_NOT_TRACK: '1'
      with:
        script: |
          const action = await import(require("node:url").pathToFileURL(process.env.SDK_ACTION_PATH + "/run.mjs").href);
          action.main("verify");
    - name: Keep exact SDKs in the tool cache
      if: steps.validate.outputs.cache-key != '' && steps.tool-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.validate.outputs.cache-key }}
        path: ${{ steps.validate.outputs.cache-paths }}
