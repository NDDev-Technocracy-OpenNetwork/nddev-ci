name: Prepare declared hosted SDKs
description: Prepare exact SDKs on external profiles or verify the managed SDKs selected by the caller.
inputs:
  managed:
    description: Optional explicit SDK ownership; empty follows runner.environment.
    default: ''
  toolchains:
    description: >-
      Optional comma-separated registry toolchain names (such as node,rust,python,uv,bun,go,java,dart,flutter,dotnet,ruby,android)
      resolved from NDDEV_CI_REGISTRY_SNAPSHOT when present.
    default: ''
  node-version:
    description: Exact Node version from the managed tool cache or hosted setup, or empty to leave it unchanged.
    default: ''
  python-version:
    description: Exact Python version, or empty to leave it unchanged.
    default: ''
  uv-version:
    description: Exact uv version, or empty to leave it unchanged.
    default: ''
  bun-version:
    description: Exact Bun version, or empty to leave it unchanged.
    default: ''
  rust-version:
    description: Exact Rust version, or empty to leave it unchanged.
    default: ''
  rust-components:
    description: Optional comma-separated components for the selected Rust toolchain.
    default: ''
  java-version:
    description: Optional exact Temurin JDK version, such as 25.0.5.
    default: ''
  go-version:
    description: Optional exact Go version, such as 1.27.3.
    default: ''
  dart-version:
    description: Optional exact standalone Dart SDK version.
    default: ''
  flutter-version:
    description: Optional exact stable Flutter version; its Dart SDK comes with it.
    default: ''
  dotnet-version:
    description: Optional exact .NET SDK version, such as 11.0.100.
    default: ''
  ruby-version:
    description: Optional exact Ruby version, such as 4.0.10.
    default: ''
  android-sdk:
    description: >-
      Optional comma-separated Android SDK packages as name@exact-version (or bare names when
      NDDEV_CI_REGISTRY_SNAPSHOT is set): cmdline-tools, platform-tools, build-tools, platform,
      ndk, cmake (each also accepted with an android- prefix).
    default: ''
  tools:
    description: >-
      Optional comma-separated name@exact-version command-line tools (or bare registry names when
      NDDEV_CI_REGISTRY_SNAPSHOT is set) from their official checksummed releases. A managed runner
      takes each from its SDK and puts the declared line first on PATH.
    default: ''
  rust-targets:
    description: Optional comma-separated Rust targets for the selected toolchain.
    default: ''
outputs:
  receipt:
    description: JSON of measured versions and the native runner target.
    value: ${{ steps.verify.outputs.receipt }}
runs:
  using: composite
  steps:
    - name: Validate exact SDK selections
      id: validate
      uses: $/actions/hosted-sdk-step
      env:
        SDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        SDK_MANAGED: ${{ inputs.managed }}
        SDK_TOOLCHAINS: ${{ inputs.toolchains }}
        SDK_NODE_VERSION: ${{ inputs.node-version }}
        SDK_PYTHON_VERSION: ${{ inputs.python-version }}
        SDK_UV_VERSION: ${{ inputs.uv-version }}
        SDK_BUN_VERSION: ${{ inputs.bun-version }}
        SDK_RUST_VERSION: ${{ inputs.rust-version }}
        SDK_RUST_COMPONENTS: ${{ inputs.rust-components }}
        SDK_RUST_TARGETS: ${{ inputs.rust-targets }}
        SDK_JAVA_VERSION: ${{ inputs.java-version }}
        SDK_GO_VERSION: ${{ inputs.go-version }}
        SDK_FLUTTER_VERSION: ${{ inputs.flutter-version }}
        SDK_DART_VERSION: ${{ inputs.dart-version }}
        SDK_DOTNET_VERSION: ${{ inputs.dotnet-version }}
        SDK_RUBY_VERSION: ${{ inputs.ruby-version }}
        SDK_ANDROID_SDK: ${{ inputs.android-sdk }}
        SDK_TOOLS: ${{ inputs.tools }}
      with:
        step: validate
    # SDKs that setup actions take from GitHub releases come from the job's cache when a previous
    # job of this repository prepared the same exact versions on the same image.
    - name: Restore exact SDKs from the tool cache
      id: tool-cache
      if: steps.validate.outputs.cache-key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.validate.outputs.cache-key }}
        path: ${{ steps.validate.outputs.cache-paths }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.node-version != ''
      with:
        node-version: ${{ steps.validate.outputs.node-version }}
        package-manager-cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: python
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.python-version != ''
      with:
        python-version: ${{ steps.validate.outputs.python-version }}
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.uv-version != ''
      with:
        version: ${{ steps.validate.outputs.uv-version }}
        enable-cache: false
    - name: Resolve the exact native Bun asset
      id: bun-source
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.bun-version != ''
      uses: $/actions/hosted-sdk-step
      env:
        SDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        SDK_MANAGED: ${{ inputs.managed }}
        SDK_BUN_VERSION: ${{ steps.validate.outputs.bun-version }}
        SDK_GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
      with:
        step: bun
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.bun-version != ''
      env:
        BUN_DO_NOT_TRACK: '1'
        DO_NOT_TRACK: '1'
      with:
        bun-version: ${{ steps.validate.outputs.bun-version }}
        bun-download-url: ${{ steps.bun-source.outputs.url }}
        no-cache: true
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.rust-version != ''
      with:
        toolchain: ${{ steps.validate.outputs.rust-version }}
        components: ${{ inputs.rust-components }}
        targets: ${{ inputs.rust-targets }}
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.java-version != ''
      with:
        distribution: temurin
        java-version: ${{ steps.validate.outputs.java-version }}
        cache-jdk: true
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.go-version != ''
      with:
        go-version: ${{ steps.validate.outputs.go-version }}
        cache: false
    # flutter-action calls actions/cache by tag, which commit pinning refuses even when its cache is
    # off; the official archive is taken directly and verified by the manifest's SHA-256.
    - name: Prepare the exact Flutter SDK
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.flutter-version != ''
      uses: $/actions/hosted-sdk-step
      env:
        SDK_FLUTTER_VERSION: ${{ steps.validate.outputs.flutter-version }}
      with:
        step: flutter
    - name: Flutter and Dart analytics off
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.flutter-version != ''
      shell: bash
      run: |
        set -euo pipefail
        flutter config --no-analytics --no-cli-animations
        dart --disable-analytics
    - name: Prepare the exact standalone Dart SDK
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.dart-version != ''
      uses: $/actions/hosted-sdk-step
      env:
        SDK_DART_VERSION: ${{ steps.validate.outputs.dart-version }}
      with:
        step: dart
    - name: Standalone Dart analytics off
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.dart-version != ''
      shell: bash
      run: dart --disable-analytics
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.dotnet-version != ''
      with:
        dotnet-version: ${{ steps.validate.outputs.dotnet-version }}
        cache: false
    - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.ruby-version != ''
      with:
        ruby-version: ${{ steps.validate.outputs.ruby-version }}
        rubygems: default
        bundler: none
        bundler-cache: false
        windows-toolchain: none
    # Android SDK packages are resolved directly from Google's official repository2-3.xml manifest,
    # verified by published size and checksum, and installed in the managed ANDROID_HOME layout.
    - name: Prepare the exact Android SDK
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.android-sdk != ''
      uses: $/actions/hosted-sdk-step
      env:
        SDK_ANDROID_SDK: ${{ steps.validate.outputs.android-sdk }}
      with:
        step: android
    # install-action verifies each archive against its checksum manifest; nothing is compiled
    # and no other source is tried.
    - name: Prepare the declared tools
      if: steps.validate.outputs.bootstrap == 'true' && steps.validate.outputs.tools != ''
      uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
      with:
        tool: ${{ steps.validate.outputs.tools }}
        checksum: true
        fallback: none
    - name: Verify selected executables and isolate package preparation
      id: verify
      uses: $/actions/hosted-sdk-step
      env:
        SDK_SELECTION: ${{ steps.validate.outputs.selection }}
        SDK_PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        BUN_DO_NOT_TRACK: '1'
        DO_NOT_TRACK: '1'
      with:
        step: verify
    - name: Keep exact SDKs in the tool cache
      if: >-
        steps.validate.outputs.cache-key != '' && steps.tool-cache.outputs.cache-hit != 'true' &&
        (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.validate.outputs.cache-key }}
        path: ${{ steps.validate.outputs.cache-paths }}
