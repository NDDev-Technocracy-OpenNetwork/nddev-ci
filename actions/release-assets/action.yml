name: Prepare pinned release assets
description: Prepare exact public tool bytes in a disposable hosted runner directory.
inputs:
  manifest:
    description: JSON manifest inside the checkout, containing schema_version 1 and an assets array.
    required: true
  directory:
    description: Destination inside the checked-out workspace or RUNNER_TEMP.
    required: true
  github-token:
    description: Existing job token used only for official public asset API reads.
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
outputs:
  directory:
    description: The prepared asset directory.
runs:
  using: node24
  main: run.mjs
