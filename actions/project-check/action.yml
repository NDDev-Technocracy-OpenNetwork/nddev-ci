name: Run the project's checks
description: Run the project recipes declared for a short check or a full-check part, reusing verified step receipts when inputs match.
inputs:
  setup:
    description: Run just setup first.
    default: 'false'
  part:
    description: The full-check part's literal argument array, or empty to run just verify.
    default: ''
  receipt-token:
    description: Repository token used only to check the receipt's source run.
    default: ''
  receipt-inputs:
    description: JSON snapshot of caller workflow inputs for receipt key and policy evaluation.
    default: '{}'
outputs:
  runner-reason:
    description: A runner failure reason detected in the failed recipe, when available.
    value: ${{ steps.command.outputs.runner-reason }}
  receipt-mode:
    description: "Step receipt mode: reused, executed, bypassed or canary."
    value: ${{ steps.receipt-finish.outputs.receipt-mode }}
  reused-run-id:
    description: Numeric GitHub run ID of the reused receipt source, if any.
    value: ${{ steps.receipt-finish.outputs.reused-run-id }}
  bypass-reason:
    description: Non-empty reason when step-receipt reuse was bypassed.
    value: ${{ steps.receipt-finish.outputs.bypass-reason }}
  canary-result:
    description: Canary comparison result (match or mismatch), when applicable.
    value: ${{ steps.receipt-finish.outputs.canary-result }}
runs:
  using: composite
  steps:
    - name: Prepare step receipts
      id: receipt-prepare
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        SETUP: ${{ inputs.setup }}
        PART: ${{ inputs.part }}
        PRIVATE_REPO: ${{ github.event.repository.private }}
        GH_TOKEN: ${{ inputs.receipt-token }}
        RECEIPT_INPUTS: ${{ inputs.receipt-inputs }}
        NDDEV_CI_ACTION_REF: ${{ github.action_ref }}
        NDDEV_CI_ACTION_REPO: ${{ github.action_repository }}
        GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      run: node "$GITHUB_ACTION_PATH/receipts.mjs" prepare

    - id: command
      shell: bash
      env:
        PROJECT_COMMAND: ${{ github.action_path }}/../../lib/project-command.mjs
        EVENT: ${{ github.event_name }}
        SETUP: ${{ inputs.setup }}
        PART: ${{ inputs.part }}
        RECEIPT_PLAN: ${{ steps.receipt-prepare.outputs.plan-file }}
        RECEIPT_RESULTS: ${{ steps.receipt-prepare.outputs.results-file }}
      run: |
        set -euo pipefail
        # recipe-dispatch:begin
        project_just() {
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u RECEIPT_PLAN -u RECEIPT_RESULTS node "$PROJECT_COMMAND" just "$@"
          else
            env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u RECEIPT_PLAN -u RECEIPT_RESULTS just "$@"
          fi
        }
        if [ -n "${RECEIPT_PLAN:-}" ] && [ -f "$RECEIPT_PLAN" ]; then
          all_skipped=$(node -e 'console.log(Boolean(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).all_skipped))' "$RECEIPT_PLAN" | tr -d '\r')
          if [ "$all_skipped" = true ]; then
            node -e 'for(const s of JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).steps) console.log("Reused step receipt for `just "+s.argv.join(" ")+"` from run #"+(s.reusedRunId??"?")+" ("+(s.reusedRunUrl??"")+")")' "$RECEIPT_PLAN" | tr -d '\r'
          else
            if [ "$SETUP" = true ]; then
              project_just setup
            fi
            count=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).steps.length)' "$RECEIPT_PLAN" | tr -d '\r')
            for ((i = 0; i < count; i++)); do
              skip=$(node -e 'console.log(Boolean(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).steps[Number(process.argv[2])].skip))' "$RECEIPT_PLAN" "$i" | tr -d '\r')
              if [ "$skip" = true ]; then
                node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).steps[Number(process.argv[2])]; console.log("Reused step receipt for `just "+s.argv.join(" ")+"` from run #"+(s.reusedRunId??"?")+" ("+(s.reusedRunUrl??"")+")")' "$RECEIPT_PLAN" "$i" | tr -d '\r'
                continue
              fi
              argv=()
              while IFS= read -r argument; do argv+=("$argument"); done < <(node -e 'for(const a of JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).steps[Number(process.argv[2])].argv) console.log(a)' "$RECEIPT_PLAN" "$i" | tr -d '\r')
              if project_just "${argv[@]}"; then
                printf '%s\n' "$i" >> "${RECEIPT_RESULTS}"
              else
                status=$?
                printf 'failed:%s:%s\n' "$i" "$status" >> "${RECEIPT_RESULTS}"
                exit "$status"
              fi
            done
          fi
        else
          if [ "$SETUP" = true ]; then
            project_just setup
          fi
          if [ "$EVENT" = pull_request ]; then
            project_just check
            recipes=$(just --dump --dump-format json)
            if node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); process.exit((Object.hasOwn(r.recipes||{},"test")||Object.hasOwn(r.aliases||{},"test"))?0:1)' <<< "$recipes"; then
              project_just test
            else
              echo "This repository declares no test recipe."
            fi
          else
            argv=(verify)
            if [ -n "${PART:-}" ] && [ "$PART" != "[]" ]; then
              argv=()
              while IFS= read -r argument; do argv+=("$argument"); done < <(node -e 'for(const x of JSON.parse(process.argv[1])) console.log(x)' "$PART" | tr -d '\r')
            fi
            project_just "${argv[@]}"
          fi
        fi
        # recipe-dispatch:end

    - name: Record step receipts
      id: receipt-finish
      if: ${{ !cancelled() && steps.receipt-prepare.outputs.plan-file != '' }}
      shell: bash
      env:
        RECEIPT_PLAN: ${{ steps.receipt-prepare.outputs.plan-file }}
        RECEIPT_RESULTS: ${{ steps.receipt-prepare.outputs.results-file }}
        RUNNER_REASON: ${{ steps.command.outputs.runner-reason }}
      run: node "$GITHUB_ACTION_PATH/receipts.mjs" finish
