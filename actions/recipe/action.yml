name: Run a project recipe
description: Run a declared just recipe with structured arguments on a prepared native runner.
inputs:
  managed:
    description: Optional explicit SDK ownership; empty follows runner.environment.
    default: ''
  just-version:
    description: Optional exact Just version; managed runners resolve from the registry snapshot or managed SDK.
    default: ''
  recipe:
    description: The declared recipe name.
    required: true
  arguments:
    description: JSON array of string arguments, passed without an intermediate shell.
    default: '[]'
  working-directory:
    description: Directory inside the checked-out workspace.
    default: '.'
  justfile:
    description: Justfile relative to the working directory.
    default: justfile
  github-token:
    description: Existing job token used only for official public asset API reads.
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
  receipt-inputs:
    description: Optional JSON snapshot of caller workflow inputs enabling gateway step-receipt reuse.
    default: ''
outputs:
  just-version:
    description: The admitted task runner version.
  runner-reason:
    description: A runner failure reason detected in the failed recipe, when available.
  upstream-reason:
    description: A bounded upstream service failure reason detected in the failed recipe, when available.
  receipt-mode:
    description: "Step receipt mode: reused, executed, bypassed or canary."
  reused-run-id:
    description: Numeric GitHub run ID of the reused receipt source, if any.
  bypass-reason:
    description: Non-empty reason when step-receipt reuse was bypassed.
  canary-result:
    description: Canary comparison result (match or mismatch), when applicable.
runs:
  using: node24
  main: run.mjs
