name: Check change authorship
description: Reject generated assistant signatures in introduced commits and pull request text.
inputs:
  base:
    description: Exact pull request base commit.
    required: true
  head:
    description: Exact pull request head commit.
    required: true
  upstream-branch:
    description: Optional branch in this repository that mirrors a fork's upstream; its ancestry is skipped.
    required: false
    default: ''
runs:
  using: node24
  main: run.mjs
