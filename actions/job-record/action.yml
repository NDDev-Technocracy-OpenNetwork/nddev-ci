name: Job record
description: >-
  Ends a job with its summary and one structured JSON record with OpenTelemetry field names:
  the pipeline, task, source revision, runner, duration, compiler-cache use and result. The record
  goes to the job log; when our runner names a telemetry file in NDDEV_CI_TELEMETRY_FILE, it is
  appended there too, and the contour delivers it to its observability stack.
inputs:
  task:
    description: The task's name, such as short check, full check or just test.
    required: true
  task-type:
    description: build, test or deploy.
    default: test
  status:
    description: The job's status at this point, normally job.status.
    required: true
  check-run-id:
    description: >-
      The job's numeric GitHub ID, normally job.check_run_id, recorded as nddev_ci.job.check_run_id
      so a record joins the GitHub job exactly; empty records none.
    default: ''
  started-file:
    description: A file holding the job's start as Unix seconds; empty measures nothing.
    default: ''
  schedule:
    description: The triggering daily UTC cron expression for the security job, if available.
    default: ''
  failure-layer:
    description: >-
      For a failed job, whose failure it is: project when the project's own commands or its named
      reports failed, library when a step of the library around them failed, or upstream when an
      exhausted external service error stopped the job. Empty records nothing; a job that did not
      fail records nothing either.
    default: ''
  failure-reason:
    description: >-
      For a failed job, a short plain reason code (lowercase ASCII letters, digits and hyphens,
      1-64 characters) naming the failure class. A failed job always records nddev_ci.failure.reason,
      using runner-reason when runner-attributed, upstream-reason when upstream-attributed,
      otherwise failure-reason, or a layer fallback.
    default: ''
  runner-reason:
    description: A fixed reason code that attributes a failed job to the runner.
    default: ''
  upstream-reason:
    description: A fixed reason code that attributes a failed job to an exhausted upstream service failure.
    default: ''
  receipt-mode:
    description: Optional step-receipt mode (reused, executed, bypassed or canary).
    default: ''
  reused-run-id:
    description: Optional numeric GitHub run ID whose step receipt was reused.
    default: ''
  bypass-reason:
    description: Optional short reason code when step-receipt reuse was bypassed.
    default: ''
  canary-result:
    description: Optional canary comparison outcome (match or mismatch).
    default: ''
runs:
  using: node24
  main: run.mjs
