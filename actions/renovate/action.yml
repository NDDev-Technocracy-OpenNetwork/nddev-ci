name: Run managed Renovate
description: Validate and run a caller-selected managed Renovate without installing another toolchain.
inputs:
  mode:
    description: prepare, run or cleanup.
    required: true
  version:
    description: Exact stable version supplied by the caller.
    required: true
  repositories:
    description: Explicit owner/repository names, one per line, in the caller's organization.
    required: true
  directory:
    description: Private temporary directory returned by prepare.
    default: ''
  timeout-minutes:
    description: Whole-job execution bound below the App token's one-hour lifetime.
    default: '45'
  github-token:
    description: Scoped installation token, passed only to run.
    default: ''
  dockerhub-username:
    description: Optional Docker Hub read user.
    default: ''
  dockerhub-token:
    description: Optional Docker Hub read credential, passed only to run.
    default: ''
outputs:
  repository-names:
    description: Validated names for the installation-token request.
  directory:
    description: Private temporary workspace, removed by cleanup.
runs:
  using: node24
  main: run.mjs
