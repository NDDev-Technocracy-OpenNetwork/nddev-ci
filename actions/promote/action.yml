name: Choose the commit to promote
description: >-
  Finds the newest commit of the source branch, ahead of the target, whose newest full check on a
  push passed, or qualifies one exact source commit when `sha` is supplied. It moves nothing; the
  promote workflow does.
inputs:
  required-workflows:
    description: Additional workflow file names that must qualify the same exact source, one per line.
    default: ''
  release-metadata:
    description: Checked JSON metadata file names with schema_version, source_commit and product version, one per line.
    default: ''
  artifacts:
    description: Qualifying artifact names holding the product metadata, one per line.
    default: ''
  prerelease-file:
    description: Optional repository file checked at the candidate commit for an active pre-release stage.
    default: ''
  check-workflow:
    description: The workflow file whose push check on the source branch qualifies a commit.
    default: ci.yml
  source-branch:
    description: The branch the target moves forward to.
    default: dev
  target-branch:
    description: The branch that moves.
    default: main
  sha:
    description: Optional full 40-character lowercase commit SHA on the source branch to promote instead of selecting the newest qualified commit.
    default: ''
  github-token:
    description: A token that reads contents and actions.
    default: ${{ github.token }}
outputs:
  state:
    description: ready, current, unchecked or unversioned.
  sha:
    description: The commit to promote when the state is ready.
  upstream-reason:
    description: Bounded upstream failure reason when exhausted GitHub or registry errors stop promotion selection.
runs:
  using: node24
  main: run.mjs
