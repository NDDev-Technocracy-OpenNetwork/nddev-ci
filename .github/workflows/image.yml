# A project's container image, built once in CI. A pull request builds it to
# prove the Dockerfile and pushes nothing; dev, main and runs by hand push it to GitHub's
# container registry under the immutable tag sha-<commit>, with BuildKit's provenance and SBOM
# attestations. The release tags that exact digest with its version (image-tag.yml), and the
# release's security run scans it (security.yml with images).
name: image

on:
  workflow_call:
    inputs:
      image:
        description: The image name inside the owner's namespace, such as platform-backend.
        type: string
        required: true
      context:
        description: The build context inside the repository.
        type: string
        default: .
      dockerfile:
        description: The Dockerfile path inside the repository.
        type: string
        default: Dockerfile
      target:
        description: The Dockerfile stage to build; empty builds the last one.
        type: string
        default: ""
      build-args:
        description: Build arguments, one NAME=value per line; never secrets.
        type: string
        default: ""
      push:
        description: Pushes outside pull requests; false only builds.
        type: boolean
        default: true
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      hosted-runner:
        description: >-
          The GitHub-hosted Linux runner of a public repository, which also decides the image's
          native platform: ubuntu-24.04 (linux/amd64) or ubuntu-24.04-arm (linux/arm64).
        type: string
        default: ubuntu-24.04
    outputs:
      reference:
        description: The pushed image by digest, ghcr.io/<owner>/<image>@sha256:<digest>; empty when nothing was pushed.
        value: ${{ jobs.image.outputs.reference }}

permissions: {}

jobs:
  image:
    name: image ${{ inputs.image }}
    if: github.event.action != 'labeled'
    # Public repositories build on GitHub's runners; an unknown hosted label fails below.
    runs-on: ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || (inputs.runner == 'nddev-macos' && 'nddev-linux-arm64' || inputs.runner) }}
    concurrency:
      # Each runner of one image has its own group, so x64 and ARM64 builds never cancel each other.
      group: nddev-ci-image-${{ github.workflow }}-${{ inputs.image }}-${{ inputs.hosted-runner }}-${{ inputs.runner }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    permissions:
      contents: read # read the source
      packages: write # push the image and its attestations to GitHub's container registry
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      - name: Image name and inputs
        id: name
        env:
          PRIVATE: ${{ github.event.repository.private }}
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          if [ "$PRIVATE" != true ]; then
            case "$HOSTED_RUNNER" in ubuntu-24.04 | ubuntu-24.04-arm) ;; *) echo "::error::hosted-runner must be ubuntu-24.04 or ubuntu-24.04-arm"; exit 1 ;; esac
          fi
          [[ "$IMAGE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo "::error::image must be a plain lowercase image name"; exit 1; }
          for path in "$CONTEXT" "$DOCKERFILE"; do
            case "/$path/" in //* | */../*) echo "::error::context and dockerfile stay inside the repository"; exit 1 ;; esac
          done
          echo "name=ghcr.io/${OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
          date +%s > "$RUNNER_TEMP/nddev-ci-started"
          [ "$RUNNER_OS" = Linux ] || { echo "::error::images require a native Linux runner"; exit 1; }
          case "$(uname -m)" in
            x86_64) echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64 | arm64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::images build natively on Linux x64 or ARM64"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Outside telemetry off
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@9795917fc97bf71b2761e609a87adbb189119894

      # A managed runner offers a package mirror on its loopback. A build step reaches it only on
      # the host network, and each package manager finds it by its own standard variable, which
      # a Dockerfile takes by declaring that argument. On a GitHub-hosted runner none is set.
      - name: Package mirror of a managed runner
        id: mirror
        run: |
          set -euo pipefail
          mirror="${NDDEV_CI_ARTIFACT_REGISTRY:-}"
          mirror="${mirror%/}"
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ] || [ -z "$mirror" ]; then
            exit 0
          fi
          [[ "$mirror" =~ ^http://127\.0\.0\.1:[0-9]{2,5}$ ]] || { echo "::error::the runner's package mirror must be a loopback HTTP address"; exit 1; }
          {
            echo "network=host"
            echo "allow=network.host"
            echo "driver=network=host"
            echo "flags=--allow-insecure-entitlement network.host"
            echo "arguments<<ARGUMENTS"
            echo "CARGO_SOURCE_CRATES_IO_REPLACE_WITH=mirror"
            echo "CARGO_SOURCE_MIRROR_REGISTRY=sparse+$mirror/crates-index/"
            echo "RUSTUP_DIST_SERVER=$mirror/rustup"
            echo "NPM_CONFIG_REGISTRY=$mirror/npm/"
            echo "PIP_INDEX_URL=$mirror/pypi/simple/"
            echo "PIP_TRUSTED_HOST=127.0.0.1"
            echo "UV_DEFAULT_INDEX=$mirror/pypi/simple/"
            echo "GOPROXY=$mirror/goproxy"
            echo "PUB_HOSTED_URL=$mirror/pub"
            # apt takes no mirror by a variable, but it follows the proxy variable for its
            # plain-HTTP archives, and the mirror answers apt as that proxy. These two are
            # predefined build arguments, so a Dockerfile declares nothing for them.
            echo "http_proxy=$mirror"
            echo "no_proxy=127.0.0.1,localhost"
            echo "ARGUMENTS"
            # The builder pulls base images itself and does not read the Docker daemon's mirrors,
            # so it gets the same mirror for each registry the runner serves.
            host="${mirror#http://}"
            echo "config<<CONFIG"
            for registry in docker.io ghcr.io gcr.io cgr.dev; do
              printf '[registry."%s"]\n  mirrors = ["%s/%s"]\n' "$registry" "$host" "$registry"
            done
            printf '[registry."%s"]\n  http = true\n' "$host"
            echo "CONFIG"
          } >> "$GITHUB_OUTPUT"

      # Buildx is one pinned release. A managed runner takes its binary through the artifact
      # registry, which serves a release asset only by its digest, and installs it as the Docker
      # plugin of this job; the next step then uses it as it is. Elsewhere that step downloads
      # the same release itself.
      - name: Buildx of a managed runner
        id: buildx
        env:
          BUILDX_VERSION: v0.38.2
          BUILDX_SHA256_X64: 7992ec09413b80ff57ba4e081f56fc833d7bac1d5e71143c6c809e7e6065f6d6
          BUILDX_SHA256_ARM64: 46c0f334772de3cb0b341cc415caf7339fb5cfc8b8438ebcb5a10e7f23800d36
        run: |
          set -euo pipefail
          mirror="${NDDEV_CI_ARTIFACT_REGISTRY:-}"
          mirror="${mirror%/}"
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ] || [ -z "$mirror" ]; then
            echo "version=$BUILDX_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) arch=amd64 digest=$BUILDX_SHA256_X64 ;;
            aarch64 | arm64) arch=arm64 digest=$BUILDX_SHA256_ARM64 ;;
            *) echo "::error::image builds on managed runners support Linux x64 and ARM64"; exit 1 ;;
          esac
          plugins="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$plugins"
          curl -fsSL -o "$plugins/docker-buildx.download" \
            "$mirror/github-releases/sha256/$digest/docker/buildx/releases/download/$BUILDX_VERSION/buildx-$BUILDX_VERSION.linux-$arch"
          echo "$digest  $plugins/docker-buildx.download" | sha256sum --check --quiet
          chmod 0755 "$plugins/docker-buildx.download"
          mv "$plugins/docker-buildx.download" "$plugins/docker-buildx"
          docker buildx version
          # An empty version tells the next step to use the installed plugin.
          echo "version=" >> "$GITHUB_OUTPUT"

      - name: BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ steps.buildx.outputs.version }}
          # The pinned binary is downloaded and verified each time, never restored from a cache
          # a pull request could have written.
          cache-binary: false
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
            ${{ steps.mirror.outputs.driver }}
          # The builder allows the host network only where the build uses it for the mirror.
          buildkitd-flags: ${{ steps.mirror.outputs.flags }}
          buildkitd-config-inline: ${{ steps.mirror.outputs.config }}

      - name: Container registry
        if: github.event_name != 'pull_request' && inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: |
            ${{ inputs.build-args }}
            ${{ steps.mirror.outputs.arguments }}
          network: ${{ steps.mirror.outputs.network }}
          allow: ${{ steps.mirror.outputs.allow }}
          platforms: ${{ steps.name.outputs.platform }}
          push: ${{ github.event_name != 'pull_request' && inputs.push }}
          tags: ${{ steps.name.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          # GitHub's runners keep BuildKit layers in the repository's Actions cache; our runners
          # use their own BuildKit state.
          cache-from: ${{ runner.environment == 'github-hosted' && format('type=gha,scope=image-{0}', inputs.image) || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && github.event_name != 'pull_request' && format('type=gha,mode=max,scope=image-{0}', inputs.image) || '' }}

      - name: Image reference
        id: reference
        env:
          PUSHED: ${{ github.event_name != 'pull_request' && inputs.push }}
          NAME: ${{ steps.name.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$PUSHED" = true ]; then
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build reported no image digest"; exit 1; }
            echo "reference=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
            echo "### Image $NAME@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Image $NAME built, not pushed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Job record
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/job-record@61838fd37d12ec6a853c9ca11d0fc1423d705273
        with:
          task: image ${{ inputs.image }}
          task-type: build
          status: ${{ job.status }}
          started-file: ${{ runner.temp }}/nddev-ci-started
