# Moves main to the newest dev commit whose full check and smoke checks passed, and publish.yml
# releases it. Each of those checks of a dev push starts it when it completes.
name: promotion

on:
  # The pinned promotion selects checked dev pushes and executes no triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci, portable recipe, qualified artifact, trusted source status]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    uses: ./.github/workflows/promote.yml
    with:
      required-workflows: |
        recipe-smoke.yml
        qualification-smoke.yml
        source-version-smoke.yml
    # The deploy key lives in the promotion environment, which only dev may use.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: read
      contents: read
