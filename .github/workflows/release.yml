# A project's release: every commit main moves forward to becomes one immutable GitHub Release,
# qualified by the full check of that exact commit on dev and carrying that check's artifacts,
# with deployment handled by the caller.
name: release

on:
  workflow_call:
    inputs:
      api-url:
        description: Optional explicit metadata API source.
        type: string
        default: ''
      artifact-api-url:
        description: Optional artifact transport API serving the same artifact download route.
        type: string
        default: ''
      check-workflow:
        description: The caller's workflow file whose push check on dev qualifies the commit.
        type: string
        default: ci.yml
      artifacts:
        description: Artifact names of the qualifying run, one per line; their top-level files are published.
        type: string
        default: ""
      version:
        description: A version the owner chose, newer than every release; empty raises the last number.
        type: string
        default: ""
      initial-version:
        description: The version of the first release when none exists.
        type: string
        default: 0.1.0
      wait-minutes:
        description: How long a still running qualifying check is awaited.
        type: number
        default: 30
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
    secrets:
      artifact-token:
        description: Optional separate credential for the declared artifact transport.
        required: false
    outputs:
      version:
        description: The released version.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: The release tag.
        value: ${{ jobs.release.outputs.tag }}
      url:
        description: The release page.
        value: ${{ jobs.release.outputs.url }}

permissions: {}

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    # Public repositories release on GitHub's runners, private ones on ours.
    runs-on: ${{ !github.event.repository.private && 'ubuntu-24.04' || inputs.runner }}
    concurrency:
      group: nddev-ci-release-${{ github.workflow }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      actions: read # find the full check of the commit on dev and its artifacts
      contents: write # create the tag and the release
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      url: ${{ steps.release.outputs.url }}
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"

      - name: Outside telemetry off
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@a20e612d91af50af313e06f0989b14457e0c6cb5

      - name: Release the verified commit
        id: release
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release@a20e612d91af50af313e06f0989b14457e0c6cb5
        with:
          check-workflow: ${{ inputs.check-workflow }}
          artifacts: ${{ inputs.artifacts }}
          version: ${{ inputs.version }}
          initial-version: ${{ inputs.initial-version }}
          wait-minutes: ${{ inputs.wait-minutes }}
          api-url: ${{ inputs.api-url }}
          artifact-api-url: ${{ inputs.artifact-api-url }}
          artifact-token: ${{ secrets.artifact-token }}

      - name: Job record
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/job-record@a20e612d91af50af313e06f0989b14457e0c6cb5
        with:
          task: release
          task-type: deploy
          status: ${{ job.status }}
          started-file: ${{ runner.temp }}/nddev-ci-started
