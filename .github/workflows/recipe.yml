name: recipe

on:
  workflow_call:
    inputs:
      runner:
        description: Hosted public runner (ubuntu-24.04, ubuntu-26.04, macos-15 or windows-2025).
        type: string
        default: ubuntu-24.04
      private-runner:
        description: Prepared private runner label.
        type: string
        default: nddev-linux-standart
      recipe:
        description: Project-owned Just recipe.
        type: string
        required: true
      arguments:
        description: JSON array of literal recipe arguments.
        type: string
        default: '[]'
      prepare:
        description: Optional explicit dependency-preparation recipe.
        type: string
        default: ''
      working-directory:
        type: string
        default: '.'
      justfile:
        type: string
        default: justfile
      fetch-depth:
        type: number
        default: 1
      node-version:
        description: Optional exact hosted Node SDK version.
        type: string
        default: ''
      python-version:
        description: Optional exact hosted Python SDK version.
        type: string
        default: ''
      bun-version:
        description: Optional exact Bun version for hosted runners.
        type: string
        default: ''
      rust-version:
        description: Optional exact Rust version for hosted runners.
        type: string
        default: ''
      rust-components:
        description: Optional comma-separated components for the selected Rust toolchain.
        type: string
        default: ''
      rust-targets:
        description: Optional comma-separated targets for the selected Rust toolchain.
        type: string
        default: ''
      tool-assets:
        description: Caller-owned exact public asset/member manifest for hosted runners; private runners use their managed SDK.
        type: string
        default: ''
      uv-version:
        description: Optional exact hosted uv frontend version.
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 30

permissions: {}

jobs:
  recipe:
    # Public calls cannot select a private runner label. Unknown public labels refuse scheduling.
    runs-on: ${{ github.event.repository.private && inputs.private-runner || contains(fromJSON('["ubuntu-24.04","ubuntu-26.04","macos-15","windows-2025"]'), inputs.runner) && inputs.runner || '' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - name: Prepare declared hosted SDKs
        if: runner.environment == 'github-hosted'
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9b2857fcb8d69e24a8f0d60d05e3fa682495644d
        with:
          node-version: ${{ inputs.node-version }}
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          bun-version: ${{ inputs.bun-version }}
          rust-version: ${{ inputs.rust-version }}
          rust-components: ${{ inputs.rust-components }}
          rust-targets: ${{ inputs.rust-targets }}

      - name: Require the managed private native tool profile
        if: inputs.tool-assets != '' && runner.environment != 'github-hosted'
        run: |
          echo "::error::Native asset bootstrap is hosted-only; private tools belong to the managed SDK."
          exit 1
      - name: Prepare declared native tool assets
        if: inputs.tool-assets != '' && runner.environment == 'github-hosted'
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@5fb909ecee8899d33137c455c77371340880281a
        with:
          manifest: ${{ inputs.tool-assets }}
          directory: ${{ runner.temp }}/nddev-ci/native-tools
          add-to-path: true

      - name: Prepare only the declared dependencies
        if: inputs.prepare != ''
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@5fb909ecee8899d33137c455c77371340880281a
        with:
          recipe: ${{ inputs.prepare }}
          working-directory: ${{ inputs.working-directory }}
          justfile: ${{ inputs.justfile }}
      - name: Run the project command
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@5fb909ecee8899d33137c455c77371340880281a
        with:
          recipe: ${{ inputs.recipe }}
          arguments: ${{ inputs.arguments }}
          working-directory: ${{ inputs.working-directory }}
          justfile: ${{ inputs.justfile }}
