name: recipe

on:
  workflow_call:
    inputs:
      artifact-registry:
        description: Optional tool-download registry; empty uses the runner setting or official upstream sources.
        type: string
        default: ''
      hosted-runner:
        description: >-
          The GitHub-hosted runner of a public repository: ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm,
          macos-15, macos-26, windows-2025 or windows-11-arm.
        type: string
        default: ubuntu-24.04
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      recipe:
        description: Project-owned Just recipe.
        type: string
        required: true
      arguments:
        description: JSON array of literal recipe arguments.
        type: string
        default: '[]'
      prepare:
        description: Optional explicit dependency-preparation recipe.
        type: string
        default: ''
      working-directory:
        type: string
        default: '.'
      justfile:
        type: string
        default: justfile
      fetch-depth:
        type: number
        default: 1
      node-version:
        description: Optional exact Node SDK version.
        type: string
        default: ''
      python-version:
        description: Optional exact Python SDK version.
        type: string
        default: ''
      bun-version:
        description: Optional exact Bun version.
        type: string
        default: ''
      rust-version:
        description: Optional exact Rust version.
        type: string
        default: ''
      rust-components:
        description: Optional comma-separated components for the selected Rust toolchain.
        type: string
        default: ''
      rust-targets:
        description: Optional comma-separated targets for the selected Rust toolchain.
        type: string
        default: ''
      tool-assets:
        description: Caller-owned exact public asset/member manifest for hosted runners; private runners use their managed SDK.
        type: string
        default: ''
      uv-version:
        description: Optional exact uv version.
        type: string
        default: ''
      java-version:
        description: Optional exact Temurin JDK version.
        type: string
        default: ''
      go-version:
        description: Optional exact Go version.
        type: string
        default: ''
      flutter-version:
        description: Optional exact stable Flutter version for hosted runners, with its Dart SDK.
        type: string
        default: ''
      tools:
        description: Optional comma-separated name@exact-version command-line tools for hosted runners, such as cargo-nextest@0.9.151.
        type: string
        default: ''
      artifact:
        description: A file or folder a non-pull-request run keeps, such as a native package for the release.
        type: string
        default: ''
      artifact-name:
        description: The name the artifact is kept under; a matrix gives each platform its own.
        type: string
        default: build
      images:
        description: >-
          Prepare the job to build, test and scan its own images: BuildKit with the runner's
          registry mirrors and package mirror, and the scanners' database routes, as image.yml has.
          The recipe then builds with `docker buildx build $NDDEV_CI_IMAGE_BUILD_FLAGS --load`.
        type: boolean
        default: false
      artifact-days:
        description: How many days the artifact is kept; a deployment that takes an older build sets more.
        type: number
        default: 14
      diagnostics:
        description: >-
          Workspace-relative report files or folders, one per line, kept for 14 days when the
          recipe fails. Only what is named here is kept.
        type: string
        default: ''
      reports:
        description: >-
          Workspace-relative reports, one per line, that the job keeps whether it passes or fails,
          such as JUnit, image scans and SBOMs, for 14 days, apart from deployment artifacts. A
          missing one fails the job. The paths follow the diagnostics rule: no absolute path, parent
          or hidden name, so a project that writes reports into a hidden folder copies them to a
          visible one.
        type: string
        default: ''
      repository-token:
        description: >-
          Give the project command the job's own token as GITHUB_TOKEN. It reads only this
          repository's contents, such as links into the project's own private repository in a
          link check. GitHub masks it in logs; the project keeps it out of its reports.
        type: boolean
        default: false
      read-app-client-id:
        description: The GitHub App client ID used for scoped private module reads.
        type: string
        default: ""
      read-app-installation-id:
        description: The App installation in the caller's organization.
        type: string
        default: ""
      read-repositories:
        description: Explicit owner/repository names, one per line, granted contents-read access.
        type: string
        default: ""
      sparse-checkout:
        description: Patterns the checkout keeps, one per line; empty keeps the whole tree.
        type: string
        default: ''
      sparse-checkout-cone-mode:
        description: Reads sparse-checkout as cone directories; false reads gitignore-style patterns.
        type: boolean
        default: true
      submodules:
        description: "'true' checks out the submodules at their recorded commits, 'recursive' theirs too; they must be readable with the job's token, as public repositories are."
        type: string
        default: "false"
      timeout-minutes:
        type: number
        default: 30
    secrets:
      read-app-private-key:
        description: The App PEM key, used only while minting a scoped installation token.
        required: false
      read-keys:
        description: >-
          Read-only deploy keys of other private repositories the check reads, such as a
          superproject's modules: for each repository a line owner/repository, then its OpenSSH
          private key.
        required: false

permissions: {}

jobs:
  recipe:
    # A new label reruns the job only when it chooses the runner.
    if: github.event.action != 'labeled' || github.event.label.name == 'runner:github'
    # Public calls, and private ones the label runner:github or a manual github choice moves, run
    # on the given GitHub-hosted label; other private calls run on ours. A public call cannot
    # select a private label, and an unknown hosted label refuses scheduling.
    runs-on: ${{ (!github.event.repository.private || (contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github'))) && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm","macos-15","macos-26","windows-2025","windows-11-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || '') || (github.event.repository.private && !(contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github'))) && inputs.runner || '' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      SDK_MANAGED: ${{ github.event.repository.private && !(contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github')) }}
    permissions:
      contents: read
    steps:
      - name: Prepare the job
        id: setup
        uses: $/actions/prepare
        with:
          managed: ${{ env.SDK_MANAGED }}
          artifact-registry: ${{ inputs.artifact-registry }}
          diagnostics: ${{ inputs.diagnostics }}
          reports: ${{ inputs.reports }}
          fetch-depth: ${{ inputs.fetch-depth }}
          working-directory: ${{ inputs.working-directory }}
          images: ${{ inputs.images }}
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
          submodules: ${{ inputs.submodules }}
          repository-token: ${{ inputs.repository-token }}
          read-keys: ${{ secrets.read-keys }}
          read-app-client-id: ${{ inputs.read-app-client-id }}
          read-app-installation-id: ${{ inputs.read-app-installation-id }}
          read-repositories: ${{ inputs.read-repositories }}
          read-app-private-key: ${{ secrets.read-app-private-key }}
          node-version: ${{ inputs.node-version }}
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          bun-version: ${{ inputs.bun-version }}
          rust-version: ${{ inputs.rust-version }}
          rust-components: ${{ inputs.rust-components }}
          rust-targets: ${{ inputs.rust-targets }}
          java-version: ${{ inputs.java-version }}
          go-version: ${{ inputs.go-version }}
          flutter-version: ${{ inputs.flutter-version }}
          tools: ${{ inputs.tools }}
          tool-assets: ${{ inputs.tool-assets }}

      - name: Prepare only the declared dependencies
        id: dependencies
        if: inputs.prepare != ''
        uses: $/actions/recipe
        with:
          managed: ${{ env.SDK_MANAGED }}
          recipe: ${{ inputs.prepare }}
          working-directory: ${{ inputs.working-directory }}
          justfile: ${{ inputs.justfile }}

      - name: Run the project command
        id: project
        uses: $/actions/recipe
        with:
          managed: ${{ env.SDK_MANAGED }}
          recipe: ${{ inputs.recipe }}
          arguments: ${{ inputs.arguments }}
          working-directory: ${{ inputs.working-directory }}
          justfile: ${{ inputs.justfile }}

      - name: Complete the job
        if: always()
        uses: $/actions/complete
        with:
          status: ${{ job.status }}
          project-outcome: ${{ (steps.dependencies.outcome == 'failure' || steps.project.outcome == 'failure') && 'failure' || 'success' }}
          task: just ${{ inputs.recipe }}
          task-type: ${{ inputs.artifact != '' && 'build' || 'test' }}
          name: ${{ inputs.recipe }}-${{ runner.os }}-${{ runner.arch }}
          artifact: ${{ inputs.artifact }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-days: ${{ inputs.artifact-days }}
          reports: ${{ inputs.reports }}
          diagnostics: ${{ inputs.diagnostics }}
          read-token: ${{ steps.setup.outputs.read-token }}
