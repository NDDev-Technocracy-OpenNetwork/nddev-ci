name: recipe

on:
  workflow_call:
    inputs:
      artifact-registry:
        description: Optional tool-download registry; empty uses the runner setting or official upstream sources.
        type: string
        default: ''
      hosted-runner:
        description: >-
          The GitHub-hosted runner of a public repository: ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm,
          macos-15, macos-26, windows-2025 or windows-11-arm.
        type: string
        default: ubuntu-24.04
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      recipe:
        description: Project-owned Just recipe.
        type: string
        required: true
      arguments:
        description: JSON array of literal recipe arguments.
        type: string
        default: '[]'
      prepare:
        description: Optional explicit dependency-preparation recipe.
        type: string
        default: ''
      working-directory:
        type: string
        default: '.'
      justfile:
        type: string
        default: justfile
      fetch-depth:
        type: number
        default: 1
      node-version:
        description: Optional exact Node SDK version.
        type: string
        default: ''
      python-version:
        description: Optional exact Python SDK version.
        type: string
        default: ''
      bun-version:
        description: Optional exact Bun version.
        type: string
        default: ''
      rust-version:
        description: Optional exact Rust version.
        type: string
        default: ''
      rust-components:
        description: Optional comma-separated components for the selected Rust toolchain.
        type: string
        default: ''
      rust-targets:
        description: Optional comma-separated targets for the selected Rust toolchain.
        type: string
        default: ''
      tool-assets:
        description: Caller-owned exact public asset/member manifest for hosted runners; private runners use their managed SDK.
        type: string
        default: ''
      uv-version:
        description: Optional exact uv version.
        type: string
        default: ''
      java-version:
        description: Optional exact Temurin JDK version.
        type: string
        default: ''
      go-version:
        description: Optional exact Go version.
        type: string
        default: ''
      flutter-version:
        description: Optional exact stable Flutter version for hosted runners, with its Dart SDK.
        type: string
        default: ''
      tools:
        description: Optional comma-separated name@exact-version command-line tools for hosted runners, such as cargo-nextest@0.9.151.
        type: string
        default: ''
      artifact:
        description: A file or folder a non-pull-request run keeps, such as a native package for the release.
        type: string
        default: ''
      artifact-name:
        description: The name the artifact is kept under; a matrix gives each platform its own.
        type: string
        default: build
      images:
        description: >-
          Prepare the job to build, test and scan its own images: BuildKit with the runner's
          registry mirrors and package mirror, and the scanners' database routes, as image.yml has.
          The recipe then builds with `docker buildx build $NDDEV_CI_IMAGE_BUILD_FLAGS --load`.
        type: boolean
        default: false
      artifact-days:
        description: How many days the artifact is kept; a deployment that takes an older build sets more.
        type: number
        default: 14
      diagnostics:
        description: >-
          Workspace-relative report files or folders, one per line, kept for 14 days when the
          recipe fails. Only what is named here is kept.
        type: string
        default: ''
      reports:
        description: >-
          Workspace-relative reports, one per line, that the job keeps whether it passes or fails,
          such as JUnit, image scans and SBOMs, for 14 days, apart from deployment artifacts. A
          missing one fails the job. The paths follow the diagnostics rule: no absolute path, parent
          or hidden name, so a project that writes reports into a hidden folder copies them to a
          visible one.
        type: string
        default: ''
      repository-token:
        description: >-
          Give the project command the job's own token as GITHUB_TOKEN. It reads only this
          repository's contents, such as links into the project's own private repository in a
          link check. GitHub masks it in logs; the project keeps it out of its reports.
        type: boolean
        default: false
      sparse-checkout:
        description: Patterns the checkout keeps, one per line; empty keeps the whole tree.
        type: string
        default: ''
      sparse-checkout-cone-mode:
        description: Reads sparse-checkout as cone directories; false reads gitignore-style patterns.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 30

permissions: {}

jobs:
  recipe:
    # Public calls cannot select a private runner label. Unknown public labels refuse scheduling.
    runs-on: ${{ github.event.repository.private && inputs.runner || contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm","macos-15","macos-26","windows-2025","windows-11-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || '' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      SDK_MANAGED: ${{ github.event.repository.private }}
    permissions:
      contents: read
    steps:
      - name: Diagnostics stay inside the workspace
        env:
          DIAGNOSTICS: ${{ inputs.diagnostics }}
          REPORTS: ${{ inputs.reports }}
        shell: bash
        run: |
          set -euo pipefail
          # No absolute path, home, parent or hidden name.
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "$line" ] || continue
            case "/$line/" in
              //* | /~* | */../* | */./* | */.[!.]* | *\\*) echo "::error::diagnostics names a path outside the workspace or a hidden name: $line"; exit 1 ;;
            esac
          done <<< "$DIAGNOSTICS"
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "$line" ] || continue
            case "/$line/" in
              //* | /~* | */../* | */./* | */.[!.]* | *\\*) echo "::error::reports names a path outside the workspace or a hidden name: $line"; exit 1 ;;
            esac
          done <<< "$REPORTS"
          date +%s > "$RUNNER_TEMP/nddev-ci-started"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
      - name: Outside telemetry off
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@9795917fc97bf71b2761e609a87adbb189119894

      - name: Artifact registry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/artifact-registry@9795917fc97bf71b2761e609a87adbb189119894
        with:
          url: ${{ inputs.artifact-registry }}
      - name: Prepare or verify declared SDKs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@f5f6e0ab92b4f81a681f76926a4781840be8ec4d
        with:
          managed: ${{ env.SDK_MANAGED }}
          node-version: ${{ inputs.node-version }}
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          bun-version: ${{ inputs.bun-version }}
          rust-version: ${{ inputs.rust-version }}
          rust-components: ${{ inputs.rust-components }}
          rust-targets: ${{ inputs.rust-targets }}
          java-version: ${{ inputs.java-version }}
          go-version: ${{ inputs.go-version }}
          flutter-version: ${{ inputs.flutter-version }}
          tools: ${{ inputs.tools }}

      - name: Require the managed private native tool profile
        if: inputs.tool-assets != '' && env.SDK_MANAGED == 'true'
        run: |
          echo "::error::Native asset bootstrap serves external profiles; managed runners keep their SDK."
          exit 1
      - name: Prepare declared native tool assets
        if: inputs.tool-assets != '' && env.SDK_MANAGED == 'false'
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@9795917fc97bf71b2761e609a87adbb189119894
        with:
          managed: ${{ env.SDK_MANAGED }}
          manifest: ${{ inputs.tool-assets }}
          directory: ${{ runner.temp }}/nddev-ci/native-tools
          add-to-path: true

      - name: Hosted dependency caches
        if: env.SDK_MANAGED == 'false'
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-cache@9795917fc97bf71b2761e609a87adbb189119894
        with:
          managed: ${{ env.SDK_MANAGED }}
          working-directory: ${{ inputs.working-directory }}

      - name: Prepare in-job image builds
        if: inputs.images
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/image-builder@8e5d0c687a0a9a04d8d8f275d8c26ad32220f0d1

      - name: The job's own read token for the project command
        # Opt-in: the job's token reads only this repository's contents, and nothing else.
        if: inputs.repository-token
        env:
          TOKEN: ${{ github.token }}
        shell: bash
        run: echo "GITHUB_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Prepare only the declared dependencies
        if: inputs.prepare != ''
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9795917fc97bf71b2761e609a87adbb189119894
        with:
          managed: ${{ env.SDK_MANAGED }}
          recipe: ${{ inputs.prepare }}
          working-directory: ${{ inputs.working-directory }}
          justfile: ${{ inputs.justfile }}
      - name: Run the project command
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@9795917fc97bf71b2761e609a87adbb189119894
        with:
          managed: ${{ env.SDK_MANAGED }}
          recipe: ${{ inputs.recipe }}
          arguments: ${{ inputs.arguments }}
          working-directory: ${{ inputs.working-directory }}
          justfile: ${{ inputs.justfile }}

      - name: Artifact
        # A non-pull-request run keeps what the release takes, so it publishes the tested build.
        if: github.event_name != 'pull_request' && inputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-days }}

      - name: Reports
        # The caller's named evidence, kept whether the recipe passed or failed, never as a
        # deployment artifact.
        if: ${{ !cancelled() && inputs.reports != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ inputs.recipe }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ inputs.reports }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

      - name: Every named report is kept
        # The upload fails only when nothing at all matched; a report the job did not leave fails
        # here, after the ones it did leave are kept.
        if: ${{ !cancelled() && inputs.reports != '' }}
        env:
          REPORTS: ${{ inputs.reports }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar
          missing=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "$line" ] || continue
            found=false
            while IFS= read -r match; do
              if [ -f "$match" ] || { [ -d "$match" ] && [ -n "$(find "$match" -type f ! -path '*/.*' -print -quit)" ]; }; then
                found=true
                break
              fi
            done < <(compgen -G "$line" || true)
            if ! $found; then
              echo "::error::reports names $line, and the job left nothing there"
              missing=$((missing + 1))
            fi
          done <<< "$REPORTS"
          [ "$missing" = 0 ]

      - name: Diagnostics of the failed recipe
        if: failure() && inputs.diagnostics != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ inputs.recipe }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ inputs.diagnostics }}
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14

      - name: Job record
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/job-record@9795917fc97bf71b2761e609a87adbb189119894
        with:
          task: just ${{ inputs.recipe }}
          task-type: ${{ inputs.artifact != '' && 'build' || 'test' }}
          status: ${{ job.status }}
          started-file: ${{ runner.temp }}/nddev-ci-started
