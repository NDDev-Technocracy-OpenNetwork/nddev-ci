# Opt-in cargo-nextest archive + shard workflow for large Rust suites.
# Builds test binaries once into a compressed nextest archive, transfers it via GHCR OCI
# artifacts on private repositories (or workflow artifacts on public repositories), and runs
# deterministic slice/hash partitions across parallel runners.
name: nextest-shards

on:
  workflow_call:
    inputs:
      shards:
        description: Number of parallel test shards (2-16).
        type: number
        default: 2
      partition-strategy:
        description: Nextest partition strategy (slice or hash; count is rejected).
        type: string
        default: slice
      nextest-profile:
        description: Optional cargo-nextest profile name.
        type: string
        default: ''
      archive-arguments:
        description: Optional JSON array of extra arguments passed to cargo nextest archive.
        type: string
        default: '[]'
      run-arguments:
        description: Optional JSON array of extra arguments passed to cargo nextest run.
        type: string
        default: '[]'
      working-directory:
        description: Workspace-relative project directory.
        type: string
        default: '.'
      runner:
        description: Managed runner label for private repositories.
        type: string
        default: nddev-linux-standart
      runner-profile:
        description: Managed platform profile for scoped hosted fallback.
        type: string
        default: ''
      hosted-runner:
        description: GitHub-hosted Linux label for public repositories.
        type: string
        default: ubuntu-24.04
      artifact-registry:
        description: Optional tool-download registry origin.
        type: string
        default: ''
      rust-version:
        description: Optional exact Rust version.
        type: string
        default: ''
      rust-components:
        description: Optional comma-separated Rust components.
        type: string
        default: ''
      rust-targets:
        description: Optional comma-separated Rust targets.
        type: string
        default: ''
      tools:
        description: Optional comma-separated name@exact-version tools for hosted runners.
        type: string
        default: ''
      tool-assets:
        description: Optional exact tool asset manifest for hosted runners.
        type: string
        default: ''
      read-app-client-id:
        description: GitHub App client ID for scoped private module reads.
        type: string
        default: ''
      read-app-installation-id:
        description: GitHub App installation ID for scoped private module reads.
        type: string
        default: ''
      read-repositories:
        description: Explicit owner/repository names granted contents-read access.
        type: string
        default: ''
      submodules:
        description: Checkout submodule mode (false, true, recursive, exact).
        type: string
        default: 'false'
      timeout-minutes:
        description: Maximum duration for each archive or shard job.
        type: number
        default: 30
      retain-runs:
        description: Keep a separate concurrency group per run instead of cancelling earlier runs.
        type: boolean
        default: false
    secrets:
      read-app-private-key:
        description: GitHub App PEM key for scoped private module reads.
        required: false
      read-keys:
        description: Read-only deploy keys for private modules.
        required: false

concurrency:
  group: nddev-ci-nextest-${{ github.workflow }}-${{ inputs.retain-runs && format('run-{0}', github.run_id) || github.ref }}-${{ inputs.runner }}-${{ inputs.hosted-runner }}-${{ inputs.runner-profile }}-${{ inputs.working-directory }}
  cancel-in-progress: ${{ !inputs.retain-runs && github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  archive:
    name: nextest archive
    # runner-profile:archive
    runs-on: >-
      ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || github.event.repository.private && ((inputs.runner-profile != '' && (contains(github.event.pull_request.labels.*.name, format('runner:github:{0}', inputs.runner-profile)) || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == inputs.runner-profile))) && fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[inputs.runner-profile] || (contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == '')) && (fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[inputs.runner-profile] || 'ubuntu-24.04')
      || (github.event_name == 'pull_request' && github.event.sender.type == 'Bot' && github.event.pull_request.user.type == 'Bot' && github.actor == github.triggering_actor && fromJSON('{"nddev-linux-bounded":"nddev-linux-bounded-maintenance","nddev-linux-light":"nddev-linux-light-maintenance","nddev-linux-small":"nddev-linux-small-maintenance","nddev-linux-standart":"nddev-linux-standart-maintenance","nddev-macos":"nddev-macos-maintenance","nddev-windows":"nddev-windows-maintenance"}')[inputs.runner] || inputs.runner)) || '' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      digest: ${{ steps.push-oci.outputs.digest }}
    steps:
      - name: Plan shards
        id: plan
        uses: $/actions/nextest-shards
        with:
          mode: plan
          shards: ${{ inputs.shards }}
          partition-strategy: ${{ inputs.partition-strategy }}
          nextest-profile: ${{ inputs.nextest-profile }}
          arguments: ${{ inputs.run-arguments }}
          working-directory: ${{ inputs.working-directory }}
          hosted-runner: ${{ inputs.hosted-runner }}
          private-repository: ${{ github.event.repository.private }}

      # jscpd:ignore-start -- shared actions/prepare contract
      - name: Prepare the job
        id: setup
        uses: $/actions/prepare
        with:
          managed: ${{ runner.environment == 'self-hosted' }}
          artifact-registry: ${{ inputs.artifact-registry }}
          working-directory: ${{ inputs.working-directory }}
          submodules: ${{ inputs.submodules }}
          read-keys: ${{ secrets.read-keys }}
          read-app-client-id: ${{ inputs.read-app-client-id }}
          read-app-installation-id: ${{ inputs.read-app-installation-id }}
          read-repositories: ${{ inputs.read-repositories }}
          read-app-private-key: ${{ secrets.read-app-private-key }}
          rust-version: ${{ inputs.rust-version }}
          rust-components: ${{ inputs.rust-components }}
          rust-targets: ${{ inputs.rust-targets }}
          tools: ${{ inputs.tools }}
          tool-assets: ${{ inputs.tool-assets }}
      # jscpd:ignore-end

      - name: Build nextest archive
        id: archive
        uses: $/actions/nextest-shards
        with:
          mode: archive
          archive-file: ${{ runner.temp }}/nextest-archive.tar.zst
          arguments: ${{ inputs.archive-arguments }}
          working-directory: ${{ inputs.working-directory }}

      - name: Push archive (OCI)
        id: push-oci
        if: ${{ github.event.repository.private && steps.archive.outcome == 'success' }}
        uses: $/actions/oci-artifact
        with:
          mode: push
          name: nextest-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          github-token: ${{ github.token }}

      - name: Upload archive (public)
        if: ${{ !github.event.repository.private && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1

      # jscpd:ignore-start -- shared actions/complete contract
      - name: Complete the job
        if: always()
        uses: $/actions/complete
        with:
          status: ${{ job.status }}
          check-run-id: ${{ job.check_run_id }}
          project-outcome: ${{ steps.archive.outcome }}
          failure-reason: ${{ steps.archive.outcome == 'failure' && 'nextest-archive-failed' || steps.push-oci.outputs.failure-reason || (steps.setup.outcome == 'failure' && 'setup-failed') || '' }}
          runner-reason: ${{ steps.setup.outputs.runner-reason || steps.archive.outputs.runner-reason }}
          task: nextest archive
          task-type: build
          name: nextest-archive
          read-token: ${{ steps.setup.outputs.read-token }}
      # jscpd:ignore-end

  shard:
    name: nextest shard ${{ matrix.shard.shard }}/${{ matrix.shard.total }}
    needs: [archive]
    if: ${{ !cancelled() && needs.archive.result == 'success' && needs.archive.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.archive.outputs.matrix) }}
    # jscpd:ignore-start -- generated runner routing shared with archive via tools/runner-profiles.mjs
    # runner-profile:shard
    runs-on: >-
      ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || github.event.repository.private && ((inputs.runner-profile != '' && (contains(github.event.pull_request.labels.*.name, format('runner:github:{0}', inputs.runner-profile)) || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == inputs.runner-profile))) && fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[inputs.runner-profile] || (contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == '')) && (fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[inputs.runner-profile] || 'ubuntu-24.04')
      || (github.event_name == 'pull_request' && github.event.sender.type == 'Bot' && github.event.pull_request.user.type == 'Bot' && github.actor == github.triggering_actor && fromJSON('{"nddev-linux-bounded":"nddev-linux-bounded-maintenance","nddev-linux-light":"nddev-linux-light-maintenance","nddev-linux-small":"nddev-linux-small-maintenance","nddev-linux-standart":"nddev-linux-standart-maintenance","nddev-macos":"nddev-macos-maintenance","nddev-windows":"nddev-windows-maintenance"}')[inputs.runner] || inputs.runner)) || '' }}
    # jscpd:ignore-end
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # jscpd:ignore-start -- shared actions/prepare contract
      - name: Prepare shard runner
        id: setup
        uses: $/actions/prepare
        with:
          managed: ${{ runner.environment == 'self-hosted' }}
          artifact-registry: ${{ inputs.artifact-registry }}
          working-directory: ${{ inputs.working-directory }}
          submodules: ${{ inputs.submodules }}
          rust-version: ${{ inputs.rust-version }}
          tools: ${{ inputs.tools }}
          tool-assets: ${{ inputs.tool-assets }}
      # jscpd:ignore-end

      - name: Pull archive (OCI)
        id: pull-oci
        if: ${{ github.event.repository.private }}
        uses: $/actions/oci-artifact
        with:
          mode: pull
          name: ${{ needs.archive.outputs.digest }}
          directory: ${{ runner.temp }}/nextest-in
          github-token: ${{ github.token }}

      - name: Download archive (public)
        if: ${{ !github.event.repository.private }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextest-in

      - name: Run nextest shard
        id: run
        uses: $/actions/nextest-shards
        with:
          mode: run
          archive-file: ${{ runner.temp }}/nextest-in/nextest-archive.tar.zst
          extract-to: ${{ runner.temp }}/nextest-extract
          partition: ${{ matrix.shard.partition }}
          nextest-profile: ${{ inputs.nextest-profile }}
          arguments: ${{ inputs.run-arguments }}
          working-directory: ${{ inputs.working-directory }}

      # jscpd:ignore-start -- shared actions/complete contract
      - name: Complete the job
        if: always()
        uses: $/actions/complete
        with:
          status: ${{ job.status }}
          check-run-id: ${{ job.check_run_id }}
          project-outcome: ${{ steps.run.outcome }}
          failure-reason: ${{ steps.run.outcome == 'failure' && 'nextest-shard-failed' || steps.pull-oci.outputs.failure-reason || (steps.setup.outcome == 'failure' && 'setup-failed') || '' }}
          runner-reason: ${{ steps.setup.outputs.runner-reason || steps.run.outputs.runner-reason }}
          task: nextest shard ${{ matrix.shard.shard }}/${{ matrix.shard.total }}
          task-type: test
          name: nextest-shard-${{ matrix.shard.shard }}
          read-token: ${{ steps.setup.outputs.read-token }}
      # jscpd:ignore-end
