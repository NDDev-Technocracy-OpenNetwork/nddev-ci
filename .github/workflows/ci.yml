# The library checks itself with its own workflow.
name: ci

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      setup: true
      node-version: '26.13.0'
      python-version: '3.15.2'
      uv-version: '0.13.7'
      bun-version: '1.4.4'
      rust-version: '1.99.1'
      rust-components: clippy,rustfmt
    permissions:
      contents: read

  # The merge stops workflow that specialized callers use beside their own command jobs.
  merge-stops:
    strategy:
      fail-fast: false
      matrix:
        hosted-runner: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/merge-stops.yml
    with:
      hosted-runner: ${{ matrix.hosted-runner }}
    permissions:
      contents: read
