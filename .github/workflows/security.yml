# The daily security scan: live secrets in the whole history (TruffleHog and
# Kingfisher), every known vulnerability in the dependencies (OSV-Scanner with its offline
# database), the dependencies whose licence is outside the licence policy (OSV-Scanner with
# deps.dev, the one source of a lock file's licences), and the packages of the repository and of
# its images on an SBOM made by Syft (Trivy and Grype). A finding never fails the run; the run
# keeps one report issue per repository. A scanner that cannot run fails it.
name: security

on:
  workflow_call:
    inputs:
      artifact-registry:
        description: Optional tool-download registry; empty uses the runner setting or official upstream sources.
        type: string
        default: ''
      runner:
        description: The runner label the scan runs on.
        type: string
        default: nddev-linux-standart
      hosted-runner:
        description: >-
          The GitHub-hosted Linux runner of a public repository: ubuntu-24.04, ubuntu-24.04-arm,
          ubuntu-26.04 or ubuntu-26.04-arm.
        type: string
        default: ubuntu-24.04
      images:
        description: Container images the project releases, one per line, scanned on their SBOM.
        type: string
        default: ""
      timeout-minutes:
        description: The longest the scan may take.
        type: number
        default: 60
      sboms:
        description: An artifact of this run with SBOMs the caller made, such as of private images (`<name>.json`, CycloneDX, and `<name>.name` with the image).
        type: string
        default: ""
      license-policy:
        description: >-
          The caller's cargo-deny style TOML whose [licenses] allow list the licence scan uses,
          such as deny.toml, so cargo-deny and the scan read one list. Empty uses the default allowlist.
        type: string
        default: ""

permissions: {}

jobs:
  scan:
    name: daily security
    # Public repositories scan on GitHub's runners; an unknown hosted label fails below.
    runs-on: ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || (inputs.runner == 'nddev-macos' && 'nddev-linux-arm64' || inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      issues: write
    env:
      TRUFFLEHOG_VERSION: "3.99.8"
      TRUFFLEHOG_SHA256_X64: "7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08"
      TRUFFLEHOG_SHA256_ARM64: "a0382d83dd58c967af5dd0175cc732c62c836ab1d15dc9ae71b01a2d3f0911b2"
      KINGFISHER_VERSION: "2.17.0"
      KINGFISHER_SHA256_X64: "8798879183d74f9e1379af3071f296853e4027a21bfde5d13d9b064fa1bf1eb3"
      KINGFISHER_SHA256_ARM64: "4118224ccbd4cc4b14997d3962c90bc7160a148bb1011db78e86eb2257665048"
      OSV_SCANNER_VERSION: "2.7.0"
      OSV_SCANNER_SHA256_X64: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
      OSV_SCANNER_SHA256_ARM64: "4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7"
      SYFT_VERSION: "1.57.0"
      SYFT_SHA256_X64: "9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704"
      SYFT_SHA256_ARM64: "410cbfa0ae0f63246bc0057843760b1de2833cd23919e025e368fd7681308cdb"
      GRYPE_VERSION: "0.121.2"
      GRYPE_SHA256_X64: "9c8965ced9df657e5e851c14021bae838802f711edd7a48f9bc3c923a8d28f12"
      GRYPE_SHA256_ARM64: "d7d2e160255b0f087280feabf6f213cf4c45d475690f3f1fe5dc336eb1037bf0"
      TRIVY_VERSION: "0.76.2"
      TRIVY_SHA256_X64: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
      TRIVY_SHA256_ARM64: "ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3"
      # the default allowlist for embedded dependencies, as SPDX identifiers; a caller's policy replaces it.
      LICENSES: MIT,MIT-0,Apache-2.0,Apache-2.0 WITH LLVM-exception,BSD-2-Clause,BSD-3-Clause,0BSD,ISC,Zlib,BSL-1.0,BlueOak-1.0.0,CC0-1.0,Unicode-3.0,Unicode-DFS-2016,PostgreSQL,PSF-2.0,Python-2.0,CNRI-Python,MIT-CMU,IJG,CDLA-Permissive-2.0,MPL-2.0,EPL-2.0,Unlicense
    steps:
      - name: Native scanner platform
        env:
          PRIVATE: ${{ github.event.repository.private }}
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
        run: |
          set -euo pipefail
          # The scanners run natively on Linux x64 or ARM64; any other system stops before preparation.
          if [ "$PRIVATE" != true ]; then
            case "$HOSTED_RUNNER" in
              ubuntu-24.04 | ubuntu-24.04-arm | ubuntu-26.04 | ubuntu-26.04-arm) ;;
              *) echo "::error::hosted-runner must be a GitHub-hosted Linux label of this workflow"; exit 1 ;;
            esac
          fi
          [ "$RUNNER_OS" = Linux ] || { echo "::error::the daily scan runs on Linux runners"; exit 1; }
          case "$(uname -m)" in x86_64 | aarch64 | arm64) ;; *) echo "::error::the daily scan supports Linux x64 and ARM64"; exit 1 ;; esac
          date +%s > "$RUNNER_TEMP/nddev-ci-started"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Outside telemetry off
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@a20e612d91af50af313e06f0989b14457e0c6cb5

      - name: Artifact registry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/artifact-registry@a20e612d91af50af313e06f0989b14457e0c6cb5
        with:
          url: ${{ inputs.artifact-registry }}

      - name: Tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/security/bin"
          download="$RUNNER_TEMP/security/download"
          mkdir -p "$bin"
          case "$(uname -m)" in
            x86_64) arch=X64 go=amd64 kingfisher=x64 trivy=64bit ;;
            aarch64 | arm64) arch=ARM64 go=arm64 kingfisher=arm64 trivy=ARM64 ;;
          esac
          digest() { local name="${1}_SHA256_$arch"; printf '%s' "${!name}"; }
          fetch() {
            source=${1#https://github.com/}
            repository=${source%%/releases/download/*}
            release=${source#*/releases/download/}
            tag=${release%%/*}
            name=${release#*/}
            printf 'Fetching check tool %s@%s: %s\n' "$repository" "$tag" "$name"
            auth=()
            case "${3:-token}" in
              token) if [ -n "${GH_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $GH_TOKEN"); fi ;;
              public) ;;
              *) echo "::error::unknown release source access mode"; exit 1 ;;
            esac
            if [ -n "${NDDEV_CI_ARTIFACT_REGISTRY:-}" ]; then
              printf 'Using the configured artifact registry.\n'
              curl -fsSL -o "$download" "${NDDEV_CI_ARTIFACT_REGISTRY%/}/github-releases/sha256/$2/$repository/releases/download/$tag/$name"
            else
              asset=$(curl -fsSL "${auth[@]}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$repository/releases/tags/$tag" |
                jq -er --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id | numbers else error("release asset is missing or ambiguous") end')
              curl -fsSL "${auth[@]}" -H 'Accept: application/octet-stream' -o "$download" "https://api.github.com/repos/$repository/releases/assets/$asset"
            fi
            echo "$2  $download" | sha256sum --check --quiet
          }
          fetch "https://github.com/trufflesecurity/trufflehog/releases/download/v$TRUFFLEHOG_VERSION/trufflehog_${TRUFFLEHOG_VERSION}_linux_$go.tar.gz" "$(digest TRUFFLEHOG)"
          tar -xzf "$download" -C "$bin" trufflehog
          fetch "https://github.com/mongodb/kingfisher/releases/download/v$KINGFISHER_VERSION/kingfisher-linux-$kingfisher.tgz" "$(digest KINGFISHER)"
          tar -xzf "$download" -C "$bin" kingfisher
          fetch "https://github.com/google/osv-scanner/releases/download/v$OSV_SCANNER_VERSION/osv-scanner_linux_$go" "$(digest OSV_SCANNER)"
          install -m 0755 "$download" "$bin/osv-scanner"
          fetch "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_$go.tar.gz" "$(digest SYFT)"
          tar -xzf "$download" -C "$bin" syft
          fetch "https://github.com/anchore/grype/releases/download/v$GRYPE_VERSION/grype_${GRYPE_VERSION}_linux_$go.tar.gz" "$(digest GRYPE)"
          tar -xzf "$download" -C "$bin" grype
          # This public upstream restricts organization-token access. Select public access before
          # the request; an error never retries under another identity.
          fetch "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-$trivy.tar.gz" "$(digest TRIVY)" public
          tar -xzf "$download" -C "$bin" trivy
          rm -f "$download"
          echo "$bin" >> "$GITHUB_PATH"

      - name: The caller's SBOMs
        if: inputs.sboms != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.sboms }}
          path: ${{ runner.temp }}/security/caller

      - name: Secrets
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/security/out"
          mkdir -p "$out"
          # Each scanner's own exit code: findings are reported, never fatal; anything else is.
          trufflehog git "file://$PWD" --results=verified --json --no-update > "$out/trufflehog.jsonl"
          status=0
          kingfisher scan . --only-valid --no-update-check --format json > "$out/kingfisher.json" || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 200 ] || { echo "::error::Kingfisher ended with $status"; exit 1; }

      - name: Licence policy
        id: licences
        env:
          POLICY: ${{ inputs.license-policy }}
        run: |
          set -euo pipefail
          # A configured policy must exist and name SPDX identifiers or WITH exceptions.
          python3 -I - "$POLICY" >> "$GITHUB_OUTPUT" <<'PY'
          import os, re, sys, tomllib
          path = sys.argv[1]
          allow = os.environ["LICENSES"].split(",")
          if path:
              if os.path.isabs(path) or ".." in path.split("/") or not os.path.isfile(path) or os.path.islink(path):
                  sys.exit(f"::error::licence policy {path!r} is not a regular file in the repository")
              try:
                  policy = tomllib.load(open(path, "rb"))
              except (OSError, tomllib.TOMLDecodeError) as error:
                  sys.exit(f"::error::licence policy {path!r} is not valid TOML: {error}")
              allow = (policy.get("licenses") or {}).get("allow")
          if not isinstance(allow, list) or not allow or not all(
              isinstance(item, str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.+-]*(?: WITH [A-Za-z0-9][A-Za-z0-9.+-]*)?", item) for item in allow
          ) or len(set(allow)) != len(allow):
              sys.exit(f"::error::licence policy {path!r} needs a [licenses] allow list of unique SPDX identifiers or WITH exceptions")
          # OSV accepts identifiers, not WITH expressions. Drop a redundant exception only
          # when the policy independently permits its base; never broaden an exception-only rule.
          for item in allow:
              if " WITH " in item and item.split(" WITH ")[0] not in allow:
                  sys.exit("::error::OSV cannot enforce an exception-only licence policy; its base must be independently allowed")
          identifiers = [item for item in allow if " WITH " not in item]
          print("licenses=" + ",".join(identifiers))
          print(f"Licence policy: {path or 'default'}, {len(identifiers)} scanner identifiers.", file=sys.stderr)
          PY

      - name: Dependencies and licences
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/daily-osv@a20e612d91af50af313e06f0989b14457e0c6cb5 # verified native scanner policy
        with:
          scanner: ${{ runner.temp }}/security/bin/osv-scanner
          output: ${{ runner.temp }}/security/out
          licenses: ${{ steps.licences.outputs.licenses }}

      - name: Packages
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/daily-sbom@a20e612d91af50af313e06f0989b14457e0c6cb5 # verified native SBOM policy
        with:
          tools: ${{ runner.temp }}/security/bin
          output: ${{ runner.temp }}/security/out
          images: ${{ inputs.images }}
          sboms: ${{ inputs.sboms != '' && format('{0}/security/caller', runner.temp) || '' }}

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/security/out" > "$RUNNER_TEMP/security/report.md" <<'PY'
          import json, pathlib, os, sys
          out = pathlib.Path(sys.argv[1])
          lines = ["The daily security scan: findings are reported without hiding scanner failures.", ""]
          # The issue shows 50 rows a section; the run log prints every row.
          full = list(lines)
          def section(title, rows):
              for text in (lines, full):
                  text.append(f"## {title}: {len(rows)}")
              lines.extend(f"- {row}" for row in rows[:50])
              full.extend(f"- {row}" for row in rows)
              if len(rows) > 50:
                  lines.append(f"- … and {len(rows) - 50} more in the run log")
              lines.append("")
              full.append("")
          secrets = []
          for line in (out / "trufflehog.jsonl").read_text().splitlines():
              found = json.loads(line)
              where = found.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
              secrets.append(f"TruffleHog, verified {found.get('DetectorName')}: {where.get('file')}:{where.get('line')} in {str(where.get('commit'))[:12]}")
          # Kingfisher writes its findings on the first line and a summary on the second.
          kingfisher = json.loads(((out / "kingfisher.json").read_text().splitlines() or ["{}"])[0])
          for found in kingfisher.get("findings", []) if isinstance(kingfisher, dict) else []:
              rule = found.get("rule", {})
              where = found.get("finding", {})
              secrets.append(f"Kingfisher, valid {rule.get('name')}: {where.get('path')}:{where.get('line')}")
          section("Live secrets", secrets)
          vulnerabilities = []
          osv = json.loads((out / "osv.json").read_text() or "{}")
          for result in osv.get("results") or []:
              for package in result.get("packages") or []:
                  info = package.get("package", {})
                  for vulnerability in package.get("vulnerabilities") or []:
                      vulnerabilities.append(f"{vulnerability.get('id')} in {info.get('ecosystem')} {info.get('name')} {info.get('version')} ({os.path.relpath(result.get('source', {}).get('path', '.'))})")
          section("Vulnerable dependencies (OSV-Scanner)", sorted(set(vulnerabilities)))
          outside, unknown = set(), set()
          licences = json.loads((out / "licenses.json").read_text() or "{}")
          for result in licences.get("results") or []:
              for package in result.get("packages") or []:
                  violations = package.get("license_violations") or []
                  if not violations:
                      continue
                  info = package.get("package", {})
                  name = f"{info.get('ecosystem')} {info.get('name')} {info.get('version')}"
                  if set(violations) <= {"UNKNOWN"}:
                      unknown.add(name)
                      continue
                  outside.add(f"{name}: {', '.join(package.get('licenses') or violations)} ({os.path.relpath(result.get('source', {}).get('path', '.'))})")
          section("Licences outside the licence policy (OSV-Scanner with deps.dev)", sorted(outside))
          if unknown:
              for text in (lines, full):
                  text.insert(-1, f"{len(unknown)} packages have no licence in deps.dev, such as the project's own and pub.dev's; check them by hand.")
          for grype in sorted(out.glob("grype-*.json")):
              name = grype.stem.removeprefix("grype-")
              label = (out / f"{name}.name").read_text().strip() if (out / f"{name}.name").exists() else "the repository"
              rows = set()
              for match in json.loads(grype.read_text()).get("matches") or []:
                  v = match.get("vulnerability", {})
                  a = match.get("artifact", {})
                  rows.add(f"Grype {v.get('severity')}: {v.get('id')} in {a.get('name')} {a.get('version')}")
              trivy = out / f"trivy-{name}.json"
              for result in json.loads(trivy.read_text()).get("Results") or []:
                  for v in result.get("Vulnerabilities") or []:
                      rows.add(f"Trivy {v.get('Severity')}: {v.get('VulnerabilityID')} in {v.get('PkgName')} {v.get('InstalledVersion')}")
              section(f"Packages of {label} (SBOM by Syft)", sorted(rows))
          run = f"Run: {os.environ['RUN']}"
          lines.append(run)
          full.append(run)
          (out / "full.md").write_text("\n".join(full) + "\n")
          # GitHub refuses an issue body over 65536 characters.
          body = "\n".join(lines)
          if len(body) > 60000:
              body = body[: body.rfind("\n", 0, 59000)] + f"\n\n… The report is longer than an issue holds; the run log has all of it.\n\n{run}"
          print(body)
          PY
          cat "$RUNNER_TEMP/security/out/full.md"
          title="Security report"
          number=$(gh issue list -R "$REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" -R "$REPOSITORY" --body-file "$RUNNER_TEMP/security/report.md"
          else
            gh issue create -R "$REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/security/report.md"
          fi

      - name: Job record
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/job-record@a20e612d91af50af313e06f0989b14457e0c6cb5
        with:
          task: daily security
          task-type: test
          status: ${{ job.status }}
          started-file: ${{ runner.temp }}/nddev-ci-started
