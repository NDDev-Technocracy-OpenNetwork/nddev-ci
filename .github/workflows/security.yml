# The daily security scan: live secrets in the whole history (TruffleHog and
# Kingfisher), every known vulnerability in the dependencies (OSV-Scanner with its offline
# database), the dependencies whose licence is outside the licence policy (OSV-Scanner with
# deps.dev, the one source of a lock file's licences), and the packages of the repository and of
# its images on an SBOM made by Syft (Trivy and Grype). A finding never fails the run; the run
# writes the bounded run summary and structured JSON in the job log, and uploads a report artifact
# for public repositories. A scanner that cannot run fails it.
name: security

on:
  workflow_call:
    inputs:
      # jscpd:ignore-start -- shared protected registry and hosted tool-pins inputs
      registry-commit:
        description: Exact commit of the protected registry input selected by the caller.
        type: string
        default: ''
      tool-pins:
        description: Optional JSON map of explicit version and per-arch sha256 tool pins for GitHub-hosted runners.
        type: string
        default: ''
      # jscpd:ignore-end
      artifact-registry:
        description: Optional tool-download registry; empty uses the runner setting or official upstream sources.
        type: string
        default: ''
      runner:
        description: The runner label the scan runs on.
        type: string
        default: nddev-linux-standart
      hosted-runner:
        description: >-
          The GitHub-hosted Linux runner of a public repository: ubuntu-24.04, ubuntu-24.04-arm,
          ubuntu-26.04 or ubuntu-26.04-arm.
        type: string
        default: ubuntu-24.04
      images:
        description: Container images the project releases, one per line, scanned on their SBOM.
        type: string
        default: ""
      timeout-minutes:
        description: The longest the scan may take.
        type: number
        default: 60
      sboms:
        description: An artifact of this run with SBOMs the caller made, such as of private images (`<name>.json`, CycloneDX, and `<name>.name` with the image).
        type: string
        default: ""
      license-policy:
        description: >-
          The caller's cargo-deny style TOML whose [licenses] allow list the licence scan uses,
          such as deny.toml, so cargo-deny and the scan read one list. Empty uses the default allowlist.
        type: string
        default: ""
    # jscpd:ignore-start -- shared protected registry snapshot secrets
    secrets:
      REGISTRY_SNAPSHOT_FIRST:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_SECOND:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_THIRD:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_FOURTH:
        description: Protected environment snapshot fragment.
        required: false
    # jscpd:ignore-end

# Callers declare permissions on their calling job: `contents: read`, plus `packages: read`
# when a private repository passes caller SBOMs through GHCR.
concurrency:
  group: nddev-ci-security-${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.hosted-runner }}
  cancel-in-progress: false

jobs:
  scan:
    name: daily security
    # Public repositories scan on GitHub's runners; an unknown hosted label fails below.
    # A light, architecture-independent job: on managed runners it takes whichever Linux runner has room.
    runs-on: ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || ((inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small') && 'nddev-linux-light' || inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.registry-commit != '' && format('registry-input-{0}', inputs.registry-commit) || '' }}
    env:
      # the default allowlist for embedded dependencies, as SPDX identifiers; a caller's policy replaces it.
      LICENSES: MIT,MIT-0,Apache-2.0,Apache-2.0 WITH LLVM-exception,BSD-2-Clause,BSD-3-Clause,0BSD,ISC,Zlib,BSL-1.0,BlueOak-1.0.0,CC0-1.0,Unicode-3.0,Unicode-DFS-2016,PostgreSQL,PSF-2.0,Python-2.0,CNRI-Python,MIT-CMU,IJG,CDLA-Permissive-2.0,MPL-2.0,EPL-2.0,Unlicense,NCSA,CC-BY-4.0
    steps:
      - name: Native scanner platform
        env:
          PRIVATE: ${{ github.event.repository.private }}
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
        run: |
          set -euo pipefail
          # The scanners run natively on Linux x64 or ARM64; any other system stops before preparation.
          if [ "$PRIVATE" != true ]; then
            case "$HOSTED_RUNNER" in
              ubuntu-24.04 | ubuntu-24.04-arm | ubuntu-26.04 | ubuntu-26.04-arm) ;;
              *) echo "::error::hosted-runner must be a GitHub-hosted Linux label of this workflow"; exit 1 ;;
            esac
          fi
          [ "$RUNNER_OS" = Linux ] || { echo "::error::the daily scan runs on Linux runners"; exit 1; }
          case "$(uname -m)" in x86_64 | aarch64 | arm64) ;; *) echo "::error::the daily scan supports Linux x64 and ARM64"; exit 1 ;; esac
          case "${RUNNER_TEMP:-}" in
            '' | *$'\n'* | *$'\r'*) echo "::error::RUNNER_TEMP must be an absolute single-line path"; exit 1 ;;
            /*) ;;
            *) echo "::error::RUNNER_TEMP must be an absolute single-line path"; exit 1 ;;
          esac
          date +%s > "$RUNNER_TEMP/nddev-ci-started"
          # Route scanner scratch files through RUNNER_TEMP so clones and archives stay off /tmp.
          tmp="$RUNNER_TEMP/security/tmp"
          mkdir -p "$tmp"
          chmod 0700 "$tmp"
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$tmp" "$tmp" "$tmp" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # jscpd:ignore-start -- shared telemetry, artifact-registry and actions/registry-input steps
      - name: Outside telemetry off
        uses: $/actions/telemetry

      - name: Artifact registry
        uses: $/actions/artifact-registry
        with:
          url: ${{ inputs.artifact-registry }}

      - name: Receive the protected registry input
        id: registry-input
        if: inputs.registry-commit != ''
        uses: $/actions/registry-input
        with:
          commit: ${{ inputs.registry-commit }}
          sha256: ${{ vars.REGISTRY_SNAPSHOT_SHA256 }}
          first: ${{ secrets.REGISTRY_SNAPSHOT_FIRST }}
          second: ${{ secrets.REGISTRY_SNAPSHOT_SECOND }}
          third: ${{ secrets.REGISTRY_SNAPSHOT_THIRD }}
          fourth: ${{ secrets.REGISTRY_SNAPSHOT_FOURTH }}
      # jscpd:ignore-end

      - name: Tools
        uses: $/actions/security-tools
        with:
          tool-pins: ${{ inputs.tool-pins }}
          github-token: ${{ github.token }}

      - name: The caller's SBOMs
        if: ${{ !github.event.repository.private && inputs.sboms != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.sboms }}
          path: ${{ runner.temp }}/security/caller

      - name: The caller's SBOMs (OCI)
        if: ${{ github.event.repository.private && inputs.sboms != '' }}
        uses: $/actions/oci-artifact
        with:
          mode: pull
          name: ${{ inputs.sboms }}
          directory: ${{ runner.temp }}/security/caller
          github-token: ${{ github.token }}

      - name: Secrets
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/security/out"
          mkdir -p "$out"
          # Each scanner's own exit code: findings are reported, never fatal; anything else is.
          trufflehog git "file://$PWD" --results=verified --json --no-update > "$out/trufflehog.jsonl"
          status=0
          kingfisher scan . --only-valid --no-update-check --format json > "$out/kingfisher.json" || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 200 ] || { echo "::error::Kingfisher ended with $status"; exit 1; }

      - name: Licence policy
        id: licences
        env:
          POLICY: ${{ inputs.license-policy }}
        run: |
          set -euo pipefail
          # A configured policy must exist and name SPDX identifiers or WITH exceptions.
          python3 -I - "$POLICY" >> "$GITHUB_OUTPUT" <<'PY'
          import os, re, sys, tomllib
          path = sys.argv[1]
          allow = os.environ["LICENSES"].split(",")
          if path:
              if os.path.isabs(path) or ".." in path.split("/") or not os.path.isfile(path) or os.path.islink(path):
                  sys.exit(f"::error::licence policy {path!r} is not a regular file in the repository")
              try:
                  policy = tomllib.load(open(path, "rb"))
              except (OSError, tomllib.TOMLDecodeError) as error:
                  sys.exit(f"::error::licence policy {path!r} is not valid TOML: {error}")
              allow = (policy.get("licenses") or {}).get("allow")
          if not isinstance(allow, list) or not allow or not all(
              isinstance(item, str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.+-]*(?: WITH [A-Za-z0-9][A-Za-z0-9.+-]*)?", item) for item in allow
          ) or len(set(allow)) != len(allow):
              sys.exit(f"::error::licence policy {path!r} needs a [licenses] allow list of unique SPDX identifiers or WITH exceptions")
          # OSV accepts identifiers, not WITH expressions. Drop a redundant exception only
          # when the policy independently permits its base; never broaden an exception-only rule.
          for item in allow:
              if " WITH " in item and item.split(" WITH ")[0] not in allow:
                  sys.exit("::error::OSV cannot enforce an exception-only licence policy; its base must be independently allowed")
          identifiers = [item for item in allow if " WITH " not in item]
          print("licenses=" + ",".join(identifiers))
          print("allowed=" + ",".join(allow))
          print(f"Licence policy: {path or 'default'}, {len(identifiers)} scanner identifiers.", file=sys.stderr)
          PY

      - name: Dependencies and licences
        uses: $/actions/daily-osv # verified native scanner policy
        with:
          scanner: ${{ runner.temp }}/security/bin/osv-scanner
          output: ${{ runner.temp }}/security/out
          licenses: ${{ steps.licences.outputs.licenses }}

      - name: Packages
        uses: $/actions/daily-sbom
        with:
          tools: ${{ runner.temp }}/security/bin
          output: ${{ runner.temp }}/security/out
          images: ${{ inputs.images }}
          sboms: ${{ inputs.sboms != '' && format('{0}/security/caller', runner.temp) || '' }}

      - name: Report
        env:
          PRIVATE: ${{ github.event.repository.private }}
          POLICY: ${{ inputs.license-policy }}
          ALLOWED: ${{ steps.licences.outputs.allowed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/security/out" > "$RUNNER_TEMP/security/report.md" <<'PY'
          import json, pathlib, os, re, sys
          out = pathlib.Path(sys.argv[1])
          is_private = os.environ.get("PRIVATE") == "true"
          scanners = {
              name: os.environ.get(var, "")
              for name, var in [
                  ("TruffleHog", "TRUFFLEHOG_VERSION"),
                  ("Kingfisher", "KINGFISHER_VERSION"),
                  ("OSV-Scanner", "OSV_SCANNER_VERSION"),
                  ("Syft", "SYFT_VERSION"),
                  ("Grype", "GRYPE_VERSION"),
                  ("Trivy", "TRIVY_VERSION"),
              ]
              if os.environ.get(var)
          }
          lines = ["The daily security scan: findings are reported without hiding scanner failures.", ""]
          # The summary shows 50 rows a section and stays within 1 MiB; JSON and the run log keep every row.
          full = list(lines)
          findings = []
          def finding(kind, scanner, identifier, target, info=None, severity=None, fixed_versions=(), **details):
              info = info or {}
              findings.append({"kind": kind, "scanner": scanner, "severity": severity,
                  "identifier": identifier, "package": info.get("name") or "",
                  "ecosystem": info.get("ecosystem") or "", "installed_version": info.get("version") or "",
                  "fixed_versions": sorted(set(fixed_versions)), "target": target or "", **details})
          def section(title, rows):
              for text in (lines, full):
                  text.append(f"## {title}: {len(rows)}")
              lines.extend(f"- {row}" for row in rows[:50])
              full.extend(f"- {row}" for row in rows)
              if len(rows) > 50:
                  lines.append(f"- … and {len(rows) - 50} more in the run log")
              lines.append("")
              full.append("")
          secrets = []
          for line in (out / "trufflehog.jsonl").read_text().splitlines():
              found = json.loads(line)
              where = found.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
              secrets.append(f"TruffleHog, verified {found.get('DetectorName')}: {where.get('file')}:{where.get('line')} in {str(where.get('commit'))[:12]}")
              finding("secret", "TruffleHog", found.get("DetectorName"), where.get("file"),
                  verified=True, line=where.get("line"), commit=where.get("commit"))
          # Kingfisher writes its findings on the first line and a summary on the second.
          kingfisher = json.loads(((out / "kingfisher.json").read_text().splitlines() or ["{}"])[0])
          for found in kingfisher.get("findings", []) if isinstance(kingfisher, dict) else []:
              rule = found.get("rule", {})
              where = found.get("finding", {})
              secrets.append(f"Kingfisher, valid {rule.get('name')}: {where.get('path')}:{where.get('line')}")
              finding("secret", "Kingfisher", rule.get("name"), where.get("path"),
                  verified=True, line=where.get("line"))
          section("Live secrets", secrets)
          vulnerabilities = []
          osv = json.loads((out / "osv.json").read_text() or "{}")
          for result in osv.get("results") or []:
              for package in result.get("packages") or []:
                  info = package.get("package", {})
                  for vulnerability in package.get("vulnerabilities") or []:
                      vulnerabilities.append(f"{vulnerability.get('id')} in {info.get('ecosystem')} {info.get('name')} {info.get('version')} ({os.path.relpath(result.get('source', {}).get('path', '.'))})")
                      affected = [entry for entry in vulnerability.get("affected") or []
                          if entry.get("package", {}).get("name") == info.get("name")
                          and entry.get("package", {}).get("ecosystem") == info.get("ecosystem")]
                      ranges = [item for entry in affected for item in entry.get("ranges") or []]
                      fixes = [event["fixed"] for item in ranges for event in item.get("events") or [] if event.get("fixed")]
                      scores = [score for entry in affected for score in entry.get("severity") or []] or vulnerability.get("severity") or []
                      finding("vulnerability", "OSV-Scanner", vulnerability.get("id"),
                          os.path.relpath(result.get("source", {}).get("path", ".")), info,
                          (vulnerability.get("database_specific") or {}).get("severity"), fixes,
                          severity_scores=scores, affected_ranges=ranges)
          section("Vulnerable dependencies (OSV-Scanner)", sorted(set(vulnerabilities)))
          outside, unknown = set(), set()
          allowed = set(os.environ["ALLOWED"].split(","))
          # cargo-deny's per-package exceptions in the same policy file, such as an LGPL library
          # loaded unchanged and dynamically: [[licenses.exceptions]] name = "sharp", allow = [...].
          exceptions = {}
          if os.environ.get("POLICY"):
              import tomllib
              policy = tomllib.load(open(os.environ["POLICY"], "rb")).get("licenses") or {}
              for exception in policy.get("exceptions") or []:
                  if isinstance(exception, dict) and isinstance(exception.get("name"), str):
                      exceptions.setdefault(exception["name"], set()).update(
                          item for item in exception.get("allow") or [] if isinstance(item, str))
          # deps.dev marks licence strings it cannot map as non-standard; a PyPI package then
          # answers with its own SPDX expression or its trove classifiers.
          classifiers = {
              "MIT License": {"MIT"}, "Apache Software License": {"Apache-2.0"},
              "BSD License": {"BSD-2-Clause", "BSD-3-Clause"}, "ISC License (ISCL)": {"ISC"},
              "Python Software Foundation License": {"PSF-2.0"},
              "Mozilla Public License 2.0 (MPL 2.0)": {"MPL-2.0"},
          }
          def pypi_allowed(name, version):
              import urllib.request
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/{version}/json", timeout=20) as answer:
                      data = json.load(answer).get("info") or {}
              except Exception:
                  return False
              expression = data.get("license_expression") or ""
              if expression:
                  terms = [term for term in re.split(r"[()\s]+|\bAND\b|\bOR\b", expression) if term]
                  return bool(terms) and all(term in allowed for term in terms)
              found = [label.rsplit(" :: ", 1)[-1] for label in data.get("classifiers") or [] if label.startswith("License :: OSI Approved :: ")]
              return bool(found) and all(classifiers.get(label, set()) & allowed for label in found)
          licences = json.loads((out / "licenses.json").read_text() or "{}")
          for result in licences.get("results") or []:
              for package in result.get("packages") or []:
                  violations = package.get("license_violations") or []
                  if not violations:
                      continue
                  info = package.get("package", {})
                  name = f"{info.get('ecosystem')} {info.get('name')} {info.get('version')}"
                  if set(violations) <= {"UNKNOWN"}:
                      unknown.add(name)
                      finding("license", "OSV-Scanner", "UNKNOWN",
                          os.path.relpath(result.get("source", {}).get("path", ".")), info)
                      continue
                  if set(violations) <= exceptions.get(info.get("name"), set()) | allowed:
                      continue
                  if info.get("ecosystem") == "PyPI" and {item.lower() for item in violations} <= {"non-standard"} | {item.lower() for item in allowed} and pypi_allowed(info.get("name"), info.get("version")):
                      continue
                  outside.add(f"{name}: {', '.join(package.get('licenses') or violations)} ({os.path.relpath(result.get('source', {}).get('path', '.'))})")
                  finding("license", "OSV-Scanner", ", ".join(violations),
                      os.path.relpath(result.get("source", {}).get("path", ".")), info,
                      licenses=package.get("licenses") or violations)
          section("Licences outside the licence policy (OSV-Scanner with deps.dev)", sorted(outside))
          if unknown:
              for text in (lines, full):
                  text.insert(-1, f"{len(unknown)} packages have no licence in deps.dev, such as the project's own and pub.dev's; check them by hand.")
          for grype in sorted(out.glob("grype-*.json")):
              name = grype.stem.removeprefix("grype-")
              label = (out / f"{name}.name").read_text().strip() if (out / f"{name}.name").exists() else "the repository"
              rows = set()
              for match in json.loads(grype.read_text()).get("matches") or []:
                  v = match.get("vulnerability", {})
                  a = match.get("artifact", {})
                  rows.add(f"Grype {v.get('severity')}: {v.get('id')} in {a.get('name')} {a.get('version')}")
                  finding("vulnerability", "Grype", v.get("id"), label,
                      {"name": a.get("name"), "version": a.get("version"), "ecosystem": a.get("type")},
                      v.get("severity"), (v.get("fix") or {}).get("versions") or [])
              trivy = out / f"trivy-{name}.json"
              for result in json.loads(trivy.read_text()).get("Results") or []:
                  for v in result.get("Vulnerabilities") or []:
                      rows.add(f"Trivy {v.get('Severity')}: {v.get('VulnerabilityID')} in {v.get('PkgName')} {v.get('InstalledVersion')}")
                      finding("vulnerability", "Trivy", v.get("VulnerabilityID"), label,
                          {"name": v.get("PkgName"), "version": v.get("InstalledVersion"), "ecosystem": result.get("Type")},
                          v.get("Severity"), [value.strip() for value in (v.get("FixedVersion") or "").split(",") if value.strip()],
                          package_target=result.get("Target") or "")
              section(f"Packages of {label} (SBOM by Syft)", sorted(rows))
          counts = {
              "secrets": sum(1 for row in findings if row["kind"] == "secret"),
              "vulnerabilities": sum(1 for row in findings if row["kind"] == "vulnerability"),
              "licenses_outside_policy": sum(1 for row in findings if row["kind"] == "license" and row["identifier"] != "UNKNOWN"),
              "licenses_unknown": sum(1 for row in findings if row["kind"] == "license" and row["identifier"] == "UNKNOWN"),
              "total": len(findings),
          }
          header = [
              f"Findings: {counts['total']} total ({counts['secrets']} live secrets, {counts['vulnerabilities']} vulnerabilities, {counts['licenses_outside_policy']} licences outside policy, {counts['licenses_unknown']} unknown licences).",
          ]
          if scanners:
              header.append("Scanners: " + ", ".join(f"{name} {version}" for name, version in scanners.items()) + ".")
          header.append("")
          lines[2:2] = header
          full[2:2] = header
          run = f"Run: {os.environ['RUN']}"
          lines.append(run)
          full.append(run)
          (out / "full.md").write_text("\n".join(full) + "\n")
          document = {
              "schema_version": 1,
              "event.name": "nddev_ci.security.report",
              "run": os.environ["RUN"],
              "scanners": scanners,
              "counts": counts,
              "findings": findings,
          }
          (out / "security-report.json").write_text(json.dumps(document, indent=2) + "\n")
          (out / "security-report.jsonl").write_text(json.dumps(document, separators=(",", ":")) + "\n")
          # GitHub Actions limits each step's job summary to 1 MiB (1,048,576 UTF-8 bytes).
          max_summary_bytes = 960 * 1024
          body = "\n".join(lines) + "\n"
          encoded = body.encode("utf-8")
          if len(encoded) > max_summary_bytes:
              where = "the run log" if is_private else "the artifact and run log"
              suffix = f"\n\n… The complete report is in {where}.\n\n{run}\n".encode("utf-8")
              budget = max(0, max_summary_bytes - len(suffix))
              prefix = encoded[:budget]
              cut = prefix.rfind(b"\n")
              if cut > 0:
                  prefix = prefix[:cut]
              body = prefix.decode("utf-8", errors="ignore") + suffix.decode("utf-8")
          sys.stdout.write(body)
          PY
          cat "$RUNNER_TEMP/security/out/full.md"
          echo "::group::Structured security report"
          cat "$RUNNER_TEMP/security/out/security-report.jsonl"
          echo "::endgroup::"
          cat "$RUNNER_TEMP/security/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the security report
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security/out/security-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: daily security
          task-type: test
          status: ${{ job.status }}
          failure-layer: ${{ job.status == 'failure' && 'library' || '' }}
          failure-reason: ${{ job.status == 'failure' && (steps.registry-input.outputs.failure-reason || (steps.licences.outcome == 'failure' && 'license-policy-invalid') || 'security-scan-failed') || '' }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started
          schedule: ${{ github.event_name == 'schedule' && ((!github.event.timezone || github.event.timezone == 'UTC') && github.event.schedule || 'unknown') || '' }}
