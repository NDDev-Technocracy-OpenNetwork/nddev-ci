# The library's own release: every commit main moves forward to becomes an immutable release,
# verified by its full check on dev, so callers pin a released commit and Dependabot moves them.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: A version the owner chose; empty raises the last number.
        type: string
        default: ''

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # find the full check of the commit on dev
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outside telemetry off
        uses: ./actions/telemetry
      - name: Release the verified commit
        uses: ./actions/release
        with:
          check-workflow: ci.yml
          name: NDDev CI
          initial-version: 0.6.26
          version: ${{ inputs.version }}
