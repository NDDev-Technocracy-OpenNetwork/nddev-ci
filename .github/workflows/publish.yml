# The library's own release: every commit main moves forward to becomes an immutable release,
# verified by its full check on dev, so callers pin a released commit and Dependabot moves them.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: A version the owner chose; empty raises the last number.
        type: string
        default: ''

permissions: {}

jobs:
  release:
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read # find the full check of the commit on dev
      contents: write # create the tag and the release
    with:
      check-workflow: ci.yml
      name: NDDev CI
      initial-version: 0.6.26
      version: ${{ inputs.version }}
