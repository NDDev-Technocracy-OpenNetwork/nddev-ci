name: portable recipe
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reusable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025, windows-11-arm]
    uses: ./.github/workflows/recipe.yml
    with:
      runner: ${{ matrix.os }}
      node-version: '26.13.0'
      python-version: '3.15.2'
      uv-version: '0.13.7'
      bun-version: '1.4.4'
      rust-version: '1.99.1'
      rust-components: clippy,rustfmt
      prepare: environment-probe
      recipe: script-probe
      justfile: tests/fixtures/portable.just
      arguments: '["path with spaces","$(must-stay-literal)","مرحبا-Ә-测试"]'
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Outside telemetry off
        uses: ./actions/telemetry
      - name: Require the telemetry switches on this system
        run: >-
          node -e "for(const [n,v] of Object.entries({DO_NOT_TRACK:'1',BUN_DO_NOT_TRACK:'1',TRIVY_DISABLE_TELEMETRY:'true'}))if(process.env[n]!==v)throw Error('telemetry switch missing: '+n)"
      - name: Prepare declared native SDKs
        id: sdk
        uses: ./actions/hosted-sdk
        with:
          node-version: '26.13.0'
          python-version: '3.15.2'
          uv-version: '0.13.7'
          bun-version: '1.4.4'
          rust-version: '1.99.1'
          rust-components: clippy,rustfmt
          java-version: '25.0.5'
          go-version: '1.27.3'
          tools: cargo-nextest@0.9.151
          # Flutter publishes its Linux and Windows SDK for x64 only.
          flutter-version: ${{ (runner.os == 'macOS' || runner.arch == 'X64') && '3.47.9' || '' }}
      - name: Require measured SDK versions
        env:
          SDK_RECEIPT: ${{ steps.sdk.outputs.receipt }}
          FLUTTER: ${{ (runner.os == 'macOS' || runner.arch == 'X64') && 'true' || '' }}
        run: >-
          node -e "const r=JSON.parse(process.env.SDK_RECEIPT);
          const expected={node:'26.13.0',python:'3.15.2',uv:'0.13.7',bun:'1.4.4',rust:'1.99.1',java:'25.0.5',go:'1.27.3',...(process.env.FLUTTER?{flutter:'3.47.9',dart:'3.13.7'}:{})};
          for(const [name,version] of Object.entries(expected))if(r.versions[name]!==version)throw Error('SDK receipt mismatch: '+name)"
      - name: Require the declared tool at its version
        run: cargo nextest --version
      - name: Prepare the same SDKs again from the tool cache
        id: sdk-again
        uses: ./actions/hosted-sdk
        with:
          node-version: '26.13.0'
          python-version: '3.15.2'
          uv-version: '0.13.7'
      - name: Require the repeated preparation to measure the same versions
        env:
          SDK_RECEIPT: ${{ steps.sdk-again.outputs.receipt }}
        run: >-
          node -e "const r=JSON.parse(process.env.SDK_RECEIPT);
          for(const [name,version] of Object.entries({node:'26.13.0',python:'3.15.2',uv:'0.13.7'}))if(r.versions[name]!==version)throw Error('repeated SDK mismatch: '+name)"
      - name: Check argument and workspace boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --test tests/*.test.mjs
      - name: Select a pinned public asset for this native runner
        run: >-
          node -e "const fs=require('node:fs'),p=require('./actions/recipe/just.json'),a=p.targets[process.platform+'-'+process.arch];
          fs.writeFileSync('native-assets.json',JSON.stringify({schema_version:1,assets:[{repository:p.repository,asset:a.asset,size:a.size,sha256:a.sha256,file:a.name,members:[{path:process.platform==='win32'?'just.exe':'just',file:process.platform==='win32'?'prepared-just.exe':'prepared-just',size:a.binary_size,sha256:a.binary_sha256,executable:true}]}]}))"
      - name: Prepare the exact public asset bytes
        id: native-assets
        uses: ./actions/release-assets
        with:
          manifest: native-assets.json
          directory: ${{ runner.temp }}/native-assets
          add-to-path: true
      - name: Execute the verified native member
        env:
          NATIVE_ASSET_RECEIPT: ${{ steps.native-assets.outputs.receipt }}
        run: >-
          node -e "const {execFileSync}=require('node:child_process'),p=require('./actions/recipe/just.json'),r=JSON.parse(process.env.NATIVE_ASSET_RECEIPT);
          if(r.assets[0].files.length!==2)throw Error('missing native receipt');
          if(execFileSync('prepared-just',['--version'],{encoding:'utf8'}).trim()!=='just '+p.version)throw Error('native tool version mismatch')"
      - name: Verify and reuse the warm public asset
        uses: ./actions/release-assets
        with:
          manifest: native-assets.json
          directory: ${{ runner.temp }}/native-assets
      - name: Run the real pinned native task runner
        id: probe
        uses: ./actions/recipe
        with:
          justfile: tests/fixtures/portable.just
          recipe: probe
          arguments: '["path with spaces","$(must-stay-literal)","مرحبا-Ә-测试"]'
      - name: Require the action's admitted version receipt
        env:
          ACTUAL_VERSION: ${{ steps.probe.outputs.just-version }}
        run: node -e "const p=require('./actions/recipe/just.json'); if(process.env.ACTUAL_VERSION!==p.version)process.exit(1)"
      - name: Run a script recipe and its nested task runner
        uses: ./actions/recipe
        with:
          justfile: tests/fixtures/portable.just
          recipe: script-probe
          arguments: '["path with spaces","$(must-stay-literal)","مرحبا-Ә-测试"]'
