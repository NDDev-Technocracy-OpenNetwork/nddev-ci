name: portable recipe
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reusable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025, windows-11-arm]
    uses: ./.github/workflows/recipe.yml
    with:
      hosted-runner: ${{ matrix.os }}
      node-version: '26.13.1'
      python-version: '3.15.2'
      uv-version: '0.13.10'
      bun-version: '1.4.5'
      rust-version: '1.100.0'
      rust-components: clippy,rustfmt
      prepare: environment-probe
      recipe: script-probe
      justfile: tests/fixtures/portable.just
      arguments: '["path with spaces","$(must-stay-literal)","مرحبا-Ә-测试"]'
  profile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-x64
            platform: linux-x64
          - profile: linux-arm64
            platform: linux-arm64
          - profile: macos-arm64
            platform: darwin-arm64
          - profile: windows-x64
            platform: win32-x64
    uses: ./.github/workflows/recipe.yml
    with:
      runner-profile: ${{ matrix.profile }}
      recipe: profile-probe
      justfile: tests/fixtures/portable.just
      arguments: ${{ format('["{0}"]', matrix.platform) }}
  native:
    env:
      JAVA_VERSION: '25.0.5.1+2'
      FLUTTER_VERSION: '3.47.9'
      DART_VERSION: '3.13.7'
      ANDROID_SDK: 'cmdline-tools@23.0,platform-tools@37.0.3,build-tools@37.0.0,platform@37.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Outside telemetry off
        uses: $/actions/telemetry
      - name: Require the telemetry switches on this system
        run: >-
          node -e "for(const [n,v] of Object.entries({DO_NOT_TRACK:'1',BUN_DO_NOT_TRACK:'1',TRIVY_DISABLE_TELEMETRY:'true'}))if(process.env[n]!==v)throw Error('telemetry switch missing: '+n)"
      - name: Prepare declared native SDKs
        id: sdk
        uses: $/actions/hosted-sdk
        with:
          node-version: '26.13.1'
          python-version: '3.15.2'
          uv-version: '0.13.10'
          bun-version: '1.4.5'
          rust-version: '1.100.0'
          rust-components: clippy,rustfmt
          # Temurin publishes no JDK for Windows on ARM64.
          java-version: ${{ (runner.os != 'Windows' || runner.arch != 'ARM64') && env.JAVA_VERSION || '' }}
          go-version: '1.27.4'
          dotnet-version: '11.0.100'
          ruby-version: '4.0.10'
          tools: cargo-nextest@0.9.152
          # Flutter and Android SDK publish Linux and Windows binaries for x64 only.
          flutter-version: ${{ (runner.os == 'macOS' || runner.arch == 'X64') && env.FLUTTER_VERSION || '' }}
          android-sdk: ${{ (runner.os == 'macOS' || runner.arch == 'X64') && env.ANDROID_SDK || '' }}
      - name: Require measured SDK versions
        id: expected
        env:
          SDK_RECEIPT: ${{ steps.sdk.outputs.receipt }}
          SDK_JAVA_VERSION: ${{ (runner.os != 'Windows' || runner.arch != 'ARM64') && env.JAVA_VERSION || '' }}
          SDK_FLUTTER_VERSION: ${{ (runner.os == 'macOS' || runner.arch == 'X64') && env.FLUTTER_VERSION || '' }}
          SDK_ANDROID_SDK: ${{ (runner.os == 'macOS' || runner.arch == 'X64') && env.ANDROID_SDK || '' }}
        run: >-
          bun -e "import fs from 'node:fs'; import path from 'node:path'; import assert from 'node:assert/strict';
          import {sdkInputs} from './lib/renovate-sdk.mjs'; import {selections} from './actions/hosted-sdk/run.mjs';
          import {parseAndroidSdkSpec} from './actions/hosted-sdk/android.mjs';
          const source=Bun.YAML.parse(fs.readFileSync('.github/workflows/recipe-smoke.yml','utf8')).jobs.native.steps;
          const request=id=>{
            const declaration=source.find(step=>step.id===id)?.with;
            if(!declaration)throw Error('missing SDK declaration: '+id);
            const environment={};
            for(const input of Object.keys(sdkInputs)){
              if(!Object.hasOwn(declaration,input))continue;
              const key='SDK_'+input.slice(0,-8).toUpperCase()+'_VERSION';
              const value=declaration[input];
              if(typeof value==='string' && value.startsWith(String.fromCharCode(36)+'{{')){
                if(!Object.hasOwn(process.env,key))throw Error('unresolved SDK declaration: '+key);
                environment[key]=process.env[key];
              }else environment[key]=value;
            }
            environment.SDK_TOOLS=declaration.tools??'';
            const expected=selections({...environment,SDK_RUNNER_ENVIRONMENT:process.env.RUNNER_ENVIRONMENT});
            if(!Object.keys(expected).length)throw Error('empty SDK declaration');
            if(expected.flutter){if(!process.env.DART_VERSION)throw Error('missing Dart declaration');expected.dart=process.env.DART_VERSION;}
            return {environment,expected};
          };
          const requests={sdk:request('sdk'),warm:request('sdk-again')};
          const requireVersions=versions=>{for(const [name,version] of Object.entries(requests.sdk.expected))if(versions[name]!==version)throw Error('SDK receipt mismatch: '+name);};
          const receipt=JSON.parse(process.env.SDK_RECEIPT);
          const measured=receipt.versions; requireVersions(measured);
          for(const name of Object.keys(requests.sdk.expected))for(const value of [undefined,'incorrect'])assert.throws(()=>requireVersions({...measured,[name]:value}),/SDK receipt mismatch:/);
          const expectedAndroid=parseAndroidSdkSpec(process.env.SDK_ANDROID_SDK??'').versions;
          if(Object.keys(expectedAndroid).length){assert.deepEqual(receipt.android,expectedAndroid);}
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'sdk-requests.json'),JSON.stringify(requests));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,Object.entries(requests.sdk.environment).map(([key,value])=>key+'='+value).join('\n')+'\n')"
      - name: Require the declared tool at its version
        run: cargo nextest --version
      - name: Build and verify a real Android APK with the prepared SDK
        if: runner.os != 'Windows' && (runner.os == 'macOS' || runner.arch == 'X64')
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
          adb --version
          work="$RUNNER_TEMP/android-apk-smoke"
          rm -rf "$work"
          mkdir -p "$work/res/values" "$work/src/com/example/smoke" "$work/gen" "$work/classes" "$work/dex"
          cat > "$work/AndroidManifest.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.smoke" android:versionCode="1" android:versionName="1.0">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="37" />
            <application android:label="@string/app_name">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > "$work/res/values/strings.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">Smoke</string>
          </resources>
          XML
          cat > "$work/src/com/example/smoke/MainActivity.java" <<'JAVA'
          package com.example.smoke;
          import android.app.Activity;
          import android.os.Bundle;
          public final class MainActivity extends Activity {
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setTitle(R.string.app_name);
            }
          }
          JAVA
          bt="$ANDROID_HOME/build-tools/37.0.0"
          jar="$ANDROID_HOME/platforms/android-37.0/android.jar"
          "$bt/aapt2" compile "$work/res/values/strings.xml" -o "$work/res.zip"
          "$bt/aapt2" link -I "$jar" --manifest "$work/AndroidManifest.xml" --java "$work/gen" -o "$work/unsigned.apk" "$work/res.zip"
          javac --release 17 -cp "$jar" -d "$work/classes" "$work/gen/com/example/smoke/R.java" "$work/src/com/example/smoke/MainActivity.java"
          find "$work/classes" -name '*.class' -print0 | xargs -0 "$bt/d8" --lib "$jar" --min-api 26 --output "$work/dex"
          (cd "$work/dex" && zip -q "$work/unsigned.apk" classes.dex)
          "$bt/zipalign" -p 4 "$work/unsigned.apk" "$work/aligned.apk"
          pass=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(12).toString("hex"))')
          keytool -genkeypair -keystore "$work/smoke.jks" -storepass "$pass" -keypass "$pass" -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Smoke"
          "$bt/apksigner" sign --ks "$work/smoke.jks" --ks-pass "pass:$pass" --key-pass "pass:$pass" --out "$work/signed.apk" "$work/aligned.apk"
          "$bt/apksigner" verify --verbose "$work/signed.apk"
          rm -rf "$work"
      - name: Prepare the same SDKs again from the tool cache
        id: sdk-again
        uses: $/actions/hosted-sdk
        with:
          node-version: '26.13.1'
          python-version: '3.15.2'
          uv-version: '0.13.10'
          java-version: ${{ (runner.os != 'Windows' || runner.arch != 'ARM64') && env.JAVA_VERSION || '' }}
      - name: Require the repeated preparation to measure the same versions
        env:
          SDK_RECEIPT: ${{ steps.sdk-again.outputs.receipt }}
        run: >-
          node -e "const fs=require('node:fs'),path=require('node:path');
          const expected=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'sdk-requests.json'),'utf8')).warm.expected;
          const r=JSON.parse(process.env.SDK_RECEIPT);
          for(const [name,version] of Object.entries(expected))if(r.versions[name]!==version)throw Error('repeated SDK mismatch: '+name)"
      - name: Hosted dependency caches of a Cargo and npm fixture
        uses: $/actions/hosted-cache
        with:
          working-directory: tests/fixtures/hosted-cache
      - name: Hosted dependency caches of a project without lock files
        uses: $/actions/hosted-cache
        with:
          working-directory: tests/fixtures/image
      - name: Select a pinned public asset for this native runner
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; import {hostedJustPin} from './lib/hosted-compat-pins.mjs';
          const p=hostedJustPin({RUNNER_ENVIRONMENT:'github-hosted'}),a=p.targets[process.platform+'-'+process.arch];
          fs.writeFileSync('native-assets.json',JSON.stringify({schema_version:1,assets:[{repository:p.repository,asset:a.asset,size:a.size,sha256:a.sha256,file:a.name,members:[{path:process.platform==='win32'?'just.exe':'just',file:process.platform==='win32'?'prepared-just.exe':'prepared-just',size:a.binary_size,sha256:a.binary_sha256,executable:true}]}]}))"
      - name: Prepare the exact public asset bytes
        id: native-assets
        uses: $/actions/release-assets
        with:
          manifest: native-assets.json
          directory: ${{ runner.temp }}/native-assets
          add-to-path: true
      - name: Execute the verified native member
        env:
          NATIVE_ASSET_RECEIPT: ${{ steps.native-assets.outputs.receipt }}
        run: >-
          node --input-type=module -e "import {execFileSync} from 'node:child_process'; import {hostedJustPin} from './lib/hosted-compat-pins.mjs';
          const p=hostedJustPin({RUNNER_ENVIRONMENT:'github-hosted'}),r=JSON.parse(process.env.NATIVE_ASSET_RECEIPT);
          if(r.assets[0].files.length!==2)throw Error('missing native receipt');
          if(execFileSync('prepared-just',['--version'],{encoding:'utf8'}).trim()!=='just '+p.version)throw Error('native tool version mismatch')"
      - name: Verify and reuse the warm public asset
        uses: $/actions/release-assets
        with:
          manifest: native-assets.json
          directory: ${{ runner.temp }}/native-assets
      - name: Run the real pinned native task runner
        id: probe
        uses: $/actions/recipe
        with:
          justfile: tests/fixtures/portable.just
          recipe: probe
          arguments: '["path with spaces","$(must-stay-literal)","مرحبا-Ә-测试"]'
      - name: Require the action's admitted version receipt
        env:
          ACTUAL_VERSION: ${{ steps.probe.outputs.just-version }}
        run: >-
          node --input-type=module -e "import {hostedJustPin} from './lib/hosted-compat-pins.mjs';
          if(process.env.ACTUAL_VERSION!==hostedJustPin({RUNNER_ENVIRONMENT:'github-hosted'}).version)process.exit(1)"
      - name: Check argument and workspace boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --test tests/*.test.mjs
      - name: Verify the prepared native frontend without downloads
        run: >-
          node --input-type=module -e "import {prepareFrontend} from './actions/recipe/run.mjs';
          await prepareFrontend({...process.env,RUNNER_ENVIRONMENT:'self-hosted',RUNNER_TEMP:''})"
      - name: Verify the managed SDK path without installing tools
        env:
          SDK_RUNNER_ENVIRONMENT: self-hosted
          SDK_NODE_VERSION: ${{ steps.expected.outputs.SDK_NODE_VERSION }}
          SDK_PYTHON_VERSION: ${{ steps.expected.outputs.SDK_PYTHON_VERSION }}
          SDK_UV_VERSION: ${{ steps.expected.outputs.SDK_UV_VERSION }}
          SDK_BUN_VERSION: ${{ steps.expected.outputs.SDK_BUN_VERSION }}
          SDK_RUST_VERSION: ${{ steps.expected.outputs.SDK_RUST_VERSION }}
          SDK_TOOLS: ${{ steps.expected.outputs.SDK_TOOLS }}
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path';
          import {main} from './actions/hosted-sdk/run.mjs';
          const env={...process.env,GITHUB_PATH:''};
          main('validate',{...env,RUNNER_TOOL_CACHE:''});
          const cache=fs.mkdtempSync(path.join(env.RUNNER_TEMP,'managed-sdk-'));
          try {
            const bin=path.join(cache,'node',process.versions.node,process.arch,'bin');
            fs.mkdirSync(bin,{recursive:true});
            const node=path.join(bin,process.platform==='win32'?'node.exe':'node');
            fs.copyFileSync(process.execPath,node); fs.chmodSync(node,0o755);
            main('verify',{...env,RUNNER_TOOL_CACHE:cache});
          } finally {fs.rmSync(cache,{recursive:true,force:true});}"
      - name: Run a script recipe and its nested task runner
        uses: $/actions/recipe
        with:
          justfile: tests/fixtures/portable.just
          recipe: script-probe
          arguments: '["path with spaces","$(must-stay-literal)","مرحبا-Ә-测试"]'
      - name: The job's record reaches the runner's telemetry file
        if: always()
        uses: $/actions/job-record
        env:
          NDDEV_CI_TELEMETRY_FILE: ${{ runner.temp }}/ci-telemetry.jsonl
        with:
          task: portable smoke
          status: ${{ job.status }}
          check-run-id: ${{ job.check_run_id }}
      - name: Require one valid record
        if: always()
        env:
          SINK: ${{ runner.temp }}/ci-telemetry.jsonl
        run: >-
          node -e "const l=require('fs').readFileSync(process.env.SINK,'utf8').trim().split('\n');
          const r=JSON.parse(l[l.length-1]); if(l.length!==1||r['event.name']!=='nddev_ci.job.completed'||!r['vcs.ref.head.revision'])throw Error('bad job record')"
  # Proof of provenance.yml on dev: a built file of this run is attested by the reusable workflow.
  provenance-fixture:
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Build a fixture file of this commit
        run: printf 'nddev-ci provenance fixture %s\n' "$GITHUB_SHA" > provenance-fixture.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-fixture
          path: provenance-fixture.txt
          if-no-files-found: error
          retention-days: 7
  provenance:
    needs: provenance-fixture
    uses: ./.github/workflows/provenance.yml
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write
    with:
      artifact-name: provenance-fixture
