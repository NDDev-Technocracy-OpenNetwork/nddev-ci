# Merges a pull request on green where branch rules cannot: a private repository on GitHub's free
# plan has no rules, so GitHub's auto-merge is not available there. The caller runs this when its
# check finishes (workflow_run, which runs on the default branch), so a pull request takes the
# label when it is opened. A pull request with the
# label, from this repository, whose every check on its exact head passed, is merged into its base
# with a merge commit, pushed with the same deploy key promote.yml uses: GitHub's job token cannot
# push commits that change workflow files, and a push by the key starts the base branch's checks.
# The caller keeps PROMOTION_KEY in an environment, `promotion` by default, that only its default
# branch may use, and calls this workflow with `secrets: inherit`. Without the key the job
# shows the exact qualified pull request for a trusted outside merger or a maintainer.
name: merge on green

on:
  workflow_call:
    inputs:
      required-checks:
        description: All mandatory native and merge-stop check names, one per line; optional skips cannot replace their success.
        type: string
        default: |
          check / short check
      label:
        description: The label that asks for a merge on green.
        type: string
        default: merge-on-green
      environment:
        description: The caller's environment holding PROMOTION_KEY.
        type: string
        default: promotion
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-release

permissions: {}

jobs:
  merge:
    name: merge on green
    runs-on: ${{ !github.event.repository.private && 'ubuntu-24.04' || ((inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light') && 'nddev-linux-release' || inputs.runner) }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: nddev-ci-merge-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      checks: read # read the checks of the commit
      contents: read # read the commit
      pull-requests: read # find the labelled pull request
      statuses: read # read the commit statuses
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"

      - name: Outside telemetry off
        uses: $/actions/telemetry

      - name: Choose the pull request
        id: choose
        uses: $/actions/merge-on-green
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          label: ${{ inputs.label }}
          required-checks: ${{ inputs.required-checks }}

      - name: Merge into the base branch
        id: git
        if: steps.choose.outputs.state == 'ready'
        uses: $/actions/protected-git
        with:
          operation: merge
          key: ${{ secrets.PROMOTION_KEY }}
          sha: ${{ github.event.workflow_run.head_sha }}
          repository: ${{ github.repository }}
          target: ${{ steps.choose.outputs.base }}
          environment: ${{ inputs.environment }}
          merge-number: ${{ steps.choose.outputs.number }}
          merge-head: ${{ steps.choose.outputs.head }}

      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: merge
          task-type: deploy
          status: ${{ job.status }}
          failure-layer: ${{ job.status == 'failure' && 'library' || '' }}
          failure-reason: ${{ job.status == 'failure' && (steps.git.outputs.failure-reason || (steps.choose.outcome == 'failure' && 'merge-selection-failed') || 'workflow-step-failed') || '' }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started
