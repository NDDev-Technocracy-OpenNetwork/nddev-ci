# The merge stops for a pull request: a secret in the change (Betterleaks), a
# dangerous workflow (a broken file, an action not pinned by commit, a high-severity zizmor finding,
# a poutine finding of warning or error level), a new critical dependency with a known fix and new
# code clones when the project enables the check. The
# change's commit messages and the pull request's text are checked as hints that never stop a
# merge. check.yml calls it; a
# project whose commands run in its own native jobs calls it beside them, so one implementation
# applies the same stops everywhere.
name: merge stops

on:
  workflow_call:
    inputs:
      retain-runs:
        description: Give each run its own concurrency group and let it finish.
        type: boolean
        default: false
      new-clones:
        description: Reject new code clones using the pull request base's .jscpd.json.
        type: boolean
        default: false
      sparse-checkout:
        description: Keep .github and merge-stop policy files. Use when local action metadata is in .github.
        type: boolean
        default: false
      artifact-registry:
        description: Optional tool-download registry; empty uses the runner setting or official upstream sources.
        type: string
        default: ''
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      runner-profile:
        description: Managed job platform for profile-aware GitHub fallback.
        type: string
        default: ''
      public-self-hosted-runner:
        description: Optional self-hosted runner label for a public repository.
        type: string
        default: ''
      hosted-runner:
        description: >-
          The GitHub-hosted Linux runner of a public repository: ubuntu-24.04, ubuntu-24.04-arm,
          ubuntu-26.04 or ubuntu-26.04-arm.
        type: string
        default: ubuntu-24.04
      upstream-branch:
        description: Optional branch in this repository that mirrors a fork's upstream; its commit ancestry is skipped by authorship.
        type: string
        default: ''

permissions: {}

jobs:
  merge-stops:
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'merge stops' || 'ignored merge stops' }}
    # Integration pushes do not reuse the mandatory pull-request or merge-group context.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    # Public repositories default to GitHub's runners; an unknown hosted label fails below.
    # The light Linux job follows its own runner profile.
    # runner-profile:stops
    runs-on: >-
      ${{ !github.event.repository.private && (inputs['public-self-hosted-runner'] || (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04')) || github.event.repository.private && (((inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || '') != '' && (contains(github.event.pull_request.labels.*.name, format('runner:github:{0}', (inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || ''))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == (inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || '')))) && fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[(inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || '')] || (contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == '')) && (fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[(inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || '')] || 'ubuntu-24.04')
      || (github.event_name == 'pull_request' && github.event.sender.type == 'Bot' && github.event.pull_request.user.type == 'Bot' && github.actor == github.triggering_actor && fromJSON('{"nddev-linux-bounded":"nddev-linux-bounded-maintenance","nddev-linux-light":"nddev-linux-light-maintenance","nddev-linux-small":"nddev-linux-small-maintenance","nddev-linux-standart":"nddev-linux-standart-maintenance","nddev-macos":"nddev-macos-maintenance","nddev-windows":"nddev-windows-maintenance"}')[((inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64')) && 'nddev-linux-light' || inputs.runner)] || ((inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64')) && 'nddev-linux-light' || inputs.runner))) || '' }}
    # A new push to the pull request cancels its older stops of the same workflow and runner.
    concurrency:
      group: nddev-ci-merge-stops-${{ github.workflow }}-${{ inputs.retain-runs && format('run-{0}', github.run_id) || github.ref }}-${{ inputs.runner }}-${{ inputs.hosted-runner }}-${{ inputs.runner-profile }}
      cancel-in-progress: ${{ !inputs.retain-runs && github.event_name == 'pull_request' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start and hosted runner
        env:
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
          HOSTED: ${{ !github.event.repository.private && inputs['public-self-hosted-runner'] == '' }}
        run: |
          if [ "$HOSTED" = true ]; then
            case "$HOSTED_RUNNER" in
            ubuntu-24.04 | ubuntu-24.04-arm | ubuntu-26.04 | ubuntu-26.04-arm) ;;
            *) echo "::error::hosted-runner must be a GitHub-hosted Linux label of this workflow"; exit 1 ;;
            esac
          fi
          date +%s > "$RUNNER_TEMP/nddev-ci-started"

      # Keep full history for authorship and change checks. Metadata-only callers also restrict
      # the worktree before checkout, so retained payloads outside .github stay unfetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |-
            ${{ !inputs.new-clones && inputs.sparse-checkout && '/.github/' || '' }}
            ${{ !inputs.new-clones && inputs.sparse-checkout && '/committed.toml' || '' }}
            ${{ !inputs.new-clones && inputs.sparse-checkout && '/.betterleaks.toml' || '' }}
            ${{ !inputs.new-clones && inputs.sparse-checkout && '/.betterleaksignore' || '' }}
            ${{ !inputs.new-clones && inputs.sparse-checkout && '/.gitleaks.toml' || '' }}
            ${{ !inputs.new-clones && inputs.sparse-checkout && '/.gitleaksignore' || '' }}
          sparse-checkout-cone-mode: false

      - name: Outside telemetry off
        uses: $/actions/telemetry

      - name: Artifact registry
        uses: $/actions/artifact-registry
        with:
          url: ${{ inputs.artifact-registry }}

      - name: Merge stops
        id: stops
        uses: $/actions/merge-stops
        with:
          new-clones: ${{ inputs.new-clones }}
          upstream-branch: ${{ inputs.upstream-branch }}

      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: merge stops
          task-type: test
          status: ${{ job.status }}
          check-run-id: ${{ job.check_run_id }}
          # A stop that judged the change, or the steps around them (nddev_ci.failure.layer).
          failure-layer: ${{ job.status == 'failure' && (steps.stops.outputs.failure-layer || 'library') || '' }}
          started-file: ${{ runner.temp }}/nddev-ci-started
