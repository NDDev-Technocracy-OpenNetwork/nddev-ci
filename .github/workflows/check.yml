# The check of an NDDev project. A pull request gets the short check, `just check` and `just test`;
# a push to `dev` or a run by hand gets the full check, `just verify`. As delivery.md asks, public
# repositories run on GitHub's runners and private ones on ours, unless the pull request carries
# the label `runner:blacksmith` or `runner:github`, or a run by hand chooses `blacksmith` or
# `github` in its `runner` input.
name: check

on:
  workflow_call:
    inputs:
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      timeout-minutes:
        description: How long the check may run.
        type: number
        default: 30
      artifact:
        description: A file or folder the full check leaves for deployment, such as a release binary.
        type: string
        default: ""
      artifact-name:
        description: The name the artifact is kept under.
        type: string
        default: build

permissions: {}

jobs:
  check:
    name: ${{ github.event_name == 'pull_request' && 'short check' || 'full check' }}
    # A new label reruns the check only when it chooses the runner.
    if: github.event.action != 'labeled' || startsWith(github.event.label.name, 'runner:')
    runs-on: ${{ !github.event.repository.private && 'ubuntu-24.04' || (contains(github.event.pull_request.labels.*.name, 'runner:blacksmith') || github.event.inputs.runner == 'blacksmith') && 'blacksmith-2vcpu-ubuntu-2404' || (contains(github.event.pull_request.labels.*.name, 'runner:github') || github.event.inputs.runner == 'github') && 'ubuntu-24.04' || inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      JUST_VERSION: "1.59.0"
      JUST_SHA256: "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e"
      SCCACHE_VERSION: "0.19.0"
      SCCACHE_SHA256: "aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd"
      # The contour cache gateway's settings on our runner machines.
      GATEWAY_SETTINGS: /etc/contour/caches/environment.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tools
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/nddev-ci/bin"
          archive="$RUNNER_TEMP/nddev-ci/archive.tar.gz"
          mkdir -p "$bin"
          fetch() {
            curl -fsSL --retry 3 -o "$archive" "$1"
            echo "$2  $archive" | sha256sum --check --quiet
            tar -xzf "$archive" -C "$bin" --strip-components="$3" "$4"
          }
          fetch "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            "$JUST_SHA256" 0 just
          if [ -r "$GATEWAY_SETTINGS" ]; then
            fetch "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl.tar.gz" \
              "$SCCACHE_SHA256" 1 "sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl/sccache"
          fi
          rm -f "$archive"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Network cache
        # Jobs of dev and main read and write the contour's R2 cache; every other job only reads it,
        # so a pull request never writes what a release build reads.
        run: |
          set -euo pipefail
          if [ ! -r "$GATEWAY_SETTINGS" ]; then
            echo "This runner has no contour cache gateway; the build runs without the network cache."
            exit 0
          fi
          setting() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" "$GATEWAY_SETTINGS" | head -n 1; }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/dev | push:refs/heads/main | workflow_dispatch:refs/heads/dev | workflow_dispatch:refs/heads/main | schedule:refs/heads/dev | schedule:refs/heads/main)
              address=$(setting trusted_listen)
              mode=READ_WRITE
              ;;
            *)
              address=$(setting untrusted_listen)
              mode=READ_ONLY
              ;;
          esac
          bucket=$(setting bucket)
          if [ -z "$address" ] || [ -z "$bucket" ]; then
            echo "::error::$GATEWAY_SETTINGS lacks the gateway's addresses or bucket"
            exit 1
          fi
          # Rust cache keys hold the paths of the dependency sources, so every job builds with the
          # machine's one Cargo home and its dependencies match across runner slots and jobs.
          cargo_home=${NDDEV_CARGO_DOWNLOAD_CACHE:-${CARGO_HOME:-$HOME/.cargo}}
          {
            echo "CARGO_HOME=$cargo_home"
            echo "RUSTC_WRAPPER=$RUNNER_TEMP/nddev-ci/bin/sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_CONF=/dev/null"
            echo "SCCACHE_BUCKET=$bucket"
            echo "SCCACHE_ENDPOINT=http://$address"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_S3_USE_SSL=false"
            echo "SCCACHE_S3_NO_CREDENTIALS=true"
            echo "SCCACHE_S3_KEY_PREFIX=sccache"
            echo "SCCACHE_S3_RW_MODE=$mode"
            echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE:$cargo_home"
            echo "NO_PROXY=127.0.0.1,localhost${NO_PROXY:+,$NO_PROXY}"
            echo "no_proxy=127.0.0.1,localhost${no_proxy:+,$no_proxy}"
          } >> "$GITHUB_ENV"
          echo "Rust builds compile through the network cache at $address, $mode."

      - name: Check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            just check
            just test
          else
            just verify
          fi

      - name: Artifact
        # The full check keeps what the project deploys, so a deployment takes the exact build of a
        # checked commit instead of building again.
        if: github.event_name != 'pull_request' && inputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact }}
          if-no-files-found: error
          retention-days: 90

      - name: Cache use
        if: always()
        run: |
          if [ -n "${RUSTC_WRAPPER:-}" ] && [ -x "$RUSTC_WRAPPER" ]; then
            "$RUSTC_WRAPPER" --show-stats 2>/dev/null | grep -E '^(Compile requests|Cache hits|Cache misses|Cache hits rate|Cache read errors|Cache write errors)' || true
          fi

  merge-stops:
    # The merge stops of security.md: a secret in the change, and a dangerous workflow (a broken
    # file, an action not pinned by commit, a high-severity zizmor finding).
    name: merge stops
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || startsWith(github.event.label.name, 'runner:'))
    runs-on: ${{ !github.event.repository.private && 'ubuntu-24.04' || (contains(github.event.pull_request.labels.*.name, 'runner:blacksmith') || github.event.inputs.runner == 'blacksmith') && 'blacksmith-2vcpu-ubuntu-2404' || (contains(github.event.pull_request.labels.*.name, 'runner:github') || github.event.inputs.runner == 'github') && 'ubuntu-24.04' || inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.32.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tools
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/nddev-ci/bin"
          archive="$RUNNER_TEMP/nddev-ci/archive.tar.gz"
          mkdir -p "$bin"
          fetch() {
            curl -fsSL --retry 3 -o "$archive" "$1"
            echo "$2  $archive" | sha256sum --check --quiet
            tar -xzf "$archive" -C "$bin" "$3"
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" gitleaks
          fetch "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" actionlint
          rm -f "$archive"
          python3 -m venv "$RUNNER_TEMP/nddev-ci/zizmor"
          "$RUNNER_TEMP/nddev-ci/zizmor/bin/pip" install --quiet --disable-pip-version-check "zizmor==$ZIZMOR_VERSION"
          ln -s "$RUNNER_TEMP/nddev-ci/zizmor/bin/zizmor" "$bin/zizmor"
          echo "$bin" >> "$GITHUB_PATH"

      - name: No secret in the change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .

      - name: No dangerous workflow
        run: |
          set -euo pipefail
          if [ ! -d .github/workflows ]; then
            echo "No workflows in this repository."
            exit 0
          fi
          actionlint
          zizmor --no-progress --min-severity high .github
