# The check of an NDDev project. A pull request gets the short check, `just check` and `just test`;
# a push to `dev` or a run by hand gets the full check, `just verify`. Public
# repositories run on GitHub's runners and private ones on ours, unless the pull request carries
# the explicit label `runner:github`. A manual full check may select GitHub.
name: check

on:
  workflow_call:
    inputs:
      retain-runs:
        description: Give each run its own concurrency group and let it finish.
        type: boolean
        default: false
      registry-commit:
        description: Exact commit of the protected registry input selected by the caller.
        type: string
        default: ''
      artifact-registry:
        description: Optional tool-download registry; empty uses the runner setting or official upstream sources.
        type: string
        default: ''
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      hosted-runner:
        description: >-
          The GitHub-hosted Linux runner of a public repository: ubuntu-24.04, ubuntu-24.04-arm,
          ubuntu-26.04 or ubuntu-26.04-arm.
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: How long the check may run.
        type: number
        default: 30
      images:
        description: Prepare the shared image builder for the full check's image recipes.
        type: boolean
        default: false
      artifact:
        description: A file or folder the full check leaves for deployment, such as a release binary.
        type: string
        default: ""
      artifact-name:
        description: The name the artifact is kept under.
        type: string
        default: build
      artifact-days:
        description: How many days the artifact is kept; a deployment that takes an older build sets more.
        type: number
        default: 14
      fetch-depth:
        description: How many commits the checkout fetches; 0 fetches the whole history.
        type: number
        default: 1
      filter:
        description: A partial clone filter for the checkout, such as blob:none.
        type: string
        default: ""
      sparse-checkout:
        description: Patterns the checkout keeps, one per line; empty keeps the whole tree.
        type: string
        default: ""
      sparse-checkout-cone-mode:
        description: Reads sparse-checkout as cone directories; false reads gitignore-style patterns.
        type: boolean
        default: true
      sparse-merge-stops:
        description: Keep only .github and the policy files used by the independent merge stops.
        type: boolean
        default: false
      submodules:
        description: "'true' checks out the submodules at their recorded commits, 'recursive' theirs too; they must be readable with the job's token, as public repositories are."
        type: string
        default: "false"
      diagnostics:
        description: >-
          Workspace-relative report files or folders, one per line, kept for 14 days when the check
          fails, such as test reports. Only what is named here is kept.
        type: string
        default: ""
      reports:
        description: >-
          Workspace-relative reports, one per line, that the job keeps whether it passes or fails,
          such as JUnit, image scans and SBOMs, for 14 days, apart from deployment artifacts. A
          missing one fails the job. The paths follow the diagnostics rule: no absolute path, parent
          or hidden name, so a project that writes reports into a hidden folder copies them to a
          visible one.
        type: string
        default: ""
      repository-token:
        description: >-
          Give the project command the job's own token as GITHUB_TOKEN. It reads only this
          repository's contents, such as links into the project's own private repository in a
          link check. GitHub masks it in logs; the project keeps it out of its reports.
        type: boolean
        default: false
      setup:
        description: >-
          Runs `just setup` before the checks, so `just check` finds the project's dependencies and
          data without network access.
        type: boolean
        default: false
      node-version:
        description: Optional exact Node version.
        type: string
        default: ''
      python-version:
        description: Optional exact Python version.
        type: string
        default: ''
      bun-version:
        description: Optional exact Bun version.
        type: string
        default: ''
      rust-version:
        description: Optional exact Rust version.
        type: string
        default: ''
      rust-components:
        description: Optional comma-separated components for the selected Rust toolchain.
        type: string
        default: ''
      rust-targets:
        description: Optional comma-separated targets for the selected Rust toolchain.
        type: string
        default: ''
      tool-assets:
        description: Caller-owned exact public asset/member manifest for hosted runners; private runners use their managed SDK.
        type: string
        default: ''
      uv-version:
        description: Optional exact uv version.
        type: string
        default: ""
      java-version:
        description: Optional exact Temurin JDK version.
        type: string
        default: ""
      go-version:
        description: Optional exact Go version.
        type: string
        default: ""
      dart-version:
        description: Optional exact standalone Dart SDK version.
        type: string
        default: ''
      flutter-version:
        description: Optional exact stable Flutter version for hosted runners, with its Dart SDK.
        type: string
        default: ""
      tools:
        description: Optional comma-separated name@exact-version command-line tools for hosted runners, such as cargo-nextest@0.9.151.
        type: string
        default: ""
      read-app-client-id:
        description: The GitHub App client ID used for scoped private module reads.
        type: string
        default: ""
      read-app-installation-id:
        description: The App installation in the caller's organization.
        type: string
        default: ""
      read-repositories:
        description: Explicit owner/repository names, one per line, granted contents-read access.
        type: string
        default: ""
    secrets:
      REGISTRY_SNAPSHOT_FIRST:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_SECOND:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_THIRD:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_FOURTH:
        description: Protected environment snapshot fragment.
        required: false
      read-app-private-key:
        description: The App PEM key, used only while minting a scoped installation token.
        required: false
      read-keys:
        description: >-
          Read-only deploy keys of other private repositories the check reads, such as a
          superproject's modules: for each repository a line owner/repository, then its OpenSSH
          private key.
        required: false

permissions: {}

jobs:
  # The full check's jobs, read from the project's justfile: a part for each recipe `verify` depends
  # on, or `verify` whole. A light job: it evaluates nothing and needs no SDK.
  plan:
    name: plan the full check
    if: github.event_name != 'pull_request'
    runs-on: ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github') && 'ubuntu-24.04' || (inputs.runner == 'nddev-macos' && 'nddev-linux-arm64' || inputs.runner == 'nddev-linux-standart' && 'nddev-linux-small' || inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      split: ${{ steps.plan.outputs.split }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
      - name: Outside telemetry off
        uses: $/actions/telemetry
      - name: Native task runner
        uses: $/actions/frontend
        with:
          managed: ${{ github.event.repository.private && !(github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github') }}
      - name: Plan
        id: plan
        uses: $/actions/plan
        with:
          # Named reports are required of the job that runs verify, so verify stays one job.
          whole: ${{ inputs.reports != '' && 'the caller names reports the whole verify leaves' || '' }}
      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: plan the full check
          task-type: test
          status: ${{ job.status }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started

  # The short check of a pull request, or a job of the full check: `verify` whole or one of its parts.
  check:
    name: ${{ matrix.part.label }}
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.plan.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'pull_request' && '[{"label":"short check","group":"short","argv":[]}]' || needs.plan.outputs.matrix) }}
    # Public repositories always run on GitHub's runners; an unknown hosted label fails below.
    runs-on: ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || (contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github')) && 'ubuntu-24.04' || inputs.runner }}
    # A new push to a pull request cancels its older check. On a branch one run of each part runs,
    # and the newest push waits behind it and replaces any push that was already waiting.
    concurrency:
      group: nddev-ci-check-${{ github.workflow }}-${{ inputs.retain-runs && format('run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ inputs.hosted-runner }}-${{ matrix.part.group }}
      cancel-in-progress: ${{ !inputs.retain-runs && github.event_name == 'pull_request' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.registry-commit != '' && format('registry-input-{0}', inputs.registry-commit) || '' }}
    env:
      SDK_MANAGED: ${{ github.event.repository.private && !contains(github.event.pull_request.labels.*.name, 'runner:github') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github') }}
    permissions:
      contents: read
    steps:
      - name: Hosted runner label
        if: ${{ !github.event.repository.private }}
        env:
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
        run: |
          case "$HOSTED_RUNNER" in
            ubuntu-24.04 | ubuntu-24.04-arm | ubuntu-26.04 | ubuntu-26.04-arm) ;;
            *) echo "::error::hosted-runner must be a GitHub-hosted Linux label of this workflow"; exit 1 ;;
          esac

      # A text edit or a label leaves the merge that a pull request's short check passed unchanged,
      # so such an event reuses that pass and runs nothing again. A new commit or a moved base makes
      # a new merge commit, and `runner:github` moves the check, so both run in full.
      - name: A passed short check of the same merge
        id: reuse
        if: github.event_name == 'pull_request' && (github.event.action == 'edited' || (github.event.action == 'labeled' && github.event.label.name != 'runner:github'))
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nddev-ci-short-pass
          key: nddev-ci-short-pass-${{ github.sha }}
          lookup-only: true

      - name: The pass is reused
        if: steps.reuse.outputs.cache-hit == 'true'
        run: echo "The short check of this exact merge passed in an earlier run of this pull request; this event runs nothing again."

      - name: Prepare the job
        id: setup
        if: steps.reuse.outputs.cache-hit != 'true'
        uses: $/actions/prepare
        with:
          managed: ${{ env.SDK_MANAGED }}
          artifact-registry: ${{ inputs.artifact-registry }}
          images: ${{ inputs.images && github.event_name != 'pull_request' }}
          diagnostics: ${{ inputs.diagnostics }}
          reports: ${{ inputs.reports }}
          fetch-depth: ${{ inputs.fetch-depth }}
          filter: ${{ inputs.filter }}
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
          submodules: ${{ inputs.submodules }}
          repository-token: ${{ inputs.repository-token }}
          read-keys: ${{ secrets.read-keys }}
          read-app-client-id: ${{ inputs.read-app-client-id }}
          read-app-installation-id: ${{ inputs.read-app-installation-id }}
          read-repositories: ${{ inputs.read-repositories }}
          read-app-private-key: ${{ secrets.read-app-private-key }}
          node-version: ${{ inputs.node-version }}
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          bun-version: ${{ inputs.bun-version }}
          rust-version: ${{ inputs.rust-version }}
          rust-components: ${{ inputs.rust-components }}
          rust-targets: ${{ inputs.rust-targets }}
          java-version: ${{ inputs.java-version }}
          go-version: ${{ inputs.go-version }}
          dart-version: ${{ inputs.dart-version }}
          flutter-version: ${{ inputs.flutter-version }}
          tools: ${{ inputs.tools }}
          tool-assets: ${{ inputs.tool-assets }}

      - name: Receive the protected registry input
        if: inputs.registry-commit != '' && steps.reuse.outputs.cache-hit != 'true'
        uses: $/actions/registry-input
        with:
          commit: ${{ inputs.registry-commit }}
          sha256: ${{ vars.REGISTRY_SNAPSHOT_SHA256 }}
          first: ${{ secrets.REGISTRY_SNAPSHOT_FIRST }}
          second: ${{ secrets.REGISTRY_SNAPSHOT_SECOND }}
          third: ${{ secrets.REGISTRY_SNAPSHOT_THIRD }}
          fourth: ${{ secrets.REGISTRY_SNAPSHOT_FOURTH }}

      - name: Check
        id: project
        if: steps.reuse.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SETUP: ${{ inputs.setup }}
          PART: ${{ toJSON(matrix.part.argv) }}
        run: |
          set -euo pipefail
          if [ "$SETUP" = true ]; then
            just setup
          fi
          # recipe-dispatch:begin
          if [ "$EVENT" = pull_request ]; then
            just check
            recipes=$(just --dump --dump-format json)
            if jq -e '(.recipes | has("test")) or (.aliases | has("test"))' <<< "$recipes" >/dev/null; then
              just test
            else
              echo "This repository declares no test recipe."
            fi
          else
            # The full check's job: `verify` whole, or the recipes of one part.
            argv=(verify)
            if [ -n "${PART:-}" ] && [ "$PART" != "[]" ]; then
              mapfile -t argv < <(jq -r '.[]' <<< "$PART")
            fi
            just "${argv[@]}"
          fi
          # recipe-dispatch:end

      # The mark that this merge's short check passed, read by a later text or label event.
      - name: Mark the pass of this merge
        if: github.event_name == 'pull_request' && steps.project.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/nddev-ci-short-pass"
          date -u +%FT%TZ > "$RUNNER_TEMP/nddev-ci-short-pass/passed"

      - name: Keep the pass of this merge
        if: github.event_name == 'pull_request' && steps.project.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nddev-ci-short-pass
          key: nddev-ci-short-pass-${{ github.sha }}

      # In parts, the part whose recipes left the deployment artifact keeps it; another part that
      # left the same name would fail its upload.
      - name: Deployment artifact of a part
        id: left
        if: needs.plan.outputs.split == 'true' && inputs.artifact != '' && steps.project.outcome == 'success'
        env:
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          if [ -e "$ARTIFACT" ]; then echo "left=true" >> "$GITHUB_OUTPUT"; fi

      - name: Complete the job
        if: always() && steps.reuse.outputs.cache-hit != 'true'
        uses: $/actions/complete
        with:
          status: ${{ job.status }}
          check-run-id: ${{ job.check_run_id }}
          project-outcome: ${{ steps.project.outcome }}
          task: ${{ matrix.part.task || matrix.part.label }}
          task-type: test
          name: ${{ github.job }}-${{ matrix.part.group }}
          artifact: ${{ (needs.plan.outputs.split != 'true' || steps.left.outputs.left == 'true') && inputs.artifact || '' }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-days: ${{ inputs.artifact-days }}
          reports: ${{ inputs.reports }}
          diagnostics: ${{ inputs.diagnostics }}
          read-token: ${{ steps.setup.outputs.read-token }}

      # A few bytes that tell the joined result which part left the deployment artifact.
      - name: Receipt of the deployment artifact
        if: success() && steps.left.outputs.left == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/nddev-ci-left"
          printf '%s\n' "$PART" > "$RUNNER_TEMP/nddev-ci-left/part.json"
        env:
          PART: ${{ matrix.part.label }}
      - name: Keep the receipt
        if: success() && steps.left.outputs.left == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nddev-ci-left-${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/nddev-ci-left/part.json
          if-no-files-found: error
          retention-days: 1

  # The one result of a full check run in parts, under the name of the whole one.
  full-check:
    name: ${{ needs.plan.outputs.split == 'true' && 'full check' || 'joined parts' }}
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.split == 'true' && needs.check.result != 'cancelled' }}
    runs-on: ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github') && 'ubuntu-24.04' || (inputs.runner == 'nddev-macos' && 'nddev-linux-arm64' || inputs.runner == 'nddev-linux-standart' && 'nddev-linux-small' || inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"
      - name: Every part passed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::A part of the full check ended with $RESULT; its job names the cause. A part that reads what another part leaves names that part as its dependency in the justfile."
            exit 1
          fi
      - name: One part left the deployment artifact
        if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nddev-ci-left-${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/nddev-ci-left
      - name: The part that left it
        if: inputs.artifact != ''
        run: echo "The deployment artifact came from $(cat "$RUNNER_TEMP/nddev-ci-left/part.json")."
      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: full check
          task-type: test
          status: ${{ job.status }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started

  merge-stops:
    # The merge stops, the same workflow a project with its own command jobs calls.
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/merge-stops.yml
    with:
      retain-runs: ${{ inputs.retain-runs }}
      runner: ${{ inputs.runner }}
      artifact-registry: ${{ inputs.artifact-registry }}
      hosted-runner: ${{ inputs.hosted-runner }}
      sparse-checkout: ${{ inputs.sparse-merge-stops }}
    permissions:
      contents: read
