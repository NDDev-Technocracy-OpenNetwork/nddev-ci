# The check of an NDDev project. A pull request gets the short check, `just check` and `just test`;
# a push to `dev` or a run by hand gets the full check, `just verify`. Public
# repositories run on GitHub's runners and private ones on ours, unless the pull request carries
# the explicit label `runner:github`. A manual full check may select GitHub.
name: check

on:
  workflow_call:
    inputs:
      artifact-registry:
        description: Optional tool-download registry; empty uses the runner setting or official upstream sources.
        type: string
        default: ''
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      hosted-runner:
        description: >-
          The GitHub-hosted Linux runner of a public repository: ubuntu-24.04, ubuntu-24.04-arm,
          ubuntu-26.04 or ubuntu-26.04-arm.
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: How long the check may run.
        type: number
        default: 30
      artifact:
        description: A file or folder the full check leaves for deployment, such as a release binary.
        type: string
        default: ""
      artifact-name:
        description: The name the artifact is kept under.
        type: string
        default: build
      artifact-days:
        description: How many days the artifact is kept; a deployment that takes an older build sets more.
        type: number
        default: 14
      fetch-depth:
        description: How many commits the checkout fetches; 0 fetches the whole history.
        type: number
        default: 1
      filter:
        description: A partial clone filter for the checkout, such as blob:none.
        type: string
        default: ""
      sparse-checkout:
        description: Patterns the checkout keeps, one per line; empty keeps the whole tree.
        type: string
        default: ""
      sparse-checkout-cone-mode:
        description: Reads sparse-checkout as cone directories; false reads gitignore-style patterns.
        type: boolean
        default: true
      submodules:
        description: "'true' checks out the submodules at their recorded commits, 'recursive' theirs too; they must be readable with the job's token, as public repositories are."
        type: string
        default: "false"
      diagnostics:
        description: >-
          Workspace-relative report files or folders, one per line, kept for 14 days when the check
          fails, such as test reports. Only what is named here is kept.
        type: string
        default: ""
      reports:
        description: >-
          Workspace-relative reports, one per line, that the job keeps whether it passes or fails,
          such as JUnit, image scans and SBOMs, for 14 days, apart from deployment artifacts. A
          missing one fails the job. The paths follow the diagnostics rule: no absolute path, parent
          or hidden name, so a project that writes reports into a hidden folder copies them to a
          visible one.
        type: string
        default: ""
      repository-token:
        description: >-
          Give the project command the job's own token as GITHUB_TOKEN. It reads only this
          repository's contents, such as links into the project's own private repository in a
          link check. GitHub masks it in logs; the project keeps it out of its reports.
        type: boolean
        default: false
      setup:
        description: >-
          Runs `just setup` before the checks, so `just check` finds the project's dependencies and
          data without network access.
        type: boolean
        default: false
      node-version:
        description: Optional exact Node version.
        type: string
        default: ''
      python-version:
        description: Optional exact Python version.
        type: string
        default: ''
      bun-version:
        description: Optional exact Bun version.
        type: string
        default: ''
      rust-version:
        description: Optional exact Rust version.
        type: string
        default: ''
      rust-components:
        description: Optional comma-separated components for the selected Rust toolchain.
        type: string
        default: ''
      rust-targets:
        description: Optional comma-separated targets for the selected Rust toolchain.
        type: string
        default: ''
      tool-assets:
        description: Caller-owned exact public asset/member manifest for hosted runners; private runners use their managed SDK.
        type: string
        default: ''
      uv-version:
        description: Optional exact uv version.
        type: string
        default: ""
      java-version:
        description: Optional exact Temurin JDK version.
        type: string
        default: ""
      go-version:
        description: Optional exact Go version.
        type: string
        default: ""
      flutter-version:
        description: Optional exact stable Flutter version for hosted runners, with its Dart SDK.
        type: string
        default: ""
      tools:
        description: Optional comma-separated name@exact-version command-line tools for hosted runners, such as cargo-nextest@0.9.151.
        type: string
        default: ""
      read-app-client-id:
        description: The GitHub App client ID used for scoped private module reads.
        type: string
        default: ""
      read-app-installation-id:
        description: The App installation in the caller's organization.
        type: string
        default: ""
      read-repositories:
        description: Explicit owner/repository names, one per line, granted contents-read access.
        type: string
        default: ""
    secrets:
      read-app-private-key:
        description: The App PEM key, used only while minting a scoped installation token.
        required: false
      read-keys:
        description: >-
          Read-only deploy keys of other private repositories the check reads, such as a
          superproject's modules: for each repository a line owner/repository, then its OpenSSH
          private key.
        required: false

permissions: {}

jobs:
  check:
    name: ${{ github.event_name == 'pull_request' && 'short check' || 'full check' }}
    # A new label reruns the check only when it chooses the runner.
    if: github.event.action != 'labeled' || github.event.label.name == 'runner:github'
    # Public repositories always run on GitHub's runners; an unknown hosted label fails below.
    runs-on: ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || (contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github')) && 'ubuntu-24.04' || inputs.runner }}
    # A new push to a pull request cancels its older check; dev and main check every commit.
    concurrency:
      group: nddev-ci-check-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}-${{ inputs.hosted-runner }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      SDK_MANAGED: ${{ github.event.repository.private && !contains(github.event.pull_request.labels.*.name, 'runner:github') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github') }}
    permissions:
      contents: read
    steps:
      - name: Hosted runner label
        if: ${{ !github.event.repository.private }}
        env:
          HOSTED_RUNNER: ${{ inputs.hosted-runner }}
        run: |
          case "$HOSTED_RUNNER" in
            ubuntu-24.04 | ubuntu-24.04-arm | ubuntu-26.04 | ubuntu-26.04-arm) ;;
            *) echo "::error::hosted-runner must be a GitHub-hosted Linux label of this workflow"; exit 1 ;;
          esac

      - name: Prepare the job
        id: setup
        uses: $/actions/prepare
        with:
          managed: ${{ env.SDK_MANAGED }}
          artifact-registry: ${{ inputs.artifact-registry }}
          diagnostics: ${{ inputs.diagnostics }}
          reports: ${{ inputs.reports }}
          fetch-depth: ${{ inputs.fetch-depth }}
          filter: ${{ inputs.filter }}
          sparse-checkout: ${{ inputs.sparse-checkout }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
          submodules: ${{ inputs.submodules }}
          repository-token: ${{ inputs.repository-token }}
          read-keys: ${{ secrets.read-keys }}
          read-app-client-id: ${{ inputs.read-app-client-id }}
          read-app-installation-id: ${{ inputs.read-app-installation-id }}
          read-repositories: ${{ inputs.read-repositories }}
          read-app-private-key: ${{ secrets.read-app-private-key }}
          node-version: ${{ inputs.node-version }}
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          bun-version: ${{ inputs.bun-version }}
          rust-version: ${{ inputs.rust-version }}
          rust-components: ${{ inputs.rust-components }}
          rust-targets: ${{ inputs.rust-targets }}
          java-version: ${{ inputs.java-version }}
          go-version: ${{ inputs.go-version }}
          flutter-version: ${{ inputs.flutter-version }}
          tools: ${{ inputs.tools }}
          tool-assets: ${{ inputs.tool-assets }}

      - name: Check
        id: project
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SETUP: ${{ inputs.setup }}
        run: |
          set -euo pipefail
          if [ "$SETUP" = true ]; then
            just setup
          fi
          # recipe-dispatch:begin
          if [ "$EVENT" = pull_request ]; then
            just check
            recipes=$(just --dump --dump-format json)
            if jq -e '(.recipes | has("test")) or (.aliases | has("test"))' <<< "$recipes" >/dev/null; then
              just test
            else
              echo "This repository declares no test recipe."
            fi
          else
            just verify
          fi
          # recipe-dispatch:end

      - name: Complete the job
        if: always()
        uses: $/actions/complete
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: ${{ github.event_name == 'pull_request' && 'short check' || 'full check' }}
          task-type: test
          name: ${{ github.job }}
          artifact: ${{ inputs.artifact }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-days: ${{ inputs.artifact-days }}
          reports: ${{ inputs.reports }}
          diagnostics: ${{ inputs.diagnostics }}
          read-token: ${{ steps.setup.outputs.read-token }}

  merge-stops:
    # The merge stops, the same workflow a project with its own command jobs calls.
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'runner:github')
    uses: $/.github/workflows/merge-stops.yml
    with:
      runner: ${{ inputs.runner }}
      artifact-registry: ${{ inputs.artifact-registry }}
      hosted-runner: ${{ inputs.hosted-runner }}
    permissions:
      contents: read
