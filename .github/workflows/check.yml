          failure-layer: ${{ job.status == 'failure' && (steps.parts.outcome == 'failure' && 'project' || 'library') || '' }}
          failure-reason: ${{ job.status == 'failure' && (steps.parts.outcome == 'failure' && 'full-check-part-failed' || steps.artifact-oci.outputs.failure-reason || 'artifact-verify-failed') || '' }}
          upstream-reason: ${{ job.status == 'failure' && steps.artifact-oci.outputs.upstream-reason || '' }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started

  merge-stops:
    # The merge stops, the same workflow a project with its own command jobs calls.
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (!inputs.inline-merge-stops || inputs.retain-separate-merge-stops || inputs.sparse-checkout != '' || inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-windows' || inputs['runner-profile'] == 'macos-arm64' || inputs['runner-profile'] == 'windows-x64')
    uses: $/.github/workflows/merge-stops.yml
