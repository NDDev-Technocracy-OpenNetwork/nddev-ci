# The check of an NDDev project. A pull request gets the short check, `just check` and `just test`;
# a push to `dev` or a run by hand gets the full check, `just verify`. Public
# repositories run on GitHub's runners. Private jobs use their declared runners unless a PR label
# or a manual dispatch selects a hosted route.
name: check

on:
  workflow_call:
    inputs:
      retain-runs:
        description: Give each run its own concurrency group and let it finish.
        type: boolean
        default: false
      whole-full-check:
        description: Run the full verify recipe in one job without scheduling a planner.
        type: boolean
        default: false
      split-full-check:
        description: Run independent verify parts as separate jobs instead of inside one full-check job.
        type: boolean
        default: false
      parallel-parts:
        description: Run independent post-check parts of verify concurrently inside the single full-check job.
        type: boolean
        default: false
      inline-merge-stops:
        description: Run pull request merge stops inside the short check job on full Linux checkouts (falls back to separate merge-stops for sparse checkouts or non-Linux runners).
        type: boolean
        default: true
      retain-separate-merge-stops:
        description: Keep the separate merge stops context while a caller migrates its required checks to inline stops.
        type: boolean
        default: false
      merge-group-full-check:
        description: Run just verify on merge_group events while keeping the required short-check context.
        type: boolean
        default: false
      part-paths:
        description: Optional JSON map from verify part group IDs to repository-relative path prefixes; unmapped or global changes run every part.
        type: string
        default: '{}'
      # jscpd:ignore-start -- shared protected registry and hosted tool override workflow_call inputs
      registry-commit:
        description: Exact commit of the protected registry input selected by the caller.
        type: string
        default: ''
      toolchains:
        description: Optional comma-separated registry toolchain names resolved from the protected registry snapshot.
        type: string
        default: ''
      just-version:
        description: Optional exact Just version for GitHub-hosted runners.
        type: string
        default: ''
      tool-pins:
        description: Optional JSON map of explicit version and per-arch sha256 merge-stop tool pins for GitHub-hosted runners.
        type: string
        default: ''
      buildx-version:
        description: Optional exact Buildx version for GitHub-hosted runners.
        type: string
        default: ''
      buildkit-image:
        description: Optional digest-pinned BuildKit image for GitHub-hosted runners.
        type: string
        default: ''
      # jscpd:ignore-end
      artifact-registry:
        description: Optional tool-download registry; empty uses the runner setting or official upstream sources.
        type: string
        default: ''
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      runner-profile:
        description: Managed job platform for profile-aware GitHub fallback.
        type: string
        default: ''
      hosted-runner:
        description: >-
          The GitHub-hosted Linux runner of a public repository: ubuntu-24.04, ubuntu-24.04-arm,
          ubuntu-26.04 or ubuntu-26.04-arm.
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: How long the check may run.
        type: number
        default: 30
      images:
        description: Prepare the shared image builder for the full check's image recipes.
        type: boolean
        default: false
      artifact:
        description: A file or folder the full check leaves for deployment, such as a release binary.
        type: string
        default: ""
      artifact-name:
        description: The name the artifact is kept under.
        type: string
        default: build
      artifact-days:
        description: How many days the artifact is kept; a deployment that takes an older build sets more.
        type: number
        default: 3
      fetch-depth:
        description: How many commits the checkout fetches; 0 fetches the whole history.
        type: number
        default: 1
      filter:
        description: A partial clone filter for the checkout, such as blob:none.
        type: string
        default: ""
      sparse-checkout:
        description: Patterns the checkout keeps, one per line; empty keeps the whole tree.
        type: string
        default: ""
      sparse-checkout-cone-mode:
        description: Reads sparse-checkout as cone directories; false reads gitignore-style patterns.
        type: boolean
        default: true
      new-clones:
        description: Reject new code clones using the pull request base's .jscpd.json.
        type: boolean
        default: false
      sparse-merge-stops:
        description: Keep only .github and the policy files used by the independent merge stops.
        type: boolean
        default: false
      submodules:
        description: "'true' checks out the submodules at their recorded commits, 'recursive' theirs too; they must be readable with the job's token, as public repositories are."
        type: string
        default: "false"
      diagnostics:
        description: >-
          Workspace-relative report files or folders, one per line, kept for 14 days when the check
          fails, such as test reports. Only what is named here is kept.
        type: string
        default: ""
      reports:
        description: >-
          Workspace-relative reports, one per line, that the job keeps whether it passes or fails,
          such as JUnit, image scans and SBOMs, for 14 days, apart from deployment artifacts. A
          missing one fails the job. The paths follow the diagnostics rule: no absolute path, parent
          or hidden name, so a project that writes reports into a hidden folder copies them to a
          visible one.
        type: string
        default: ""
      repository-token:
        description: >-
          Give the project command the job's own token as GITHUB_TOKEN. It reads only this
          repository's contents, such as links into the project's own private repository in a
          link check. GitHub masks it in logs; the project keeps it out of its reports.
        type: boolean
        default: false
      setup:
        description: >-
          Runs `just setup` before the checks, so `just check` finds the project's dependencies and
          data without network access.
        type: boolean
        default: false
      node-version:
        description: Optional exact Node version.
        type: string
        default: ''
      python-version:
        description: Optional exact Python version.
        type: string
        default: ''
      bun-version:
        description: Optional exact Bun version.
        type: string
        default: ''
      rust-version:
        description: Optional exact Rust version.
        type: string
        default: ''
      rust-components:
        description: Optional comma-separated components for the selected Rust toolchain.
        type: string
        default: ''
      rust-targets:
        description: Optional comma-separated targets for the selected Rust toolchain.
        type: string
        default: ''
      tool-assets:
        description: Caller-owned exact public asset/member manifest for hosted runners; private runners use their managed SDK.
        type: string
        default: ''
      uv-version:
        description: Optional exact uv version.
        type: string
        default: ""
      java-version:
        description: Optional exact Temurin JDK version.
        type: string
        default: ""
      go-version:
        description: Optional exact Go version.
        type: string
        default: ""
      dart-version:
        description: Optional exact standalone Dart SDK version.
        type: string
        default: ''
      flutter-version:
        description: Optional exact stable Flutter version for hosted runners, with its Dart SDK.
        type: string
        default: ""
      # jscpd:ignore-start -- shared workflow_call SDK inputs
      dotnet-version:
        description: Optional exact .NET SDK version.
        type: string
        default: ''
      ruby-version:
        description: Optional exact Ruby version.
        type: string
        default: ''
      # jscpd:ignore-end
      tools:
        description: Optional comma-separated name@exact-version command-line tools for hosted runners
        type: string
        default: ""
      read-app-client-id:
        description: The GitHub App client ID used for scoped private module reads.
        type: string
        default: ""
      read-app-installation-id:
        description: The App installation in the caller's organization.
        type: string
        default: ""
      read-repositories:
        description: Explicit owner/repository names, one per line, granted contents-read access.
        type: string
        default: ""
      upstream-branch:
        description: Optional branch in this repository that mirrors a fork's upstream; its commit ancestry is skipped by authorship.
        type: string
        default: ''
      part-runners:
        description: Optional JSON map from check part IDs (including short) to private runner labels.
        type: string
        default: '{}'
      reuse-receipts:
        description: Reuse verified step receipts when the exact tree, recipes, lockfiles, toolchain, workflow and epoch match.
        type: boolean
        default: true
      cache-epoch:
        description: Salt mixed into every step-receipt key; bump to invalidate cached receipts cleanly.
        type: string
        default: ''
      canary-percent:
        description: Percentage (0-100) of eligible dev push runs re-executed fresh to compare against cached receipts.
        type: number
        default: 5
    secrets:
      REGISTRY_SNAPSHOT_FIRST:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_SECOND:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_THIRD:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_FOURTH:
        description: Protected environment snapshot fragment.
        required: false
      read-app-private-key:
        description: The App PEM key, used only while minting a scoped installation token.
        required: false
      read-keys:
        description: >-
          Read-only deploy keys of other private repositories the check reads, such as a
          superproject's modules: for each repository a line owner/repository, then its OpenSSH
          private key.
        required: false

# Callers declare permissions on their calling job: `contents: read`, plus `packages: write`
# when a private repository retains a deployment artifact via GHCR. Helper jobs narrow below.
# A new push to a pull request cancels its older check of the same profile. On a branch one full
# check runs at a time, and the newest push waits behind it and replaces any push already waiting.
concurrency:
  group: nddev-ci-check-${{ github.workflow }}-${{ inputs.retain-runs && format('run-{0}', github.run_id) || (github.event.repository.private && github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] != '' && github.actor_id == vars.NDDEV_BRANCH_FALLBACK_ACTOR_ID && github.actor == github.triggering_actor && format('hosted-{0}', github.sha) || github.ref) }}-${{ inputs.runner }}-${{ inputs.hosted-runner }}-${{ inputs.runner-profile }}
  cancel-in-progress: ${{ !inputs.retain-runs && github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The full check's jobs, read from the project's justfile: a part for each recipe `verify` depends
  # on, or `verify` whole. A light job: it evaluates nothing and needs no SDK.
  plan:
    name: plan the full check
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && !inputs.whole-full-check && (inputs.split-full-check || inputs['part-runners'] != '{}')
    # runner-profile:plan
    runs-on: >-
      ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || github.event.repository.private && (((inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || '') != '' && (contains(github.event.pull_request.labels.*.name, format('runner:github:{0}', (inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || ''))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == (inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || '')))) && fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[(inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || '')] || (contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == '')) && (fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[(inputs.runner == 'nddev-macos' && 'linux-arm64' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64') && 'linux-x64' || inputs.runner-profile || inputs.runner == 'nddev-linux-arm64' && 'linux-arm64' || (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light' || inputs.runner == 'nddev-linux-release') && 'linux-x64' || '')] || 'ubuntu-24.04')
      || (github.event_name == 'pull_request' && github.event.sender.type == 'Bot' && github.event.pull_request.user.type == 'Bot' && github.actor == github.triggering_actor && !startsWith(github.head_ref, 'release/') && fromJSON('{"nddev-linux-bounded":"nddev-linux-bounded-maintenance","nddev-linux-light":"nddev-linux-light-maintenance","nddev-linux-small":"nddev-linux-small-maintenance","nddev-linux-standart":"nddev-linux-standart-maintenance","nddev-macos":"nddev-macos-maintenance","nddev-windows":"nddev-windows-maintenance"}')[((inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64')) && 'nddev-linux-light' || inputs.runner)] || ((inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || (inputs.runner-profile == 'macos-arm64' || inputs.runner-profile == 'windows-x64')) && 'nddev-linux-light' || inputs.runner))) || '' }}
    timeout-minutes: 10
    environment: ${{ inputs.registry-commit != '' && format('registry-input-{0}', inputs.registry-commit) || '' }}
    # Inherit optional actions: read from the caller to verify the source PR's conclusion.
    outputs:
      split: ${{ steps.plan.outputs.split }}
      matrix: ${{ steps.receipts.outputs.matrix || steps.plan.outputs.matrix }}
      all-reused: ${{ steps.receipts.outputs.all-reused }}
      reused: ${{ steps.receipts.outputs.reused }}
      canary: ${{ steps.receipts.outputs.canary }}
      bypass-reason: ${{ steps.receipts.outputs.bypass-reason }}
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: ${{ inputs.filter || (inputs.sparse-checkout == '' && 'blob:none' || '') }}
          sparse-checkout: |-
            ${{ inputs.sparse-checkout != '' && inputs.sparse-checkout || 'justfile' }}
            ${{ inputs.sparse-checkout == '' && '**/justfile' || '' }}
            ${{ inputs.sparse-checkout == '' && 'Justfile' || '' }}
            ${{ inputs.sparse-checkout == '' && '**/Justfile' || '' }}
            ${{ inputs.sparse-checkout == '' && '.justfile' || '' }}
            ${{ inputs.sparse-checkout == '' && '**/.justfile' || '' }}
            ${{ inputs.sparse-checkout == '' && '*.just' || '' }}
            ${{ inputs.sparse-checkout == '' && '**/*.just' || '' }}
          sparse-checkout-cone-mode: ${{ inputs.sparse-checkout != '' && inputs.sparse-checkout-cone-mode || false }}
      - name: Outside telemetry off
        uses: $/actions/telemetry
      # jscpd:ignore-start -- shared actions/registry-input contract
      - name: Receive the protected registry input
        id: registry-input
        if: inputs.registry-commit != ''
        uses: $/actions/registry-input
        with:
          commit: ${{ inputs.registry-commit }}
          first: ${{ secrets.REGISTRY_SNAPSHOT_FIRST }}
          second: ${{ secrets.REGISTRY_SNAPSHOT_SECOND }}
          third: ${{ secrets.REGISTRY_SNAPSHOT_THIRD }}
          fourth: ${{ secrets.REGISTRY_SNAPSHOT_FOURTH }}
          sha256: ${{ vars.REGISTRY_SNAPSHOT_SHA256 }}
      # jscpd:ignore-end
      - name: Native task runner
        uses: $/actions/frontend
        with:
          managed: ${{ runner.environment == 'self-hosted' }}
          just-version: ${{ inputs.just-version }}
      - name: Full tree fallback if the justfile imports other files
        if: inputs.sparse-checkout == ''
        run: |
          if ! just --dump --dump-format json >/dev/null 2>&1; then
            git sparse-checkout disable
          fi
      - name: Plan
        id: plan
        uses: $/actions/plan
        with:
          # Named reports are required of the job that runs verify, so verify stays one job.
          whole: ${{ inputs.reports != '' && 'the caller names reports the whole verify leaves' || '' }}
      - name: Check verified step receipts
        id: receipts
        if: (github.event.repository.private && runner.environment == 'self-hosted') || inputs['part-paths'] != '{}'
        uses: $/actions/step-receipt
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        with:
          mode: plan
          matrix: ${{ steps.plan.outputs.matrix }}
          split: ${{ steps.plan.outputs.split }}
          receipt-inputs: ${{ toJSON(inputs) }}
          github-token: ${{ github.token }}
      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: plan the full check
          task-type: test
          status: ${{ job.status }}
          failure-layer: ${{ job.status == 'failure' && 'library' || '' }}
          failure-reason: ${{ job.status == 'failure' && (steps.plan.outcome == 'failure' && 'plan-failed' || steps.receipts.outcome == 'failure' && 'step-receipts-failed' || 'setup-failed') || '' }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started

  registry-project:
    name: technology registry
    if: >-
      inputs.registry-commit != '' && github.event.repository.private &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'merge_group' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/dev')) &&
      !(inputs.sparse-checkout == '' &&
        inputs['part-runners'] == '{}' &&
        (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.whole-full-check || !inputs.split-full-check) &&
        !contains(github.event.pull_request.labels.*.name, 'runner:github') &&
        !(inputs.runner-profile != '' && contains(github.event.pull_request.labels.*.name, format('runner:github:{0}', inputs.runner-profile))) &&
        (inputs.runner-profile == 'linux-x64' || (inputs.runner-profile == '' && (inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-bounded'))))
    # runner-profile:registry
    runs-on: >-
      ${{
      (github.event_name == 'pull_request' && github.event.sender.type == 'Bot' && github.event.pull_request.user.type == 'Bot' && github.actor == github.triggering_actor && !startsWith(github.head_ref, 'release/') && fromJSON('{"nddev-linux-bounded":"nddev-linux-bounded-maintenance","nddev-linux-light":"nddev-linux-light-maintenance","nddev-linux-small":"nddev-linux-small-maintenance","nddev-linux-standart":"nddev-linux-standart-maintenance","nddev-macos":"nddev-macos-maintenance","nddev-windows":"nddev-windows-maintenance"}')['nddev-linux-small'] || 'nddev-linux-small')
      }}
    timeout-minutes: 10
    environment: ${{ format('registry-input-{0}', inputs.registry-commit) }}
    permissions:
      contents: read
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # jscpd:ignore-start -- shared actions/registry-input contract
      - name: Receive the protected registry input
        id: registry-input
        uses: $/actions/registry-input
        with:
          commit: ${{ inputs.registry-commit }}
          first: ${{ secrets.REGISTRY_SNAPSHOT_FIRST }}
          second: ${{ secrets.REGISTRY_SNAPSHOT_SECOND }}
          third: ${{ secrets.REGISTRY_SNAPSHOT_THIRD }}
          fourth: ${{ secrets.REGISTRY_SNAPSHOT_FOURTH }}
          sha256: ${{ vars.REGISTRY_SNAPSHOT_SHA256 }}
      # jscpd:ignore-end
      - name: Check direct choices
        id: registry-check
        uses: $/actions/registry-project
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          block: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: technology registry
          task-type: test
          status: ${{ job.status }}
          failure-layer: ${{ job.status == 'failure' && (steps.registry-check.outputs.failure-layer || 'library') || '' }}
          failure-reason: ${{ job.status == 'failure' && (steps.registry-check.outputs.failure-reason || steps.registry-input.outputs.failure-reason || 'registry-scan-failed') || '' }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started

  # The short check of a pull request, or a job of the full check: `verify` whole or one of its parts.
  check:
    name: ${{ matrix.part.label }}
    needs: [plan, registry-project]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.whole-full-check || (!inputs.split-full-check && inputs['part-runners'] == '{}') || (needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]')) }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'merge_group' && inputs['merge-group-full-check'] &&
          '[{"label":"short check","group":"short","argv":["verify"]}]' ||
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"label":"short check","group":"short","argv":[]}]' || (inputs.whole-full-check || (!inputs.split-full-check && inputs['part-runners'] == '{}')) &&
          '[{"label":"full check","group":"verify","argv":["verify"]}]' || needs.plan.outputs.matrix) }}
    # Public repositories always run on GitHub's runners; an unknown hosted label fails below.
    # runner-profile:check
    runs-on: >-
      ${{ !github.event.repository.private && (contains(fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","ubuntu-26.04","ubuntu-26.04-arm"]'), inputs.hosted-runner) && inputs.hosted-runner || 'ubuntu-24.04') || github.event.repository.private && ((inputs.runner-profile != '' && (contains(github.event.pull_request.labels.*.name, format('runner:github:{0}', inputs.runner-profile)) || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == inputs.runner-profile))) && fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[inputs.runner-profile] || (contains(github.event.pull_request.labels.*.name, 'runner:github') || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'github' && github.event.inputs['runner-profile'] == '')) && (fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-26","windows-x64":"windows-2025"}')[inputs.runner-profile] || 'ubuntu-24.04')
      || (github.event_name == 'pull_request' && github.event.sender.type == 'Bot' && github.event.pull_request.user.type == 'Bot' && github.actor == github.triggering_actor && !startsWith(github.head_ref, 'release/') && fromJSON('{"nddev-linux-bounded":"nddev-linux-bounded-maintenance","nddev-linux-light":"nddev-linux-light-maintenance","nddev-linux-small":"nddev-linux-small-maintenance","nddev-linux-standart":"nddev-linux-standart-maintenance","nddev-macos":"nddev-macos-maintenance","nddev-windows":"nddev-windows-maintenance"}')[(fromJSON(inputs['part-runners'])[matrix.part.group] || inputs.runner)] || (fromJSON(inputs['part-runners'])[matrix.part.group] || inputs.runner))) || '' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
