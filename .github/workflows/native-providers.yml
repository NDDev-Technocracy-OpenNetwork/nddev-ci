name: Native provider qualification
on:
  push:
    branches: [research/44-native-providers]
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            manifest: tests/research/native-provider-linux-x64.json
          - os: macos-15
            manifest: tests/research/native-provider-darwin-arm64.json
          - os: windows-2025
            manifest: tests/research/native-provider-win32-x64.json
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@c3a49fe801ddd323f579812d33846a2a5500f539
    with:
      runner: ${{ matrix.os }}
      node-version: '26.13.0'
      tool-assets: ${{ matrix.manifest }}
      recipe: qualify-native-providers
      timeout-minutes: 10
