name: Native provider qualification
on:
  push:
    branches: [research/44-native-providers]
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@9d59594f4582fd6c8c3439d8a3c4e8e25639ad43
    with:
      runner: ${{ matrix.os }}
      node-version: '26.13.0'
      recipe: qualify-native-providers
      timeout-minutes: 10
