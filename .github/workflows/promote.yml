# Moves the target to the newest source commit whose full check passed; the push of the move starts
# the caller's release workflow on the target. Defaults are dev to main; promotion only moves an ancestor forward. GitHub's job
# token cannot move a branch onto commits that change workflow files, so the move pushes with a
# deploy key with write access: the caller keeps it as PROMOTION_KEY in an environment limited to
# its dev branch and calls this workflow with `secrets: inherit`, since GitHub resolves an
# environment's secrets only in the job that names the environment. Without the key the job
# shows the exact qualified commit for a trusted outside promoter or a maintainer.
name: promote

on:
  workflow_call:
    inputs:
      source-branch:
        description: The branch whose exact push checks qualify promotion.
        type: string
        default: dev
      target-branch:
        description: The branch that moves forward to qualified source history.
        type: string
        default: main
      required-workflows:
        description: Additional workflow file names that must qualify the same exact source, one per line.
        type: string
        default: ''
      release-metadata:
        description: Checked JSON metadata file names with schema_version, source_commit and product version, one per line.
        type: string
        default: ''
      artifacts:
        description: Qualifying artifact names holding the product metadata, one per line.
        type: string
        default: ''
      prerelease-file:
        description: Optional repository file checked at the candidate commit for an active pre-release stage.
        type: string
        default: ''
      check-workflow:
        description: The caller's workflow file whose push check on dev qualifies a commit.
        type: string
        default: ci.yml
      environment:
        description: The caller's environment holding PROMOTION_KEY, limited to its dev branch.
        type: string
        default: promotion
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-release
      public-self-hosted-runner:
        description: Optional self-hosted runner label for a public repository.
        type: string
        default: ''
    outputs:
      state:
        description: ready, current, unchecked or unversioned (the source still declares the newest released version).
        value: ${{ jobs.promote.outputs.state }}
      sha:
        description: The commit the target branch moved to.
        value: ${{ jobs.promote.outputs.sha }}

# Callers declare permissions on their calling job: `actions: read` and `contents: read`, plus
# `packages: read` when a private repository inspects checked release metadata via GHCR.
jobs:
  promote:
    name: promote
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    # Public repositories default to GitHub's runners; private ones use the release lane.
    runs-on: ${{ !github.event.repository.private && (inputs['public-self-hosted-runner'] || 'ubuntu-24.04') || ((inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light') && 'nddev-linux-release' || inputs.runner) }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: nddev-ci-promote-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 15
    outputs:
      state: ${{ steps.choose.outputs.state }}
      sha: ${{ steps.choose.outputs.sha }}
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"

      - name: Outside telemetry off
        uses: $/actions/telemetry

      - name: Choose the commit
        id: choose
        uses: $/actions/promote
        env:
          NDDEV_BRANCH_FALLBACK_ACTOR_ID: ${{ vars.NDDEV_BRANCH_FALLBACK_ACTOR_ID }}
        with:
          required-workflows: ${{ inputs.required-workflows }}
          release-metadata: ${{ inputs.release-metadata }}
          artifacts: ${{ inputs.artifacts }}
          check-workflow: ${{ inputs.check-workflow }}
          source-branch: ${{ inputs.source-branch }}
          target-branch: ${{ inputs.target-branch }}
          prerelease-file: ${{ inputs.prerelease-file }}

      - name: Move the target forward
        if: steps.choose.outputs.state == 'ready'
        uses: $/actions/protected-git
        with:
          operation: promote
          key: ${{ secrets.PROMOTION_KEY }}
          sha: ${{ steps.choose.outputs.sha }}
          repository: ${{ github.repository }}
          target: ${{ inputs.target-branch }}
          environment: ${{ inputs.environment }}

      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: promotion
          task-type: deploy
          status: ${{ job.status }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started
