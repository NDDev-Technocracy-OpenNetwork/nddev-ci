name: installer catalog

on:
  pull_request:
    paths: [.github/workflows/installer-catalog.yml]
  push:
    branches: [dev]
    paths: [.github/workflows/installer-catalog.yml]
  workflow_dispatch: {}

permissions: {}

jobs:
  catalog:
    name: catalog (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BIOME_VERSION: 2.6.8
      TYPOS_VERSION: 1.52.2
      CARGO_DENY_VERSION: ${{ matrix.os != 'windows-11-arm' && '0.22.0' || '' }}
    steps:
      - name: Install the declared tools from the candidate catalog
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: biome@${{ env.BIOME_VERSION }},typos@${{ env.TYPOS_VERSION }}${{ env.CARGO_DENY_VERSION && format(',cargo-deny@{0}', env.CARGO_DENY_VERSION) || '' }}
          checksum: true
          fallback: none

      - name: Verify the actual tool versions
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          const declared = {biome: process.env.BIOME_VERSION, typos: process.env.TYPOS_VERSION};
          if (process.env.CARGO_DENY_VERSION) declared['cargo-deny'] = process.env.CARGO_DENY_VERSION;
          const prefixes = {biome: /^(?:Version:\s*)?/, typos: /^typos(?:-cli)?\s+/, 'cargo-deny': /^cargo-deny\s+/};
          for (const [tool, expected] of Object.entries(declared)) {
            const result = spawnSync(tool, ['--version'], {encoding: 'utf8'});
            assert.equal(result.status, 0, `${tool}: ${result.error ?? result.stderr}`);
            const actual = result.stdout.trim();
            assert.equal(actual.replace(prefixes[tool], ''), expected, `${tool}: ${actual}`);
            console.log(JSON.stringify({tool, declared: expected, actual, os: process.platform, arch: process.arch}));
          }
          JS
