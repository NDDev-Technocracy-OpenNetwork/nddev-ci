# The release of a container image: the image that the full check of this exact commit pushed as
# sha-<commit> also gets the release's version tag, without building again. A version tag never
# moves: an existing tag must already name the same digest. Call it after release.yml.
name: image tag

on:
  workflow_call:
    inputs:
      image:
        description: The image name inside the owner's namespace, as in image.yml.
        type: string
        required: true
      tag:
        description: The release tag, such as release.yml's tag output.
        type: string
        required: true
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
      registry-commit:
        description: Exact commit of the protected registry input selected by the caller.
        type: string
        default: ''
      buildx-version:
        description: Optional exact Buildx version for GitHub-hosted runners.
        type: string
        default: ''
    secrets:
      REGISTRY_SNAPSHOT_FIRST:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_SECOND:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_THIRD:
        description: Protected environment snapshot fragment.
        required: false
      REGISTRY_SNAPSHOT_FOURTH:
        description: Protected environment snapshot fragment.
        required: false
    outputs:
      reference:
        description: The released image by digest.
        value: ${{ jobs.tag.outputs.reference }}

permissions: {}

jobs:
  tag:
    name: tag ${{ inputs.image }}
    if: github.ref == 'refs/heads/main'
    # A light, architecture-independent job: on managed runners it takes whichever Linux runner has room.
    runs-on: ${{ !github.event.repository.private && 'ubuntu-24.04' || ((inputs.runner == 'nddev-macos' || inputs.runner == 'nddev-linux-standart' || inputs.runner == 'nddev-linux-small' || inputs.runner == 'nddev-linux-light') && 'nddev-linux-release' || inputs.runner) }}
    timeout-minutes: 15
    environment: ${{ inputs.registry-commit != '' && format('registry-input-{0}', inputs.registry-commit) || '' }}
    permissions:
      packages: write # add the version tag to the existing image
    outputs:
      reference: ${{ steps.tag.outputs.reference }}
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"

      - name: Outside telemetry off
        uses: $/actions/telemetry

      - name: Receive the protected registry input
        id: registry-input
        if: inputs.registry-commit != ''
        uses: $/actions/registry-input
        with:
          commit: ${{ inputs.registry-commit }}
          sha256: ${{ vars.REGISTRY_SNAPSHOT_SHA256 }}
          first: ${{ secrets.REGISTRY_SNAPSHOT_FIRST }}
          second: ${{ secrets.REGISTRY_SNAPSHOT_SECOND }}
          third: ${{ secrets.REGISTRY_SNAPSHOT_THIRD }}
          fourth: ${{ secrets.REGISTRY_SNAPSHOT_FOURTH }}

      - name: BuildKit client
        uses: $/actions/buildx-client
        with:
          buildx-version: ${{ inputs.buildx-version }}

      - name: Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag the checked image
        id: tag
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo "::error::image must be a plain lowercase image name"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z][A-Za-z0-9._-]{0,127}$ ]] || { echo "::error::tag must be a plain release tag"; exit 1; }
          name="ghcr.io/${OWNER,,}/$IMAGE"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'; }
          checked=$(digest "$name:sha-$SHA") || { echo "::error::the full check pushed no $name:sha-$SHA"; exit 1; }
          if released=$(digest "$name:$TAG" 2>/dev/null); then
            [ "$released" = "$checked" ] || { echo "::error::$name:$TAG already names another image; a version tag never moves"; exit 1; }
            echo "$name:$TAG already names the checked image."
          else
            docker buildx imagetools create --tag "$name:$TAG" "$name@$checked"
            [ "$(digest "$name:$TAG")" = "$checked" ] || { echo "::error::the version tag does not name the checked digest"; exit 1; }
          fi
          echo "reference=$name@$checked" >> "$GITHUB_OUTPUT"
          echo "### $name:$TAG = $checked" >> "$GITHUB_STEP_SUMMARY"

      - name: Job record
        if: always()
        uses: $/actions/job-record
        with:
          task: tag ${{ inputs.image }}
          task-type: deploy
          status: ${{ job.status }}
          failure-layer: ${{ job.status == 'failure' && 'library' || '' }}
          failure-reason: ${{ job.status == 'failure' && (steps.registry-input.outputs.failure-reason || (steps.tag.outcome == 'failure' && 'image-tag-failed') || 'workflow-step-failed') || '' }}
          check-run-id: ${{ job.check_run_id }}
          started-file: ${{ runner.temp }}/nddev-ci-started
