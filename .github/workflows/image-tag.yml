# The release of a container image: the image that the full check of this exact commit pushed as
# sha-<commit> also gets the release's version tag, without building again. A version tag never
# moves: an existing tag must already name the same digest. Call it after release.yml.
name: image tag

on:
  workflow_call:
    inputs:
      image:
        description: The image name inside the owner's namespace, as in image.yml.
        type: string
        required: true
      tag:
        description: The release tag, such as release.yml's tag output.
        type: string
        required: true
      runner:
        description: The label of our runners, used by private repositories.
        type: string
        default: nddev-linux-standart
    outputs:
      reference:
        description: The released image by digest.
        value: ${{ jobs.tag.outputs.reference }}

permissions: {}

jobs:
  tag:
    name: tag ${{ inputs.image }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ !github.event.repository.private && 'ubuntu-24.04' || (inputs.runner == 'nddev-macos' && 'nddev-linux-arm64' || inputs.runner) }}
    timeout-minutes: 15
    permissions:
      packages: write # add the version tag to the existing image
    outputs:
      reference: ${{ steps.tag.outputs.reference }}
    steps:
      - name: Start
        run: date +%s > "$RUNNER_TEMP/nddev-ci-started"

      - name: Outside telemetry off
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@9795917fc97bf71b2761e609a87adbb189119894

      - name: BuildKit client
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          cache-binary: false

      - name: Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag the checked image
        id: tag
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo "::error::image must be a plain lowercase image name"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z][A-Za-z0-9._-]{0,127}$ ]] || { echo "::error::tag must be a plain release tag"; exit 1; }
          name="ghcr.io/${OWNER,,}/$IMAGE"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'; }
          checked=$(digest "$name:sha-$SHA") || { echo "::error::the full check pushed no $name:sha-$SHA"; exit 1; }
          if released=$(digest "$name:$TAG" 2>/dev/null); then
            [ "$released" = "$checked" ] || { echo "::error::$name:$TAG already names another image; a version tag never moves"; exit 1; }
            echo "$name:$TAG already names the checked image."
          else
            docker buildx imagetools create --tag "$name:$TAG" "$name@$checked"
            [ "$(digest "$name:$TAG")" = "$checked" ] || { echo "::error::the version tag does not name the checked digest"; exit 1; }
          fi
          echo "reference=$name@$checked" >> "$GITHUB_OUTPUT"
          echo "### $name:$TAG = $checked" >> "$GITHUB_STEP_SUMMARY"

      - name: Job record
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/job-record@9795917fc97bf71b2761e609a87adbb189119894
        with:
          task: tag ${{ inputs.image }}
          task-type: deploy
          status: ${{ job.status }}
          started-file: ${{ runner.temp }}/nddev-ci-started
