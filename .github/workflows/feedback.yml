name: native-failure-feedback
# Trusted pinned metadata-only publisher; no candidate checkout, artifact reads or code execution.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [source-ci, main-ci, integrated-delivery-smoke]
    types: [completed]
  workflow_dispatch:
permissions: {}
concurrency:
  group: native-failure-feedback
  cancel-in-progress: false
jobs:
  publish:
    name: Bounded native failure publication
    permissions:
      contents: read
      actions: read # Read native run metadata only; no failed-run artifacts or checkout.
      issues: write # Publish deduplicated failure Issues for the owning agent.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(fromJSON('["failure","timed_out","action_required","startup_failure","stale"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/actions/feedback@6c1b11e8a890bd3aa8e361ac467fafd78fa59efe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          workflows: '[".github/workflows/ci.yml",".github/workflows/main-ci.yml",".github/workflows/delivery-smoke.yml"]'
          events: '["push","schedule","workflow_dispatch","workflow_run"]'
          creators: '["rldyourmnd","dependabot[bot]"]'
          run-id: ${{ github.event.workflow_run.id || '' }}
