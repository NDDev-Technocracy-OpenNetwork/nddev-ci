# This repository's own daily security run, through the library's workflow.
name: security

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      issues: write
    # The configured-policy path, with the same list as licenses.md.
    with:
      license-policy: tests/fixtures/license-policy/deny.toml
