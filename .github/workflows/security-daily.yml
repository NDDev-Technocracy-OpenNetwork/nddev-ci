# This repository's own daily security run, through the library's workflow.
name: security

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      hosted-runner:
        description: The GitHub-hosted Linux runner of this run.
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        default: ubuntu-24.04

permissions: {}

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      issues: write
    # The configured-policy path, with the default allowlist.
    with:
      license-policy: tests/fixtures/license-policy/deny.toml
      hosted-runner: ${{ inputs.hosted-runner || 'ubuntu-24.04' }}
