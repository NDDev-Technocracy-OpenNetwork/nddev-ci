name: native asset workflow research
on:
  push:
    branches: [research/44-native-asset-workflow]
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      setup: true
      node-version: '26.13.0'
      python-version: '3.15.2'
      uv-version: '0.13.7'
      bun-version: '1.4.4'
      rust-version: '1.99.1'
      rust-components: clippy,rustfmt
      tool-assets: tests/fixtures/media-candidate/assets.json
